<!DOCTYPE html>
<html lang="en">

<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideFromLeft { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideFromRight { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  @keyframes sheetUp { from { opacity:0; transform:translateY(100%); } to { opacity:1; transform:translateY(0); } }

    0%   { opacity:0; transform:translateY(40px) scale(0.92); }

  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: 200px 0; }
  }
  .skeleton-line {
    height:12px; border-radius:6px; margin-bottom:8px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s ease infinite;

  /* ── Recording pulse rings ── */
  @keyframes recordPulse {
    0%   { transform:scale(1); opacity:0.4; }
    100% { transform:scale(2.2); opacity:0; }
  }
  @keyframes recordGlow {
    0%,100% { box-shadow:0 0 0 0 rgba(255,59,48,0); }
    50%     { box-shadow:0 0 20px 8px rgba(255,59,48,0.3); }
  }

    0%,80%,100% { opacity:0.2; }
    40% { opacity:1; }
  }

  /* ── Agent takeover: gradient wave erupts from button, fills screen ── */
  @keyframes agent-takeover {
    0%   { clip-path: circle(0%   at 50% 94%); opacity: 0.85; }
    60%  { clip-path: circle(80%  at 50% 94%); opacity: 1;    }
    100% { clip-path: circle(160% at 50% 94%); opacity: 1;    }

  /* ── Text wave: each line floats up as the gradient passes through ── */
  @keyframes text-wave {
    0%   { transform: translateY(0)    scaleX(1);    filter: blur(0px);   opacity: 1;   }
    25%  { transform: translateY(-14px) scaleX(1.015); filter: blur(2px);  opacity: 0.7; }

1. PRIORITIZE — Surface only messages that need the creator's attention: people asking about products or services, meaningful engagement (compliments, collaboration asks, genuine interactions), and questions the creator needs to answer directly. Filter everything else silently.

2. GROUP — Organize messages into three groups:
   • Interested in your services — anyone asking about a course, price, format, schedule, or showing purchase intent
   • Engaged — positive interactions, fans, people connecting warmly (not just a generic hello)
   • Questions — specific questions the creator needs to answer personally (info not in the automation)

6. REMIND — Flag conversations where the contact hasn't received a reply in 5+ days. The creator should follow up before the lead goes cold.`;

/* Figma: node 1085:62016 "purple background" — exact conic + blur from Figma variables */
const OB_PURPLE = {
  base: '#5400AF',       /* purple.700 — darkest stop */
  blurConic: 'conic-gradient(from 90deg at 50% 50%, #5400AF 0%, #590AB5 4.57%, #5F15BB 9.13%, #6A2AC8 18.27%, #7F53E0 36.54%, #6E30D4 63.94%, #6118C2 81.97%, #5B0CB8 90.99%, #5400AF 100%)',
  blur: 50,              /* Figma: blur(50px) */
};
const OB_GRID_ACCENT = '#00F6FF'; /* Electric Cyan — traveling highlight on rails */
const OB_GRID_MASK = 'radial-gradient(ellipse 85% 70% at 52% 48%, black 10%, rgba(0,0,0,0.45) 52%, transparent 82%)';

const OB_ICON = {
  onlyMatters: '#77CADF',
  repliesVoice: '#A5CA66',
  personalStuff: '#F14D33',
};

/* ─── Shared purple background + fixed grid; loading = pulses on rails (Tron-style) ─── */
function PurpleBg({ gridMode = 'idle' }) {
  const canvasRef = useRef(null);
  const loading = gridMode === 'loading';
  const lineH = loading ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.17)';
  const lineV = loading ? 'rgba(255,255,255,0.17)' : 'rgba(255,255,255,0.15)';

  useEffect(() => {
    if (!loading) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 393;
    const H = 852;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const CW = 84;
    const CH = 87;
    const vXs = [];
    for (let x = CW - 42; x < W; x += CW) vXs.push(x);
    const hYs = [];
    for (let y = 0; y <= H; y += CH) hYs.push(y);

    /* Electric Cyan — OB_GRID_ACCENT */
    const cyan = 'rgba(0,246,255,0.55)';

    function mkV(x) {
      return { x, y: Math.random() * H, speed: 0.9 + Math.random() * 1.4, len: 32 + Math.random() * 44 };
    }
    function mkH(y) {
      return { x: Math.random() * W, y, speed: 0.75 + Math.random() * 1.2, len: 36 + Math.random() * 50 };
    }
    const vSegs = vXs.map(mkV);
    const hSegs = hYs.map(mkH);

    let id;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 1.25;

      vSegs.forEach((w) => {
        w.y += w.speed;
        if (w.y > H + w.len) w.y = -w.len;
        const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.len);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.5)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.4)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x, w.y + w.len);
        ctx.stroke();
      });

      hSegs.forEach((w) => {
        w.x += w.speed;
        if (w.x > W + w.len) w.x = -w.len;
        const g = ctx.createLinearGradient(w.x, 0, w.x + w.len, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.32)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x + w.len, w.y);
        ctx.stroke();
      });

      id = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(id);
  }, [loading]);

  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', zIndex:0, pointerEvents:'none' }}>
      <div style={{
        position:'absolute', inset:'-20%',
        background: OB_PURPLE.blurConic,
        filter:`blur(${OB_PURPLE.blur}px)`,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(${lineH} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(90deg, ${lineV} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      {loading && (
        <canvas
          ref={canvasRef}
          style={{
            position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
            maskImage: OB_GRID_MASK, WebkitMaskImage: OB_GRID_MASK,
          }}
        />
      )}
    </div>
  );
}

/* ─── Step 2: Loading — grid motion via PurpleBg + cycling messages ─── */
function ObSorting({ onNext }) {
  const [msgIdx, setMsgIdx] = useState(0);
  const [msgVis, setMsgVis] = useState(true);

  const messages = [
    'Reading your DMs...',
    'Sorting what matters...',
    'Drafting replies...',
    'Almost ready...',
  ];

  // Cycle messages with a fade cross-dissolve
  useEffect(() => {
    const iv = setInterval(() => {
      setMsgVis(false);
      setTimeout(() => { setMsgIdx(i => (i + 1) % messages.length); setMsgVis(true); }, 280);
    }, 1100);
    return () => clearInterval(iv);
  }, []);

  // Auto-advance after 4s
  useEffect(() => {
    const t = setTimeout(onNext, 4000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative' }}>
      <div style={{ position:'relative', zIndex:2, opacity: msgVis ? 1 : 0, transition:'opacity 0.28s ease' }}>
        <span style={{
          fontSize:16, fontWeight:400,
          background:'linear-gradient(90deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,1) 40%, rgba(255,255,255,0.65) 60%, rgba(255,255,255,0.65) 100%)',
          backgroundSize:'200% auto',

    for (let i = 1; i <= 3; i++) timers.push(setTimeout(() => setVis(i), i * 500 + 200));

    const timers = [];
    for (let i = 1; i <= 4; i++) timers.push(setTimeout(() => setConfirmVis(i), i * 400 + 200));
    return () => timers.forEach(t => clearTimeout(t));
  }, [phase]);

  // Processing → confirm
  useEffect(() => {
    if (phase !== 'processing') return;
    const t = setTimeout(() => {

      setConfirmBottom('buttons');

    return () => clearTimeout(t);
  }, [phase]);

      {inputMode === 'typing' && (

          <textarea value={inputVal} onChange={e => setInputVal(e.target.value)} autoFocus

              <MicIcon size={18} color="rgba(255,255,255,0.5)" />

  /* ── CONFIRM phase ── */

      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'100px 28px 0' }}>
        <div style={{ marginBottom:12, ...cShow(1) }}>
          <h1 style={{ fontSize:34, fontWeight:900, color:'#fff', letterSpacing:'-0.04em', lineHeight:1.12, WebkitTextStroke:'0.5px #fff' }}>

        )}

        {/* Typing edit mode */}

/* ─── Sheet expansion via measured height — physically pushes chat body up ─── */
/* Measures content height, then transitions from 0→h so flex:1 chat shrinks live */
function SheetWrap({ children, delay }) {
  const [h, setH] = useState(0);
  const [stable, setStable] = useState(false);
  const inner = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => {
      const naturalH = inner.current ? inner.current.scrollHeight : 600;
      // Double RAF: ensure browser has painted height:0 before transitioning
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setH(naturalH);
        // After animation, release height so content can grow freely (e.g. Why section)
        setTimeout(() => setStable(true), 420);
      }));
    }, delay || 0);
    return () => clearTimeout(t);
  }, []);

  if (stable) return <div style={{ flexShrink:0 }}>{children}</div>;

  return (
    <div style={{
      flexShrink:0,
      height: h,
      overflow:'hidden',
      transition: h > 0 ? 'height 380ms cubic-bezier(0.32,0.72,0,1)' : 'none',
    }}>
      <div ref={inner}>{children}</div>
    </div>
  );
}

/* ─── Agent Sheet Shell — bottom sheet for ask / summary / undo / etc. ─── */
function AgentSheetShell({ children, onDismiss }) {
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startY = useRef(0);

  const handleTouchStart = (e) => { startY.current = e.touches[0].clientY; setDragging(true); };
  const handleMouseDown = (e) => { startY.current = e.clientY; setDragging(true); };
  const handleMove = (clientY) => {
    if (!dragging) return;
    setDragY(Math.max(0, clientY - startY.current));
  };
  const handleEnd = () => {
    setDragging(false);
    if (dragY > 100 && onDismiss) onDismiss();
    else setDragY(0);
  };

  return (
    <SheetWrap>
      <div style={{
        background:'#fff', borderRadius:24,
        border:'1px solid #D6D6D6',
        boxShadow:'0 8px 16px rgba(132,146,166,0.12)',
        padding:'0 24px 32px', margin:'0 16px 32px',
        display:'flex', flexDirection:'column', gap:16,
        transform:`translateY(${dragY}px)`,
        transition: dragging ? 'none' : 'transform .3s ease',
        opacity: dragging ? Math.max(0.5, 1 - dragY / 300) : 1,
      }}
        onTouchMove={e => handleMove(e.touches[0].clientY)}
        onMouseMove={e => { if (dragging) handleMove(e.clientY); }}
        onTouchEnd={handleEnd}
        onMouseUp={handleEnd}
        onMouseLeave={() => { if (dragging) handleEnd(); }}
      >
        <div onTouchStart={handleTouchStart} onMouseDown={handleMouseDown}
          style={{ padding:'14px 0 4px', cursor:'grab', flexShrink:0 }}>
          <div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} />
        </div>
        {children}
      </div>
    </SheetWrap>
  );
}

/* ═══ CHAT DETAIL ═══ */
function ChatDetail({ item, label, labelColor, onClose, isSensitive, onSent, sentMessage, draftMode, onSkipDraft, onDraftFeedback, isFirstSend, onFirstSend }) {
  const useSuggestMode = draftMode === 'suggest' && item.draft && !isSensitive;

  // Modes:
  // suggest — AI proposes next action at bottom
  // inline — draft shown in chat body, input at bottom (fallback after feedback)
  // editing — editing draft (works in both modes)
  // custom — user writing from scratch
  // sent — message sent
  // summary — sensitive message summary
  // feedback — AI asks why user keeps skipping drafts
  const getInitialMode = () => {
    if (isSensitive) return 'summary';
    if (item.mode === 'ask') return 'ask';
    if (!item.draft) return 'custom';
    if (sentMessage) return 'custom';
    return useSuggestMode ? 'suggest' : 'inline';
  };

  const [mode, setMode] = useState(getInitialMode);
  const [editVal, setEditVal] = useState(item.draft || '');
  const [customVal, setCustomVal] = useState('');
  const [showToast, setShowToast] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [sentMsgs, setSentMsgs] = useState([]);
  const [activeTone, setActiveTone] = useState(null);
  const [editFeedback, setEditFeedback] = useState(null); // null | 'asking' | 'done'
  const [customFeedback, setCustomFeedback] = useState(null); // null | 'asking' | 'done'
  const [feedbackEligible, setFeedbackEligible] = useState(false);
  const customInputRef = useRef(null);
  const [askVal, setAskVal] = useState('');
  const [askPhase, setAskPhase] = useState('input');
  const [showAskStyleReason, setShowAskStyleReason] = useState(false);
  const [generatedDraft, setGeneratedDraft] = useState('');
  const [generatedBecause, setGeneratedBecause] = useState('');
  const [showSendCelebration, setShowSendCelebration] = useState(false);
  const [undoCount, setUndoCount] = useState(0);
  const undoTimerRef = useRef(null);
  const originalDraft = item.draft || '';
  const chatBodyRef = useRef(null);
  const [agentHelpPhase, setAgentHelpPhase] = useState(null); // null | 'bubble' | 'sheet' | 'recording' | 'typeInput' | 'thinking' | 'draft'
  const [agentHelpInput, setAgentHelpInput] = useState('');
  const [agentHelpDraft, setAgentHelpDraft] = useState('');

  // Simple diff: percentage of words changed
  const calcEditDistance = (a, b) => {
    if (!a || !b) return 1;
    const words1 = a.toLowerCase().split(/\s+/);
    const words2 = b.toLowerCase().split(/\s+/);
    let matches = 0;
    words2.forEach(w => { if (words1.includes(w)) matches++; });
    return 1 - (matches / Math.max(words1.length, 1));
  };

  // Intent label + context menu
  const [intentLabel, setIntentLabel] = useState(item.intent || null);
  const [intentMenu, setIntentMenu] = useState(false); // false | 'main' | 'change' | 'why'
  const allIntents = ['Interested', 'FAQ', 'Collab', 'Emotional', 'Spam', 'Other'];

  // Reasoning bottom sheet
  const [reasoningSheet, setReasoningSheet] = useState(null); // null or { title, body }

  const intentColors = {
    'Interested':'#E8710A', 'FAQ':'#2952CC', 'Collab':'#7627BB',
    'Emotional':'#D93025', 'Spam':'#6F757E', 'Other':'#525960',
  };

  const triggerToast = (msg) => {
    setToastMsg(msg);
    setShowToast(true);
    setTimeout(() => setShowToast(false), 2500);
  };

  // Helper: split draft into 2 messages at sentence boundary
  const splitDraft = (draft) => {
    if (!draft) return [draft];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };

  const handleSend = () => {
    const wasEditing = (mode === 'editing');
    const msg = wasEditing ? editVal : item.draft;
    // When sending from agent card (not editing), split into 2 messages
    if (!wasEditing) {
      const parts = splitDraft(msg);
      setSentMsgs(prev => [...prev, ...parts]);
    } else {
      setSentMsgs(prev => [...prev, msg]);
    }
    setMode('sent');
    if (wasEditing) {
      const distance = calcEditDistance(originalDraft, editVal);
      if (distance > 0.5 && !activeTone) {
        // Major rewrite — ask what was off after a brief pause
        setTimeout(() => setEditFeedback('asking'), 1200);
      } else {
        triggerToast(activeTone
          ? 'Got it,' + activeTone.toLowerCase() + ' tone for similar messages.'
          : 'Noted. I\'ll adjust my style based on your edit.');
      }
    }
    if (onSent) onSent(item.user, msg);
    if (isFirstSend && onFirstSend) {
      onFirstSend();
      setShowSendCelebration(true);
      setTimeout(() => setShowSendCelebration(false), 1500);
    }
  };

  const handleSendCustom = () => {
    if (!customVal.trim()) return;
    setSentMsgs(prev => [...prev, customVal]);
    setMode('sent');
    setCustomVal('');
    if (onSent) onSent(item.user, customVal);
    setTimeout(() => {
      setMode('custom');
      if (feedbackEligible) {
        setCustomFeedback('asking');
        setFeedbackEligible(false);
      }
    }, 300);
  };

  const handleSendAgentDraft = () => {
    if (!agentHelpDraft.trim()) return;
    setSentMsgs(prev => [...prev, agentHelpDraft]);
    setMode('sent');
    if (onSent) onSent(item.user, agentHelpDraft);
    setAgentHelpPhase(null);
    triggerToast('Got it, I\'ll adjust for next time');
  };

  const handleIllReply = () => {
    if (onSkipDraft) {
      const count = onSkipDraft();
      if (count >= 5) {
        // 5th skip — trigger feedback
        setMode('feedback');
        return;
      }
    }
    setMode('custom');
    setCustomVal('');
    if (item.draft) setFeedbackEligible(true);
  };

  const handleAskSubmit = () => {
    if (!askVal.trim()) return;
    setAskPhase('generating');
    setTimeout(() => {
      const draft = (item.draftTemplate || '').replace('{answer}', askVal.trim());
      const styleR = item.styleReasonTemplate || '';
      setGeneratedDraft(draft);
      setGeneratedBecause(styleR);
      setAskPhase('ready');
    }, 1500);
  };

  const handleAskSend = () => {
    setSentMsgs(prev => [...prev, generatedDraft]);
    setMode('sent');
    triggerToast('Got it,I\'ll use this for similar questions.');
    if (onSent) onSent(item.user);
  };

  const handleFeedbackChoice = (reason) => {
    triggerToast('Got it,' + reason + '. I\'ll adjust.');
    if (onDraftFeedback) onDraftFeedback(); // switches parent to inline mode
    setMode('custom');
    setCustomVal('');
  };

  const handleUndo = () => {
    clearInterval(undoTimerRef.current);
    setSentMsgs(prev => prev.slice(0, -1));
    setUndoCount(0);
    setMode('undo');
  };

  // Auto-focus custom input when transitioning from suggest
  useEffect(() => {
    if (mode === 'custom' && customInputRef.current) {
      setTimeout(() => customInputRef.current?.focus(), 50);
    }
  }, [mode]);

  // Scroll chat to bottom on mode change — keep scrolling during sheet resize
  useEffect(() => {
    if (!chatBodyRef.current) return;
    const el = chatBodyRef.current;
    const scroll = () => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    if (mode === 'suggest' || mode === 'ask' || mode === 'summary') {
      // Sheet has a delay + height animation; keep scrolling as it resizes
      const scrollInterval = setInterval(scroll, 100);
      setTimeout(() => clearInterval(scrollInterval), 2000);
    } else {
      setTimeout(scroll, 50);
    }
  }, [mode]);

  // Show agent help bubble when user starts typing in a chat they already replied to
  useEffect(() => {
    if (!sentMessage) return;
    if (customVal.trim() && agentHelpPhase === null) {
      setAgentHelpPhase('bubble');
    } else if (!customVal.trim() && agentHelpPhase === 'bubble') {
      setAgentHelpPhase(null);
    }
  }, [customVal]);

  // Undo countdown when mode becomes 'sent'
  useEffect(() => {
    if (mode !== 'sent') return;
    setUndoCount(5);
    let count = 5;
    undoTimerRef.current = setInterval(() => {
      count -= 1;
      setUndoCount(count);
      if (count <= 0) clearInterval(undoTimerRef.current);
    }, 1000);
    return () => clearInterval(undoTimerRef.current);
  }, [mode]);

  // Conversation history — use item.chatHistory if provided, otherwise generate default
  const chatHistory = item.chatHistory || [
    ...(item.source === 'DM' ? [{ from: 'them', text: 'Hey!', time: '2h ago' }] : []),
    { from: 'them', text: item.msg, time: item.time || '2h ago' },
  ];

  const sheetActive = (
    (mode === 'suggest' && !!item.draft) ||
    mode === 'ask' || mode === 'summary' || mode === 'undo' || mode === 'feedback' ||
    (!!agentHelpPhase && agentHelpPhase !== 'bubble' && mode === 'custom')
  );

  return (
    <div className="screen-slide-in" onClick={(e) => e.stopPropagation()}
      style={{ position:'absolute', inset:0, zIndex:100,
        display:'flex', flexDirection:'column',
        background: T.paper,
        overflow:'hidden',
      }}>

    {/* ═══ CHAT CARD — flex:1 ═══ */}
    <div style={{
      flex:1, minHeight:0,
      background:T.paper,
      display:'flex', flexDirection:'column',
      overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{ padding:'48px 16px 10px', display:'flex', alignItems:'center', gap:12, borderBottom:'1px solid #D6D6D6', flexShrink:0 }}>
        <div onClick={(e) => { e.stopPropagation(); onClose(); }} style={{ cursor:'pointer', padding:'8px', margin:'-8px' }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        {item.avatar && <img src={item.avatar} alt="" style={{ width:32, height:32, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)', flexShrink:0 }} />}
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:14, fontWeight:500, color:'#292929', lineHeight:'20px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</div>
          <div onClick={(e) => { e.stopPropagation(); setReasoningSheet({ title: 'Why ' + (item.intent || 'this classification'), body: item.context || 'No additional context available.' }); }}
            style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px', display:'flex', alignItems:'center', gap:4, cursor:'pointer' }}>
            <span>{item.intent || 'DM'}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </div>

      {/* Chat body */}
      <div ref={chatBodyRef} style={{ flex:1, minHeight:0, overflowY:'auto', padding:'12px 16px 12px', display:'flex', flexDirection:'column', gap:12 }}>
        {/* Timestamp marker */}
        <div style={{ textAlign:'center' }}>
          <span style={{ fontSize:12, color:'#707070', lineHeight:'16px' }}>Today {item.time || '8:10 AM'}</span>
        </div>

        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {chatHistory.map((m, i) => {
          const isOutgoing = m.from === 'you' || m.from === 'automation';
          const isAutomation = m.from === 'automation';
          const isLast = i === chatHistory.length - 1 || chatHistory[i+1]?.from !== m.from;

          // Airbnb corners: 12px all, 2px on tail corner for last in group
          const radius = m.from === 'them'
            ? (isLast ? '12px 12px 12px 2px' : '12px')
            : (isLast ? '12px 12px 2px 12px' : '12px');

          // Colors per type
          const bubbleBg = isAutomation ? '#FCF0FF' : (m.from === 'you' ? '#C2DBFF' : '#F5F5F5');

          return (
            <div key={i}>
              {/* Outgoing: bubble + small avatar/icon row */}
              {isOutgoing ? (
                <div style={{ display:'flex', gap:4, alignItems:'flex-end', justifyContent:'flex-end', paddingLeft:50 }}>
                  <div style={{ flex:1, padding:'12px 16px', borderRadius:radius, background:bubbleBg, opacity:0.89 }}>
                    {isAutomation && (
                      <div style={{ fontSize:12, fontWeight:500, color:'#AB3EC1', lineHeight:'16px', marginBottom:2 }}>Automation</div>
                    )}
                    <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>{m.text}</div>
                  </div>
                  {/* 20px avatar/icon */}
                  {isAutomation ? (
                    <div style={{ width:20, height:20, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AB3EC1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                    </div>
                  ) : (
                    <img src="https://i.pravatar.cc/40?u=sofiacoach" alt="" style={{ width:20, height:20, borderRadius:400, objectFit:'cover', flexShrink:0, border:'0.5px solid rgba(44,50,58,0.12)' }} />
                  )}
                </div>
              ) : (
                /* Incoming: left-aligned contact bubble */
                <div style={{ paddingRight:50 }}>
                  <div style={{ display:'inline-block', padding:'10px 16px', borderRadius:radius, background:bubbleBg, opacity:0.89, maxWidth:288 }}>
                    <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>{m.text}</div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        </div>

        {/* Summary removed from chat body — agent explains in bottom sheet */}

        {/* Inline draft (fallback mode — draft shown in chat body) */}
        {mode === 'inline' && item.draft && (
          <div className="fade-up" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11, color:T.gray, marginBottom:4, fontWeight:500 }}>Inbox Agent</div>
            <div style={{ display:'flex', justifyContent:'flex-end' }}>
              <div style={{ maxWidth:'85%' }}>
                <div style={{ padding:'13px 16px', borderRadius:18, borderTopRightRadius:6, border:`1.5px dashed ${T.lightGray}`, background:T.warmGray }}>
                  <div style={{ fontSize:14, lineHeight:1.5, color:T.ink, letterSpacing:'-0.01em' }}>{item.draft}</div>
                </div>
                <div style={{ display:'flex', gap:6, marginTop:8 }}>
                  <button onClick={handleSend} style={{ padding:'7px 16px', background:'#2952CC', color:'#fff', border:'none', borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer' }}>Send</button>
                  <button onClick={() => { setMode('editing'); setEditVal(item.draft); }} style={{ padding:'7px 14px', background:'transparent', border:`1px solid ${T.lightGray}`, borderRadius:20, fontSize:12, fontWeight:500, cursor:'pointer', color:T.ink }}>Edit</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Sent messages — grouped with Airbnb corners, avatar only on last */}
        {sentMsgs.map((msg, i) => {
          const isLast = i === sentMsgs.length - 1;
          const radius = isLast ? '12px 12px 2px 12px' : '12px';
          return (
            <div key={i} className={isLast ? 'fade-up' : ''} style={{ display:'flex', gap:4, alignItems:'flex-end', justifyContent:'flex-end', paddingLeft:50 }}>
              <div style={{ maxWidth:288, padding:'12px 16px', borderRadius:radius, background:'#C2DBFF', opacity:0.89 }}>
                <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>{msg}</div>
              </div>
              {isLast ? (
                <img src={CREATOR_AVATAR} alt="" style={{ width:20, height:20, borderRadius:400, objectFit:'cover', flexShrink:0, border:'0.5px solid rgba(44,50,58,0.12)' }} />
              ) : (
                <div style={{ width:20, flexShrink:0 }} />
              )}
            </div>
          );
        })}

        {/* Edit feedback moved to bottom section */}
      </div>

    </div>{/* ─── end chat card ─── */}

    {/* ═══ AGENT CARDS — below the chat, above input ═══ */}

    {/* Suggest mode */}
    {mode === 'suggest' && item.draft && <AgentSheet item={item} onSend={handleSend} onEdit={() => { setMode('editing'); setEditVal(item.draft); setFeedbackEligible(true); }} onSkip={handleIllReply} onWhy={() => setReasoningSheet({ title:'Reply reasoning', body: item.styleReason || item.context || '' })} />}

    {/* ═══ Message Input — hidden during suggest mode, slides up when agent card dismissed ═══ */}
    {mode !== 'suggest' && (
      <div style={{ margin:'0 16px 32px', flexShrink:0, animation:'toastUp .4s cubic-bezier(.25,.46,.45,.94) both' }}>
        {/* Follow-up question — shows after user edits/dismisses/types instead of sending directly */}
        {/* Edit feedback — same style as follow-up card */}
        {editFeedback === 'asking' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>I noticed you changed my reply a lot. Was it off?</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {['Not my tone', 'Wrong info', 'I just wanted to personalize'].map(reason => (
                <button key={reason} onClick={() => {
                  setEditFeedback('done');
                  triggerToast(reason === 'I just wanted to personalize'
                    ? 'Got it — draft was fine, you wanted your touch.'
                    : 'Got it — ' + reason.toLowerCase() + '. I\'ll adjust.');
                }}
                  style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>{reason}</button>
              ))}
            </div>
          </div>
        )}

        {/* Follow-up feedback — after user ignored/dismissed the agent draft */}
        {mode === 'custom' && customFeedback === 'asking' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>Was my reply helpful as a starting point?</div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => { setCustomFeedback('done'); triggerToast('Got it — glad it helped.'); }}
                style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>Yes</button>
              <button onClick={() => setCustomFeedback('why')}
                style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>No</button>
            </div>
          </div>
        )}

        {/* Why feedback — shown after user taps No */}
        {mode === 'custom' && customFeedback === 'why' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>What wasn't right?</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
              {['Tone was off', 'Wrong info', 'Too long', 'I wrote my own'].map(reason => (
                <button key={reason} onClick={() => { setCustomFeedback('done'); triggerToast('Got it, I\'ll do better next time.'); }}
                  style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>
                  {reason}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* The actual input field */}
        <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:8, display:'flex', flexDirection:'column', gap: mode === 'editing' ? 8 : 0 }}>
          <div style={{ display:'flex', gap:8, alignItems:'flex-end' }}>
            <div style={{ width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:12, flexShrink:0 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            {mode === 'editing' ? (
              <textarea value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus
                ref={el => { if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }}
                style={{ flex:1, fontSize:16, color:'#292929', lineHeight:'24px', border:'none', outline:'none', resize:'none', minHeight:24, maxHeight:200, fontFamily:'Inter, system-ui, sans-serif', background:'transparent', overflow:'auto' }} />
            ) : (
              <input ref={customInputRef} value={customVal} onChange={e => setCustomVal(e.target.value)}
                placeholder="Reply..."
                onKeyDown={e => { if (e.key === 'Enter' && customVal.trim()) handleSendCustom(); }}
                style={{ flex:1, fontSize:16, color: customVal ? '#292929' : '#878787', lineHeight:'24px', border:'none', outline:'none', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
            )}
            {(mode === 'editing' ? editVal.trim() : customVal.trim()) ? (
              <div onClick={mode === 'editing' ? handleSend : handleSendCustom}
                style={{ width:36, height:36, borderRadius:20, background:'#006BE2', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </div>
            ) : (
              <div style={{ width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:12, flexShrink:0 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </div>
            )}
          </div>
          {/* Tone pills — only in edit mode */}
          {mode === 'editing' && (
            <div style={{ display:'flex', gap:4, paddingLeft:44 }}>
              {['Friendly','Formal','Shorter','Direct'].map(tone => (
                <div key={tone} onClick={() => {
                  setActiveTone(tone);
                  const base = originalDraft;
                  if (tone === 'Shorter') setEditVal(base.split(/(?<=[.!?])\s+/).slice(0,2).join(' '));
                  else if (tone === 'Friendly') setEditVal('Hey! ' + base.charAt(0).toLowerCase() + base.slice(1));
                  else if (tone === 'Formal') setEditVal('Thank you for reaching out. ' + base.replace(/!/g, '.'));
                  else if (tone === 'Direct') setEditVal(base.split(/(?<=[.!?])\s+/).filter(s => s.length > 20).join(' '));
                }}
                  style={{ background: activeTone === tone ? '#292929' : '#F5F5F5', borderRadius:8, padding:'8px 12px', cursor:'pointer' }}>
                  <span style={{ fontSize:12, fontWeight:500, color: activeTone === tone ? '#fff' : '#292929', lineHeight:'16px' }}>{tone}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    )}

    {/* Message input removed from suggest mode — only appears after agent card is dismissed */}

    {/* Reasoning Bottom Sheet */}
    {reasoningSheet && (
      <ReasoningSheet
        title={reasoningSheet.title}
        body={reasoningSheet.body}
        onClose={() => setReasoningSheet(null)}
        showSources={true}
        showFeedback={true}
      />
    )}

    {/* Toast */}
    {showToast && (
      <div style={{ position:'absolute', bottom:100, left:0, right:0, display:'flex', justifyContent:'center', zIndex:110, animation:'toastUp .4s cubic-bezier(.25,.46,.45,.94) both' }}>
        <div style={{ background:T.ink, color:'#fff', padding:'10px 20px', borderRadius:12, fontSize:13, fontWeight:500, whiteSpace:'nowrap', boxShadow:'0 4px 16px rgba(0,0,0,0.12)', letterSpacing:'-0.01em' }}>
          {toastMsg}
        </div>
      </div>
    )}

  </div>
  );
}

/* ─── Chevron icon ─── */
function ChevronIcon({ collapsed }) {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ transition:'transform .25s ease', transform: collapsed ? 'rotate(-90deg)' : 'rotate(0deg)' }}>
      <polyline points="6 9 12 15 18 9" />
    </svg>
  );
}

/* ─── Intention group header ─── */
function IntentionIcon({ type }) {
  if (type === 'fire') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M12 2c0 0-4 4.5-4 9a4 4 0 0 0 8 0c0-2.5-1.5-4.5-2-5.5C13.5 7.5 13 9 12 9c-1 0-1.5-1-1-3z"/>
      <path d="M9 17c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2"/>
    </svg>
  );
  if (type === 'star') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
  );
  if (type === 'urgent') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  );
  return null;
}

function IntentionHeader({ label, icon, collapsed, onToggle }) {
  const [stuck, setStuck] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => setStuck(e.intersectionRatio < 1), { threshold:[1], rootMargin:'-1px 0px 0px 0px' });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} onClick={onToggle} style={{ padding:'16px 0 8px', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', position:'sticky', top:-1, background:'#fff', zIndex:5, borderBottom: stuck ? '1px solid #E0E0E0' : '1px solid transparent', transition:'border-color .15s ease' }}>
      <span style={{ fontSize:17, fontWeight:700, color:'#292929', lineHeight:'26px', letterSpacing:'-0.306px' }}>{label}</span>
      <ChevronIcon collapsed={collapsed} />
    </div>
  );
}

/* ─── Important Tab ─── */
function ImportantTab({ onOpenChat, answeredChats, viewedChats = [], priorityFeedbackDone, onFeedbackGood, onFeedbackBad, headerHidden, onShowReasoning }) {
  const [collapsedGroups, setCollapsedGroups] = useState(new Set());
  const [showInfoModal, setShowInfoModal] = useState(false);
  const [showHistory, setShowHistory] = useState(false);

  const totalPending = IMPORTANT_GROUPS.reduce((sum, g) => sum + g.items.filter(item => !answeredChats.has(item.user)).length, 0);

  const toggleGroup = (gi) => {
    setCollapsedGroups(prev => {
      const next = new Set(prev);
      next.has(gi) ? next.delete(gi) : next.add(gi);
      return next;
    });
  };

  return (
    <div style={{ position:'relative' }}>
      {/* Header — Inbox title, hides on scroll */}
      <div style={{ padding:'8px 0', position:'relative', maxHeight: headerHidden ? 0 : 60, opacity: headerHidden ? 0 : 1, overflow:'hidden', transition:'max-height .25s ease, opacity .2s ease' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontSize:28, fontWeight:700, color:'#292929', lineHeight:'38px', letterSpacing:'-0.392px' }}>Inbox</span>
          {/* History button — only shows after user has opened at least one chat */}
          {viewedChats.length > 0 && (
            <div onClick={() => setShowHistory(h => !h)} style={{ width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', borderRadius:8 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
          )}
        </div>
      </div>

      {/* History popover — outside header to avoid overflow:hidden clipping */}
      {showHistory && viewedChats.length > 0 && (
        <>
          <div onClick={() => setShowHistory(false)} style={{ position:'fixed', inset:0, zIndex:150 }} />
          <div className="fade-in" style={{ position:'absolute', top:56, right:0, zIndex:151, background:'#fff', borderRadius:16, boxShadow:'0 4px 24px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06)', minWidth:260, maxWidth:300, overflow:'hidden' }}>
            <div style={{ padding:'14px 16px 8px', fontSize:13, fontWeight:500, color:T.gray }}>History</div>
            <div style={{ paddingBottom:8 }}>
              {viewedChats.map((item) => (
                <div key={item.user} onClick={() => { onOpenChat(item, '', T.gray, !!item._sensitive); setShowHistory(false); }}
                  style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', cursor:'pointer' }}>
                  <img src={item.avatar} alt="" style={{ width:32, height:32, borderRadius:16, objectFit:'cover', flexShrink:0 }} />
                  <span style={{ flex:1, fontSize:14, fontWeight:500, color:T.ink, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</span>
                  {answeredChats.has(item.user) && (

function useCountUp(target, duration, active) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = Date.now();
    const timer = setInterval(() => {
      const elapsed = Date.now() - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.round(eased * target));
      if (progress >= 1) clearInterval(timer);
    }, 16);
    return () => clearInterval(timer);
  }, [active]);
  return val;
}

function App() {

  const [hideNav, setHideNav] = useState(false);
  const onOnboarding = screen === 'ob-welcome' || screen === 'ob-loading' || screen === 'ob-results';
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden' }}>

      {/* ─── Onboarding: persistent purple + grid; step content fades in ─── */}
      {onOnboarding && (
        <div style={{ position:'absolute', inset:0, background: OB_PURPLE.base, zIndex:0 }}>
          <PurpleBg gridMode={screen === 'ob-loading' ? 'loading' : 'idle'} />

            style={{ position:'absolute', inset:0, zIndex:1 }}

            {screen === 'ob-welcome' && <ObWelcomeV2b onNext={() => setScreen('ob-loading')} />}

            {screen === 'ob-results' && <ObResultsV2b onOpenInbox={() => setScreen('main')} />}
          </div>
        </div>
      )}

      {/* ─── Inbox ─── */}
      {screen === 'main' && (
        <div style={{ position:'absolute', inset:0, animation:'fadeIn 0.45s ease both' }}>
          <InboxV2 onOverlayChange={(open) => setHideNav(open)} />

      )}

      {/* Bottom Nav — visible on welcome + main inbox, hidden on loading/results/overlays */}
      {(screen === 'ob-welcome' || screen === 'main') && <BottomNav hidden={hideNav} />}
    </div>
  );
}

  /* Animations */
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeSlideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideFromLeft { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:translateX(0); } }
  @keyframes slideFromRight { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }

  @keyframes screenSlideOut { from { transform:translateX(0); } to { transform:translateX(100%); } }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  @keyframes sheetUp { from { opacity:0; transform:translateY(100%); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }
  .fade-up { animation: fadeUp .4s cubic-bezier(.25,.46,.45,.94) both; }
  .fade-in { animation: fadeIn .3s ease both; }
  .sheet-up { animation: sheetUp .45s cubic-bezier(.32,.72,.35,1.01) both; }

    0%   { opacity:0; transform:translateY(40px) scale(0.92); }
    100% { opacity:1; transform:translateY(0) scale(1); }

  .pill-expand { animation: pillExpandIn .4s cubic-bezier(.16,1,.3,1) both; }
  .cursor-blink { display:inline-block; width:2px; height:14px; background:rgba(255,255,255,0.6); margin-left:2px; vertical-align:text-bottom; animation: blink .8s step-end infinite; }
  @keyframes shimmer {
    0%   { background-position: -200px 0; }
    100% { background-position: 200px 0; }
  }
  .skeleton-line {
    height:12px; border-radius:6px; margin-bottom:8px;
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
    background-size: 400px 100%;
    animation: shimmer 1.4s ease infinite;
  }

  /* ── Recording pulse rings ── */
  @keyframes recordPulse {
    0%   { transform:scale(1); opacity:0.4; }
    100% { transform:scale(2.2); opacity:0; }
  }
  @keyframes recordGlow {
    0%,100% { box-shadow:0 0 0 0 rgba(255,59,48,0); }
    50%     { box-shadow:0 0 20px 8px rgba(255,59,48,0.3); }
  }
  @keyframes thinkDots {
    0%,80%,100% { opacity:0.2; }
    40% { opacity:1; }
  }

  /* ── Agent takeover: gradient wave erupts from button, fills screen ── */
  @keyframes agent-takeover {
    0%   { clip-path: circle(0%   at 50% 94%); opacity: 0.85; }
    60%  { clip-path: circle(80%  at 50% 94%); opacity: 1;    }
    100% { clip-path: circle(160% at 50% 94%); opacity: 1;    }
  }
  /* ── Text wave: each line floats up as the gradient passes through ── */
  @keyframes text-wave {
    0%   { transform: translateY(0)    scaleX(1);    filter: blur(0px);   opacity: 1;   }
    25%  { transform: translateY(-14px) scaleX(1.015); filter: blur(2px);  opacity: 0.7; }
    55%  { transform: translateY(6px)  scaleX(0.99); filter: blur(0.5px); opacity: 0.9; }

    100% { transform: translateY(0)    scaleX(1);    filter: blur(0px);   opacity: 1;   }
  }

  ::-webkit-scrollbar { display:none; }

  /* Mobile responsive */
  @media (max-width:420px) {
    body { background:#FFFFFF; align-items:flex-start; }
    #root { width:100vw; height:100vh; height:100dvh; border-radius:0; box-shadow:none; }

1. PRIORITIZE — Surface only messages that match: people interested in my products or services, true fans engaging meaningfully, urgent matters, or questions you cannot answer alone. Everything else is filtered silently.

2. DECIDE — Read every incoming DM and decide if it needs the creator's attention based on their profile, goals, and sales funnel. A generic "Hello" does not qualify. A "how much is the course?" always does.

3. GROUP — Show the most important messages grouped by intent: needs a reply now, question I can't answer, follow-up reminder. Surface in order of urgency.

4. DRAFT — For each important message, write a reply the creator can send with one tap. Write like a human: warm, short, chunked into 2–3 natural messages. Match the contact's language (Spanish if they write in Spanish, English if English). Never sound like a bot.

5. ESCALATE — If a question requires information you don't have (specific dates, pricing tiers, policies), flag it and ask the creator to fill in the blank before sending.

6. FILTER — Raise the bar automatically when volume is high. Generic greetings, reactions, and clearly personal messages are filtered out silently. Never surface more than the creator can realistically handle.

7. REMIND — Flag any important conversation where the contact hasn't replied in 5+ days. The creator should follow up before the lead goes cold.

8. DAILY SUMMARY — Each day: how many messages reviewed, how many filtered, how many replies drafted, what's still pending.`;

/* ═══ SHARED COMPONENTS ═══ */
function BlackBtn({ label, onClick, disabled }) {
  return (
    <button onClick={onClick} disabled={disabled}
      style={{ width:'100%', padding:'14px 0', background: disabled ? T.lightGray : '#2952CC', color: disabled ? T.gray : '#FFFFFF',

/* ─── NEW Step 2: "Watch Me Work" — Live Processing Feed ─── */
function ObSorting({ onNext }) {
  // 142 DMs — first ones slow & readable, then accelerates
  const dmFeed = [
    { user:'@jayrunz', snippet:'"Is it too late to start?"', important:true, speed:'slow' },
    { user:'@mike', snippet:'"What\'s in the premium program?"', important:true, speed:'slow' },
    { user:'@sarah_m', snippet:'"love this!"', important:false, speed:'slow' },
    { user:'@lena.fit', snippet:'"I\'ve tried everything..."', important:true, speed:'slow' },
    { user:'@emma_k', snippet:'"Nervous about the cost"', important:true, speed:'slow' },
    { user:'@spam_1', snippet:'"Free followers! Click here"', important:false, speed:'medium' },
    { user:'@brand_co', snippet:'"Partnership — 200k followers"', important:true, speed:'medium' },
    { user:'@user_42', snippet:'"thanks!"', important:false, speed:'medium' },
    { user:'@fit_mom', snippet:'"Can I reschedule?"', important:false, speed:'medium' },
    { user:'@ana_r', snippet:'"Going through a hard time..."', important:true, speed:'medium' },
    { user:'@random_1', snippet:'"hey"', important:false, speed:'medium' },
    { user:'@carlos_m', snippet:'"Do you ship internationally?"', important:false, speed:'medium' },
    ...Array.from({ length: 130 }, (_, i) => {
      const names = ['@user_','@fan_','@dm_','@msg_','@follower_','@insta_','@reply_','@ask_','@note_','@ping_'];
      const snippets = ['"hey"','"thanks!"','"nice post"','"love it"','"cool"','"hi there"','"great content"','"wow"','"amazing"','"send link"','"when?"','"how much?"','"interested"','"question..."','"."','"hi!"','"sup"','"love this"','"awesome"','"more info?"'];
      const isImportant = (i === 22 || i === 67);
      const snip = isImportant ? ['"12-week course — sign me up"','"I want to collaborate"'][i === 22 ? 0 : 1] : snippets[i % snippets.length];
      return { user: names[i % names.length] + (i + 10), snippet: snip, important: isImportant, speed: 'fast' };
    }),
  ];

  const [items, setItems] = useState([]);
  const [phase, setPhase] = useState('processing');
  const feedRef = useRef(null);
  const timers = useRef([]);
  const speedMap = { slow: 600, medium: 250, fast: 20 };

  useEffect(() => {
    let cum = 500;
    dmFeed.forEach((dm, i) => {
      timers.current.push(setTimeout(() => {
        setItems(prev => [...prev, { ...dm, sorted: false }]);
        if (feedRef.current) setTimeout(() => { feedRef.current.scrollTop = feedRef.current.scrollHeight; }, 20);
      }, cum));
      const sortDelay = dm.speed === 'slow' ? 350 : dm.speed === 'medium' ? 150 : 15;
      timers.current.push(setTimeout(() => {
        setItems(prev => prev.map((it, idx) => idx === i ? { ...it, sorted: true } : it));
      }, cum + sortDelay));
      cum += speedMap[dm.speed];
    });
    timers.current.push(setTimeout(() => setPhase('summary'), cum + 300));
    timers.current.push(setTimeout(onNext, cum + 1200));
    return () => timers.current.forEach(t => clearTimeout(t));
  }, []);

  return (
    <div style={{ background:'#151515', height:'100%', display:'flex', flexDirection:'column', position:'relative' }}>
      <div style={{ padding:'56px 24px 0', flexShrink:0 }}>
        <div style={{ fontSize:10, fontWeight:700, color:'rgba(255,255,255,0.3)', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:16 }}>
          Processing your inbox
        </div>
      </div>
      <div ref={feedRef} style={{ flex:1, overflowY:'auto', padding:'0 24px', maskImage:'linear-gradient(to bottom, transparent 0%, black 6%, black 88%, transparent 100%)', WebkitMaskImage:'linear-gradient(to bottom, transparent 0%, black 6%, black 88%, transparent 100%)' }}>
        {items.map((dm, i) => {
          const isFast = dm.speed === 'fast';
          const slideDir = dm.sorted ? (dm.important ? 1 : -1) : 0;
          const slideX = slideDir * (isFast ? 60 : 40);
          return (
            <div key={i} style={{ display:'flex', alignItems:'center', gap:10, padding: isFast ? '4px 0' : '7px 0', opacity: dm.sorted ? (isFast ? 0.15 : 0.35) : (isFast ? 0.5 : 0.9), transform:`translateX(${slideX}px)`, transition:'transform .4s cubic-bezier(.25,.46,.45,.94), opacity .4s ease', animation: !dm.sorted ? 'fadeUp .25s ease both' : 'none' }}>
              <div style={{ width:16, height:16, borderRadius:8, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', opacity: dm.sorted ? 1 : 0, transition:'opacity .3s ease', background: dm.important ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.06)' }}>
                {dm.sorted && (dm.important
                  ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                  : <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.35)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                )}
              </div>
              <div style={{ flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontSize: isFast ? 12 : 14, letterSpacing:'-0.01em', color: dm.sorted ? (dm.important ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.25)') : 'rgba(255,255,255,0.75)', transition:'color .3s ease' }}>
                <span style={{ fontWeight:600, color: dm.sorted && dm.important ? '#fff' : 'inherit' }}>{dm.user}</span>
                <span style={{ fontWeight:400 }}> · {dm.snippet}</span>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ flexShrink:0, padding:'16px 24px 50px', borderTop:'1px solid rgba(255,255,255,0.06)' }}>
        {phase === 'processing' && (
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ width:6, height:6, borderRadius:3, background:'#0095F6', animation:'pulse 1s ease-in-out infinite' }} />
            <span style={{ fontSize:13, color:'rgba(255,255,255,0.4)', fontWeight:500 }}>{items.length} messages processed</span>
          </div>
        )}
        {phase === 'summary' && (
          <div className="fade-up" style={{ fontSize:14, fontWeight:600, color:'#fff', letterSpacing:'-0.01em' }}>
            142 reviewed · 8 need you · 12 replies drafted
          </div>
        )}
      </div>
    </div>
  );
}

/* ─── Business question — voice/type → recording → processing → confirmation ─── */
function ObQuestion({ onNext }) {
  // Phases: ask | recording | processing | confirm | fantastic
  const [phase, setPhase] = useState('ask');
  const [inputMode, setInputMode] = useState('voice'); // voice | typing
  const [inputVal, setInputVal] = useState('');
  const [vis, setVis] = useState(0);
  const [confirmVis, setConfirmVis] = useState(0);
  const [confirmBottom, setConfirmBottom] = useState('buttons'); // buttons | voice | typing
  const [revision, setRevision] = useState(0);

  // Each revision shows a different title + summary — the agent is learning
  const revisions = [
    {
      title: "Did I get it right?",
      subtitle: "Here's what I found about your business.",
      summary: "I run a fitness coaching business called Sofia Reyes Coaching. My main offer is a 12-Week Reboot program with weekly 1-on-1 calls, custom meal plans, and a private community. I also have a 4-Week Kickstart for beginners. Most of my leads come from Instagram DMs and post comments.",
    },
    {

        {connected && (
          <div className="fade-in" style={{
            position:'absolute', width:14, height:14, borderRadius:7,

            top:33, left:58, zIndex:3,

          }} />
        )}
      </div>

      {/* Step labels */}
      <div style={{ display:'flex', flexDirection:'column', gap:10, alignItems:'center' }}>
        {steps.map((s, i) => (
          <div key={i} style={{
            fontSize:15, fontWeight: i === step - 1 ? 600 : 400,

            transition:'all .45s ease',

              <span style={{ width:14, display:'inline-block' }} />
            )}
            {s}
          </div>
        ))}
      </div>
    </div>
  );

/* ─── Sheet expansion via measured height — physically pushes chat body up ─── */
/* Measures content height, then transitions from 0→h so flex:1 chat shrinks live */
function SheetWrap({ children, delay }) {
  const [h, setH] = useState(0);
  const [stable, setStable] = useState(false);
  const inner = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => {
      const naturalH = inner.current ? inner.current.scrollHeight : 600;
      // Double RAF: ensure browser has painted height:0 before transitioning
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setH(naturalH);
        // After animation, release height so content can grow freely (e.g. Why section)
        setTimeout(() => setStable(true), 420);
      }));
    }, delay || 0);
    return () => clearTimeout(t);
  }, []);

  if (stable) return <div style={{ flexShrink:0 }}>{children}</div>;

  return (
    <div style={{
      flexShrink:0,
      height: h,
      overflow:'hidden',
      transition: h > 0 ? 'height 380ms cubic-bezier(0.32,0.72,0,1)' : 'none',
    }}>
      <div ref={inner}>{children}</div>
    </div>
  );
}

/* ─── Agent Sheet Shell — bottom sheet for ask / summary / undo / etc. ─── */
function AgentSheetShell({ children, onDismiss }) {
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startY = useRef(0);

  const handleTouchStart = (e) => { startY.current = e.touches[0].clientY; setDragging(true); };
  const handleMouseDown = (e) => { startY.current = e.clientY; setDragging(true); };
  const handleMove = (clientY) => {
    if (!dragging) return;
    setDragY(Math.max(0, clientY - startY.current));
  };
  const handleEnd = () => {
    setDragging(false);
    if (dragY > 100 && onDismiss) onDismiss();
    else setDragY(0);
  };

  return (
    <SheetWrap>
      <div style={{
        background:'#fff', borderRadius:'24px 24px 0 0',
        padding:'0 24px 54px',
        display:'flex', flexDirection:'column', gap:16,
        transform:`translateY(${dragY}px)`,
        transition: dragging ? 'none' : 'transform .3s ease',
        opacity: dragging ? Math.max(0.5, 1 - dragY / 300) : 1,
      }}
        onTouchMove={e => handleMove(e.touches[0].clientY)}
        onMouseMove={e => { if (dragging) handleMove(e.clientY); }}
        onTouchEnd={handleEnd}
        onMouseUp={handleEnd}
        onMouseLeave={() => { if (dragging) handleEnd(); }}
      >
        <div onTouchStart={handleTouchStart} onMouseDown={handleMouseDown}
          style={{ padding:'14px 0 4px', cursor:'grab', flexShrink:0 }}>
          <div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} />
        </div>
        {children}
      </div>
    </SheetWrap>
  );
}

/* ─── Agent Sheet — white bottom sheet ─── */
function AgentSheet({ item, onSend, onEdit, onSkip }) {
  const [phase, setPhase] = useState('thinking');
  const [showWhy, setShowWhy] = useState(false);
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [dismissed, setDismissed] = useState(false);
  const dragStartY = useRef(0);

  useEffect(() => {
    const timer = setTimeout(() => setPhase('ready'), 800);
    return () => clearTimeout(timer);
  }, []);

  const handleTouchStart = (e) => { dragStartY.current = e.touches[0].clientY; setDragging(true); };
  const handleMouseDown = (e) => { dragStartY.current = e.clientY; setDragging(true); };
  const handleMove = (clientY) => {
    if (!dragging) return;
    const delta = clientY - dragStartY.current;
    if (delta > 0) setDragY(delta);
  };
  const handleEnd = () => {
    setDragging(false);
    if (dragY > 120) { setDismissed(true); setTimeout(onSkip, 300); }
    else { setDragY(0); }
  };

  useEffect(() => {
    if (!dragging) return;
    const onTouchMove = (e) => handleMove(e.touches[0].clientY);
    const onMouseMove = (e) => handleMove(e.clientY);
    const onEnd = () => handleEnd();
    window.addEventListener('touchmove', onTouchMove, { passive:true });
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('touchend', onEnd);
    window.addEventListener('mouseup', onEnd);
    return () => {
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('touchend', onEnd);
      window.removeEventListener('mouseup', onEnd);
    };
  }, [dragging, dragY]);

  return (
    <SheetWrap delay={1000}>
      <div
      style={{
        background:'#fff', borderRadius:'24px 24px 0 0',
        transform:`translateY(${dismissed ? '100%' : dragY + 'px'})`,
        transition: dragging ? 'none' : dismissed ? 'transform .3s ease, opacity .3s ease' : 'none',
        opacity: dismissed ? 0 : 1,
        padding:'0 24px 54px',
        display:'flex', flexDirection:'column',
        cursor: dragging ? 'grabbing' : 'default',
      }}>

      {/* Drag handle */}
      <div onTouchStart={handleTouchStart} onMouseDown={handleMouseDown}
        style={{ padding:'14px 0 4px', cursor:'grab', flexShrink:0 }}>
        <div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} />
      </div>

      {/* Thinking */}
      {phase === 'thinking' && <AgentThinking />}

      {/* Ready */}
      {phase === 'ready' && (
        <div className="fade-in" style={{ display:'flex', flexDirection:'column', gap:18 }}>
          {/* Header row: "Reply ready | Why ↓"  ×  */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:14, fontWeight:600, color:'#303336', letterSpacing:'-0.01em' }}>Reply ready</span>
              <span style={{ color:'#D1D5DB' }}>|</span>
              <div onClick={() => setShowWhy(w => !w)}
                style={{ display:'flex', alignItems:'center', gap:3, cursor:'pointer' }}>
                <span style={{ fontSize:13, color:'#6F757E' }}>Why</span>
                <span style={{ fontSize:11, color:'#6F757E', display:'inline-block', transition:'transform .2s', transform: showWhy ? 'rotate(180deg)' : 'none' }}>▾</span>
              </div>
            </div>
            <div onClick={() => { setDismissed(true); setTimeout(onSkip, 300); }}
              style={{ cursor:'pointer', color:'#6F757E', fontSize:20, lineHeight:1, padding:'4px', marginRight:-4 }}>×</div>
          </div>

          {/* Why expanded */}
          {showWhy && (
            <div className="fade-in" style={{ fontSize:13, color:'#6F757E', lineHeight:1.55, marginTop:-4 }}>
              {item.context && <p style={{ margin:'0 0 6px' }}>{item.context}</p>}
              {item.styleReason && <p style={{ margin:0 }}>{item.styleReason}</p>}
            </div>
          )}

          {/* Draft — blockquote with left border */}
          <div style={{ borderLeft:'2px solid #E0E2E5', paddingLeft:16 }}>
            <div style={{ fontSize:16, fontStyle:'italic', color:'#303336', lineHeight:1.65 }}>{item.draft}</div>
          </div>

          {/* Question */}
          <div style={{ fontSize:15, color:'#303336', fontWeight:400 }}>Should I send this?</div>

          {/* Buttons */}
          <div style={{ display:'flex', gap:10 }}>
            <button onClick={onEdit}
              style={{ flex:1, padding:'13px 0', background:'#fff', color:'#303336', border:'1.5px solid #E0E2E5', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer', letterSpacing:'-0.01em' }}>
              Edit
            </button>
            <button onClick={onSend}
              style={{ flex:1, padding:'13px 0', background:'#1a1a1a', color:'#fff', border:'none', borderRadius:14, fontSize:15, fontWeight:700, cursor:'pointer', letterSpacing:'-0.01em' }}>
              Send
            </button>
          </div>
        </div>
      )}
    </div>
  </SheetWrap>
  );
}

/* ═══ CHAT DETAIL ═══ */
function ChatDetail({ item, label, labelColor, onClose, isSensitive, onSent, sentMessage, draftMode, onSkipDraft, onDraftFeedback, isFirstSend, onFirstSend }) {
  const useSuggestMode = draftMode === 'suggest' && item.draft && !isSensitive;

  // Modes:
  // suggest — AI proposes next action at bottom
  // inline — draft shown in chat body, input at bottom (fallback after feedback)
  // editing — editing draft (works in both modes)
  // custom — user writing from scratch
  // sent — message sent
  // summary — sensitive message summary
  // feedback — AI asks why user keeps skipping drafts
  const getInitialMode = () => {
    if (isSensitive) return 'summary';
    if (item.mode === 'ask') return 'ask';
    if (!item.draft) return 'custom';
    if (sentMessage) return 'custom';
    return useSuggestMode ? 'suggest' : 'inline';
  };

  const [mode, setMode] = useState(getInitialMode);
  const [editVal, setEditVal] = useState(item.draft || '');
  const [customVal, setCustomVal] = useState('');
  const [showToast, setShowToast] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [sentMsg, setSentMsg] = useState('');
  const [activeTone, setActiveTone] = useState(null);
  const [editFeedback, setEditFeedback] = useState(null); // null | 'asking' | 'done'
  const [customFeedback, setCustomFeedback] = useState(null); // null | 'asking' | 'done'
  const [askVal, setAskVal] = useState('');
  const [askPhase, setAskPhase] = useState('input');
  const [showAskStyleReason, setShowAskStyleReason] = useState(false);
  const [generatedDraft, setGeneratedDraft] = useState('');
  const [generatedBecause, setGeneratedBecause] = useState('');
  const [showSendCelebration, setShowSendCelebration] = useState(false);
  const [undoCount, setUndoCount] = useState(0);
  const undoTimerRef = useRef(null);
  const originalDraft = item.draft || '';
  const chatBodyRef = useRef(null);
  const [agentHelpPhase, setAgentHelpPhase] = useState(null); // null | 'bubble' | 'sheet' | 'recording' | 'typeInput' | 'thinking' | 'draft'
  const [agentHelpInput, setAgentHelpInput] = useState('');
  const [agentHelpDraft, setAgentHelpDraft] = useState('');

  // Simple diff: percentage of words changed
  const calcEditDistance = (a, b) => {
    if (!a || !b) return 1;
    const words1 = a.toLowerCase().split(/\s+/);
    const words2 = b.toLowerCase().split(/\s+/);
    let matches = 0;
    words2.forEach(w => { if (words1.includes(w)) matches++; });
    return 1 - (matches / Math.max(words1.length, 1));
  };

  // Intent label + context menu
  const [intentLabel, setIntentLabel] = useState(item.intent || null);
  const [intentMenu, setIntentMenu] = useState(false); // false | 'main' | 'change' | 'why'
  const allIntents = ['Interested', 'FAQ', 'Collab', 'Emotional', 'Spam', 'Other'];

  const intentColors = {
    'Interested':'#E8710A', 'FAQ':'#2952CC', 'Collab':'#7627BB',
    'Emotional':'#D93025', 'Spam':'#6F757E', 'Other':'#525960',
  };

  const triggerToast = (msg) => {
    setToastMsg(msg);
    setShowToast(true);
    setTimeout(() => setShowToast(false), 2500);
  };

  const handleSend = () => {
    const wasEditing = (mode === 'editing');
    const msg = wasEditing ? editVal : item.draft;
    setSentMsg(msg);
    setMode('sent');
    if (wasEditing) {
      const distance = calcEditDistance(originalDraft, editVal);
      if (distance > 0.5 && !activeTone) {
        // Major rewrite — ask what was off after a brief pause
        setTimeout(() => setEditFeedback('asking'), 1200);
      } else {
        triggerToast(activeTone
          ? 'Got it,' + activeTone.toLowerCase() + ' tone for similar messages.'
          : 'Noted. I\'ll adjust my style based on your edit.');
      }
    }
    if (onSent) onSent(item.user, msg);
    if (isFirstSend && onFirstSend) {
      onFirstSend();
      setShowSendCelebration(true);
      setTimeout(() => setShowSendCelebration(false), 1500);
    }
  };

  const handleSendCustom = () => {
    if (!customVal.trim()) return;
    setSentMsg(customVal);
    setMode('sent');
    if (onSent) onSent(item.user, customVal);
    triggerToast('Got it,I\'ll adjust for next time');
  };

  const handleSendAgentDraft = () => {
    if (!agentHelpDraft.trim()) return;
    setSentMsg(agentHelpDraft);
    setMode('sent');
    if (onSent) onSent(item.user, agentHelpDraft);
    setAgentHelpPhase(null);
    triggerToast('Got it, I\'ll adjust for next time');
  };

  const handleIllReply = () => {
    if (onSkipDraft) {
      const count = onSkipDraft();
      if (count >= 5) {
        // 5th skip — trigger feedback
        setMode('feedback');
        return;
      }
    }
    setMode('custom');
    setCustomVal('');
    if (item.draft) setCustomFeedback('asking');
  };

  const handleAskSubmit = () => {
    if (!askVal.trim()) return;
    setAskPhase('generating');
    setTimeout(() => {
      const draft = (item.draftTemplate || '').replace('{answer}', askVal.trim());
      const styleR = item.styleReasonTemplate || '';
      setGeneratedDraft(draft);
      setGeneratedBecause(styleR);
      setAskPhase('ready');
    }, 1500);
  };

  const handleAskSend = () => {
    setSentMsg(generatedDraft);
    setMode('sent');
    triggerToast('Got it,I\'ll use this for similar questions.');
    if (onSent) onSent(item.user);
  };

  const handleFeedbackChoice = (reason) => {
    triggerToast('Got it,' + reason + '. I\'ll adjust.');
    if (onDraftFeedback) onDraftFeedback(); // switches parent to inline mode
    setMode('custom');
    setCustomVal('');
  };

  const handleUndo = () => {
    clearInterval(undoTimerRef.current);
    setSentMsg('');
    setUndoCount(0);
    setMode('undo');
  };

  // Scroll chat to bottom on mode change — double-scroll to catch resize
  useEffect(() => {
    if (!chatBodyRef.current) return;
    const el = chatBodyRef.current;
    const scroll = () => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    if (mode === 'suggest' || mode === 'ask' || mode === 'summary') {
      setTimeout(scroll, 100);
      setTimeout(scroll, 550);
    } else {
      setTimeout(scroll, 50);
    }
  }, [mode]);

  // Show agent help bubble when user starts typing in a chat they already replied to
  useEffect(() => {
    if (!sentMessage) return;
    if (customVal.trim() && agentHelpPhase === null) {
      setAgentHelpPhase('bubble');
    } else if (!customVal.trim() && agentHelpPhase === 'bubble') {
      setAgentHelpPhase(null);
    }
  }, [customVal]);

  // Undo countdown when mode becomes 'sent'
  useEffect(() => {
    if (mode !== 'sent') return;
    setUndoCount(5);
    let count = 5;
    undoTimerRef.current = setInterval(() => {
      count -= 1;
      setUndoCount(count);
      if (count <= 0) clearInterval(undoTimerRef.current);
    }, 1000);
    return () => clearInterval(undoTimerRef.current);
  }, [mode]);

  // Conversation history — use item.chatHistory if provided, otherwise generate default
  const chatHistory = item.chatHistory || [
    ...(item.source === 'DM' ? [{ from: 'them', text: 'Hey!', time: '2h ago' }] : []),
    { from: 'them', text: item.msg, time: item.time || '2h ago' },
  ];

  const sheetActive = (
    (mode === 'suggest' && !!item.draft) ||
    mode === 'ask' || mode === 'summary' || mode === 'undo' || mode === 'feedback' ||
    (!!agentHelpPhase && agentHelpPhase !== 'bubble' && mode === 'custom')
  );

  return (
    <div className="screen-slide-in" onClick={(e) => e.stopPropagation()}
      style={{ position:'absolute', inset:0, zIndex:100,
        display:'flex', flexDirection:'column',
        background: sheetActive ? '#0F0F0F' : T.paper,
        transition:'background .35s ease',
      }}>

    {/* ═══ CHAT CARD — flex:1, shrinks + scales as sheet sibling expands ═══ */}
    <div style={{
      flex:1, minHeight:0,
      background:T.paper,
      borderRadius: sheetActive ? 16 : 0,
      transform: sheetActive ? 'scale(0.96)' : 'scale(1)',
      transformOrigin:'top center',
      display:'flex', flexDirection:'column',
      overflow:'hidden',
      transition:'border-radius .35s ease, transform .35s cubic-bezier(.32,.72,.35,1.01)',
    }}>
      {/* Header */}
      <div style={{ padding:'52px 20px 14px', display:'flex', alignItems:'center', justifyContent:'space-between', borderBottom:`1px solid ${T.lightGray}`, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <div onClick={(e) => { e.stopPropagation(); onClose(); }} style={{ cursor:'pointer', fontSize:20, color:T.ink, fontWeight:300, padding:'8px 12px', margin:'-8px -12px' }}>←</div>
          {item.avatar && <img src={item.avatar} alt="" style={{ width:36, height:36, borderRadius:18, objectFit:'cover', background:T.lightGray }} />}
          <div>
            <div style={{ fontSize:16, fontWeight:600, color:T.ink, letterSpacing:'-0.01em' }}>{item.name || item.user}</div>
            <div style={{ fontSize:11, color:T.gray }}>{item.user}</div>
          </div>
        </div>

        {/* Intent label */}
        {intentLabel && (
          <div style={{ position:'relative' }}>
            <div onClick={(e) => { e.stopPropagation(); setIntentMenu(intentMenu ? false : 'main'); }}
              style={{ fontSize:11, fontWeight:500, color: intentColors[intentLabel] || '#525960', background:(intentColors[intentLabel] || '#525960') + '14', padding:'5px 12px', borderRadius:8, cursor:'pointer', userSelect:'none', letterSpacing:'-0.01em' }}>
              {intentLabel}
            </div>

            {/* Context menu */}
            {intentMenu === 'main' && (
              <div className="fade-in" onClick={e => e.stopPropagation()} style={{ position:'absolute', right:0, top:'100%', marginTop:6, background:'#151515', borderRadius:14, boxShadow:'0 8px 32px rgba(0,0,0,0.25)', zIndex:20, minWidth:200, overflow:'hidden' }}>
                <div onClick={() => setIntentMenu('why')}
                  style={{ padding:'13px 16px', fontSize:13, color:'#ff6b6b', cursor:'pointer', borderBottom:'1px solid rgba(255,255,255,0.06)', fontWeight:500 }}>
                  It's not {intentLabel.toLowerCase()}
                </div>
                <div onClick={() => setIntentMenu('change')}
                  style={{ padding:'13px 16px', fontSize:13, color:'rgba(255,255,255,0.7)', cursor:'pointer', borderBottom:'1px solid rgba(255,255,255,0.06)' }}>

                  style={{ padding:'13px 16px', fontSize:13, color:'rgba(255,255,255,0.35)', cursor:'pointer' }}>

              </div>

            {/* Why it's wrong */}

                <div style={{ padding:'12px 16px', fontSize:11, color:'rgba(255,255,255,0.35)', fontWeight:500, borderBottom:'1px solid rgba(255,255,255,0.06)' }}>

            {/* Change intent */}
            {intentMenu === 'change' && (
              <div className="fade-in" onClick={e => e.stopPropagation()} style={{ position:'absolute', right:0, top:'100%', marginTop:6, background:'#151515', borderRadius:14, boxShadow:'0 8px 32px rgba(0,0,0,0.25)', zIndex:20, minWidth:180, overflow:'hidden' }}>
                <div style={{ padding:'12px 16px', fontSize:11, color:'rgba(255,255,255,0.35)', fontWeight:500, borderBottom:'1px solid rgba(255,255,255,0.06)' }}>
                  Change to:
                </div>
                {allIntents.filter(i => i !== intentLabel).map(intent => (
                  <div key={intent} onClick={() => { setIntentLabel(intent); setIntentMenu(false); triggerToast('Updated to ' + intent); }}
                    style={{ padding:'13px 16px', fontSize:13, color:'rgba(255,255,255,0.7)', cursor:'pointer', borderBottom:'1px solid rgba(255,255,255,0.06)', display:'flex', alignItems:'center', gap:8 }}>
                    <span style={{ width:8, height:8, borderRadius:4, background: intentColors[intent] || '#525960', flexShrink:0 }} />
                    {intent}
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* Chat body */}
      <div ref={chatBodyRef} style={{ flex:1, overflowY:'auto', padding:'20px 16px 12px', paddingBottom: '12px' }}>
        {/* Timestamp marker */}
        <div style={{ textAlign:'center', marginBottom:16 }}>
          <span style={{ fontSize:12, color:'#6F757E' }}>Today {item.time || '8:10 AM'}</span>
        </div>

        {chatHistory.map((m, i) => {
          const isOutgoing = m.from === 'you' || m.from === 'automation';
          const isAutomation = m.from === 'automation';
          return (
            <div key={i} style={{
              marginBottom:16, display:'flex', flexDirection:'column',
              alignItems: isOutgoing ? 'flex-end' : 'flex-start',
            }}>
              {m.from === 'them' && (
                <div style={{ maxWidth:'75%', padding:'10px 14px', borderRadius:'18px 18px 18px 2px', background:'#F0F0F2' }}>
                  <div style={{ fontSize:15, lineHeight:1.5, color:'#303336' }}>{m.text}</div>
                </div>
              )}
              {isAutomation && (
                <div style={{ maxWidth:'75%', padding:'8px 14px 10px', borderRadius:'18px 18px 2px 18px', background:'#E0E2E5' }}>
                  <div style={{ fontSize:11, fontWeight:500, color:'#6F757E', marginBottom:3, letterSpacing:'0.01em' }}>Automation</div>
                  <div style={{ fontSize:15, lineHeight:1.5, color:'#303336' }}>{m.text}</div>
                </div>
              )}
              {m.from === 'you' && (
                <div style={{ position:'relative', maxWidth:'75%', paddingBottom:2 }}>
                  <div style={{ padding:'10px 14px', borderRadius:'18px 18px 2px 18px', background:'#D6E4FF' }}>
                    <div style={{ fontSize:15, lineHeight:1.5, color:'#1a2a4a' }}>{m.text}</div>
                  </div>
                  <img src={CREATOR_AVATAR} alt="" style={{ position:'absolute', bottom:-6, right:-8, width:22, height:22, borderRadius:11, border:'2px solid #fff', objectFit:'cover' }} />
                </div>
              )}
            </div>
          );
        })}

        {/* Summary removed from chat body — agent explains in bottom sheet */}

        {/* Inline draft (fallback mode — draft shown in chat body) */}
        {mode === 'inline' && item.draft && (
          <div className="fade-up" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11, color:T.gray, marginBottom:4, fontWeight:500 }}>Inbox Agent</div>
            <div style={{ display:'flex', justifyContent:'flex-end' }}>
              <div style={{ maxWidth:'85%' }}>
                <div style={{ padding:'13px 16px', borderRadius:18, borderTopRightRadius:6, border:`1.5px dashed ${T.lightGray}`, background:T.warmGray }}>
                  <div style={{ fontSize:14, lineHeight:1.5, color:T.ink, letterSpacing:'-0.01em' }}>{item.draft}</div>
                </div>
                <div style={{ display:'flex', gap:6, marginTop:8 }}>
                  <button onClick={handleSend} style={{ padding:'7px 16px', background:'#2952CC', color:'#fff', border:'none', borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer' }}>Send</button>
                  <button onClick={() => { setMode('editing'); setEditVal(item.draft); }} style={{ padding:'7px 14px', background:'transparent', border:`1px solid ${T.lightGray}`, borderRadius:20, fontSize:12, fontWeight:500, cursor:'pointer', color:T.ink }}>Edit</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Sent message */}
        {sentMessage && mode !== 'sent' && mode !== 'undo' && (
          <div style={{ marginBottom:16, display:'flex', justifyContent:'flex-end' }}>
            <div style={{ position:'relative', maxWidth:'80%', paddingBottom:2 }}>
              <div style={{ padding:'12px 16px', borderRadius:'18px 18px 2px 18px', background:'#D6E4FF' }}>
                <div style={{ fontSize:15, lineHeight:1.5, letterSpacing:'-0.01em', color:'#1a2a4a' }}>{sentMessage}</div>
              </div>
              <img src={CREATOR_AVATAR} alt="" style={{ position:'absolute', bottom:-6, right:-8, width:22, height:22, borderRadius:11, border:'2px solid #fff', objectFit:'cover' }} />
            </div>
          </div>
        )}

        {mode === 'sent' && (
          <div className="fade-up" style={{ marginBottom:16, display:'flex', justifyContent:'flex-end' }}>
            <div style={{ position:'relative', maxWidth:'80%', paddingBottom:2 }}>
              <div style={{ padding:'12px 16px', borderRadius:'18px 18px 2px 18px', background:'#D6E4FF' }}>
                <div style={{ fontSize:15, lineHeight:1.5, letterSpacing:'-0.01em', color:'#1a2a4a' }}>{sentMsg}</div>
              </div>
              <img src={CREATOR_AVATAR} alt="" style={{ position:'absolute', bottom:-6, right:-8, width:22, height:22, borderRadius:11, border:'2px solid #fff', objectFit:'cover' }} />
            </div>
          </div>
        )}

        {/* Gap 2: Edit feedback — appears after sent when draft was heavily rewritten */}
        {editFeedback === 'asking' && mode === 'sent' && (
          <div className="fade-up" style={{ marginBottom:12 }}>
            <div style={{ background:'#151515', borderRadius:14, padding:'14px 16px', maxWidth:'90%' }}>
              <div style={{ fontSize:13, color:'#fff', lineHeight:1.5, marginBottom:12 }}>
                I noticed you changed my reply a lot. Was it off?
              </div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {[
                  'Not my tone',
                  'Wrong info',
                  'I just wanted to personalize',
                ].map(reason => (
                  <div key={reason} onClick={() => {
                    setEditFeedback('done');
                    triggerToast(reason === 'I just wanted to personalize'
                      ? 'Got it,draft was fine, you wanted your touch.'
                      : 'Got it,' + reason.toLowerCase() + '. I\'ll adjust.');
                  }}
                    style={{ padding:'8px 14px', background:'rgba(255,255,255,0.06)', borderRadius:20, cursor:'pointer', fontSize:12, color:'#fff', border:'1px solid rgba(255,255,255,0.12)', fontWeight:500, transition:'all .15s ease' }}>
                    {reason}
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ─── Edit bar (inside card) ─── */}
      {mode === 'editing' && (
        <div className="fade-up" style={{ flexShrink:0, background:T.paper, padding:'0 20px 40px' }}>
          <div style={{ height:1, background:T.lightGray, marginBottom:16 }} />
          <textarea value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus
            style={{ width:'100%', fontSize:14, color:T.ink, lineHeight:1.5, padding:'13px 16px', border:'1px solid #E0E2E5', borderRadius:14, resize:'none', height:80, fontFamily:'Inter, system-ui, sans-serif', background:'#fff', outline:'none', letterSpacing:'-0.01em', boxSizing:'border-box' }} />
          <div style={{ display:'flex', gap:6, marginTop:10, flexWrap:'wrap' }}>
            {['Friendly','Formal','Shorter','Direct'].map(tone => (
              <span key={tone} onClick={() => {
                setActiveTone(tone);
                const base = originalDraft;
                if (tone === 'Shorter') { const s = base.split(/(?<=[.!?])\s+/); setEditVal(s.slice(0, Math.ceil(s.length / 2)).join(' ')); }
                else if (tone === 'Friendly') { setEditVal('Hey! ' + base.charAt(0).toLowerCase() + base.slice(1).replace(/\.$/, '') + ' :)'); }
                else if (tone === 'Formal') { setEditVal('Thank you for reaching out. ' + base.replace(/!/g, '.').replace(/Hey!?\s*/gi, '')); }
                else if (tone === 'Direct') { const s = base.split(/(?<=[.!?])\s+/); setEditVal(s.filter(x => x.length > 20).join(' ') || base); }
              }} style={{ fontSize:12, padding:'6px 14px', borderRadius:20, border: activeTone === tone ? '1.5px solid #2952CC' : `1px solid ${T.lightGray}`, cursor:'pointer', color: activeTone === tone ? '#fff' : T.ink, fontWeight:500, background: activeTone === tone ? '#2952CC' : '#fff', transition:'all .15s ease' }}>{tone}</span>
            ))}
          </div>
          <div style={{ display:'flex', gap:8, marginTop:12 }}>
            <button onClick={handleSend} style={{ flex:1, padding:'12px 0', background:'#2952CC', color:'#fff', border:'none', borderRadius:12, fontSize:14, fontWeight:600, cursor:'pointer' }}>Send</button>
            <button onClick={() => { setMode('suggest'); setActiveTone(null); setEditVal(item.draft); }} style={{ padding:'12px 20px', background:'transparent', border:'none', fontSize:13, fontWeight:500, cursor:'pointer', color:T.gray }}>Back</button>
          </div>
        </div>
      )}

      {/* ─── Inline bar (inside card) ─── */}
      {mode === 'inline' && item.draft && (
        <div style={{ flexShrink:0, borderTop:`1px solid ${T.lightGray}`, background:T.paper, padding:'12px 20px 40px' }}>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <div style={{ flex:1, padding:'11px 16px', background:'#fff', border:`1px solid ${T.lightGray}`, borderRadius:24 }}>
              <input value={customVal} onChange={e => setCustomVal(e.target.value)} placeholder="Type your message..."
                onKeyDown={e => { if (e.key === 'Enter' && customVal.trim()) handleSendCustom(); }}
                style={{ border:'none', outline:'none', fontSize:14, color:T.ink, width:'100%', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
            </div>
            <div onClick={() => { if (customVal.trim()) handleSendCustom(); }}
              style={{ width:36, height:36, borderRadius:18, background: customVal.trim() ? '#2952CC' : T.lightGray, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'background .2s', flexShrink:0 }}>
              <span style={{ color:'#fff', fontSize:13 }}>↑</span>
            </div>
          </div>
        </div>
      )}

      {/* ─── Compose bar (inside card, hidden when agent help sheet open) ─── */}
      {(mode === 'custom' || mode === 'sent') && (!agentHelpPhase || agentHelpPhase === 'bubble') && (
        <div style={{ flexShrink:0, borderTop:`1px solid ${T.lightGray}`, background:T.paper, padding:'12px 20px 40px' }}>
          {agentHelpPhase === 'bubble' && sentMessage && mode === 'custom' && (
            <div className="fade-up" onClick={() => setAgentHelpPhase('sheet')}
              style={{ display:'flex', justifyContent:'center', marginBottom:10 }}>
              <div style={{ background:'#151515', borderRadius:20, padding:'10px 18px', cursor:'pointer', boxShadow:'0 4px 20px rgba(0,0,0,0.2)', display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ width:6, height:6, borderRadius:3, background:'#5B9CF6', flexShrink:0 }} />
                <span style={{ fontSize:13, fontWeight:500, color:'#fff', letterSpacing:'-0.01em' }}>Do you need help writing this reply?</span>
              </div>
            </div>
          )}
          {mode === 'custom' && customFeedback === 'asking' && (
            <div className="fade-up" style={{ marginBottom:10 }}>
              <div style={{ fontSize:12, color:T.gray, marginBottom:8 }}>Was my reply helpful as a starting point?</div>
              <div style={{ display:'flex', gap:6 }}>
                <div onClick={() => { setCustomFeedback('done'); triggerToast('Got it,glad it helped.'); }} style={{ padding:'8px 14px', background:T.warmGray, borderRadius:20, cursor:'pointer', fontSize:12, color:T.ink, fontWeight:500 }}>Yes</div>
                <div onClick={() => { setCustomFeedback('done'); triggerToast('Got it,I\'ll improve.'); }} style={{ padding:'8px 14px', background:T.warmGray, borderRadius:20, cursor:'pointer', fontSize:12, color:T.ink, fontWeight:500 }}>No</div>
              </div>
            </div>
          )}
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <div style={{ flex:1, padding:'11px 16px', background:'#fff', border:`1px solid ${T.lightGray}`, borderRadius:24 }}>
              <input value={customVal} onChange={e => setCustomVal(e.target.value)} placeholder="Type your message..."
                onKeyDown={e => { if (e.key === 'Enter' && customVal.trim()) handleSendCustom(); }}
                style={{ border:'none', outline:'none', fontSize:14, color:T.ink, width:'100%', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
            </div>
            <div onClick={() => { if (customVal.trim()) handleSendCustom(); }}
              style={{ width:36, height:36, borderRadius:18, background: customVal.trim() ? '#2952CC' : T.lightGray, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', transition:'background .2s', flexShrink:0 }}>
              <span style={{ color:'#fff', fontSize:13 }}>↑</span>
            </div>
          </div>
        </div>
      )}

    </div>{/* ─── end chat card ─── */}

    {/* ═══ SHEETS — below the chat card ═══ */}

    {/* Suggest mode */}
    {mode === 'suggest' && item.draft && <AgentSheet item={item} onSend={handleSend} onEdit={() => { setMode('editing'); setEditVal(item.draft); }} onSkip={handleIllReply} />}

    {/* Ask mode */}
    {mode === 'ask' && (
      <AgentSheetShell onDismiss={() => { setMode('custom'); setCustomVal(''); }}>
        {askPhase === 'input' && (
          <>
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              <div style={{ fontSize:16, color:T.ink, lineHeight:1.5 }}>{item.agentQuestion}</div>
              <textarea value={askVal} onChange={e => setAskVal(e.target.value)} autoFocus
                placeholder={item.askPlaceholder || 'Type your answer...'}
                style={{ width:'100%', fontSize:14, color:T.ink, lineHeight:1.5, padding:'13px 16px', border:`1px solid ${T.lightGray}`, borderRadius:14, resize:'none', height:60, fontFamily:'Inter, system-ui, sans-serif', background:'#F5F5F7', outline:'none', letterSpacing:'-0.01em', boxSizing:'border-box' }} />
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={handleAskSubmit} disabled={!askVal.trim()}
                style={{ flex:1, padding:'13px 0', background: askVal.trim() ? '#1a1a1a' : '#E0E2E5', color: askVal.trim() ? '#fff' : T.gray, border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor: askVal.trim() ? 'pointer' : 'default' }}>
                Use this
              </button>
              <button onClick={() => { setMode('custom'); setCustomVal(''); }}
                style={{ flex:1, padding:'13px 0', background:'#fff', color:T.ink, border:`1.5px solid ${T.lightGray}`, borderRadius:14, fontSize:15, fontWeight:500, cursor:'pointer' }}>
                I'll reply
              </button>
            </div>
          </>
        )}
        {askPhase === 'generating' && <AgentThinking />}
        {askPhase === 'ready' && (
          <>
            <div className="fade-in" style={{ display:'flex', flexDirection:'column', gap:16 }}>
              {generatedBecause && (
                <div style={{ fontSize:15, color:T.gray, lineHeight:1.5 }}>
                  {(generatedBecause.match(/[^.!?]+[.!?]?\s*/g) || [generatedBecause])[0]}
                </div>
              )}
              <AgentDraftCard text={generatedDraft} />
              <AgentWhyReply reason={generatedBecause && (generatedBecause.match(/[^.!?]+[.!?]?\s*/g) || []).length > 1 ? (generatedBecause.match(/[^.!?]+[.!?]?\s*/g) || []).slice(1).join('') : null} />
              <div style={{ fontSize:15, color:T.ink }}>Send this one?</div>
            </div>
            <AgentButtons onSend={handleAskSend} onEdit={() => { setMode('editing'); setEditVal(generatedDraft); }} onSkip={() => { setMode('custom'); setCustomVal(''); }} />
          </>
        )}
      </AgentSheetShell>
    )}

    {/* Summary mode */}
    {mode === 'summary' && (
      <AgentSheetShell onDismiss={() => { setMode('custom'); setCustomVal(''); }}>
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ fontSize:16, color:T.ink, lineHeight:1.5 }}>I read this and decided not to write anything.</div>
          <div style={{ fontSize:15, color:T.gray, lineHeight:1.5 }}>{item.summary}</div>
        </div>
        <button onClick={() => { setMode('custom'); setCustomVal(''); }}
          style={{ width:'100%', padding:'13px 0', background:'#1a1a1a', color:'#fff', border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer' }}>
          Reply personally
        </button>
      </AgentSheetShell>
    )}

    {/* Undo mode */}
    {mode === 'undo' && (
      <AgentSheetShell onDismiss={() => setMode('custom')}>
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ fontSize:16, color:T.ink, lineHeight:1.55 }}>Got it — I pulled it back. What felt off?</div>
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            <button onClick={() => { setMode(draftMode === 'suggest' ? 'suggest' : 'inline'); setEditVal(item.draft || ''); }}
              style={{ width:'100%', padding:'13px 16px', background:'#1a1a1a', color:'#fff', border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer', textAlign:'left' }}>
              Try a new angle
            </button>
            <button onClick={() => { setMode('custom'); setCustomVal(''); }}
              style={{ width:'100%', padding:'13px 16px', background:'#fff', color:T.gray, border:`1.5px solid ${T.lightGray}`, borderRadius:14, fontSize:15, fontWeight:500, cursor:'pointer', textAlign:'left' }}>
              I'll write it myself
            </button>
          </div>
        </div>
      </AgentSheetShell>
    )}

    {/* Feedback mode */}
    {mode === 'feedback' && (
      <SheetWrap>
      <div style={{ background:'#fff', borderRadius:'24px 24px 0 0', padding:'0 24px 44px' }}>
        <div style={{ padding:'14px 0 4px' }}><div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} /></div>
        <div style={{ fontSize:15, color:T.ink, lineHeight:1.55, marginBottom:16 }}>
          I noticed you prefer writing your own replies. That's fine. But what's off about mine?
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          {["They don't sound like me","Too generic","I just prefer writing myself","They're too long","Wrong tone for this audience"].map(reason => (
            <div key={reason} onClick={() => handleFeedbackChoice(reason)}
              style={{ padding:'13px 16px', background:'#F5F5F7', borderRadius:12, cursor:'pointer', fontSize:14, color:T.ink, border:`1px solid ${T.lightGray}` }}>
              {reason}
            </div>
          ))}
        </div>
      </div>
      </SheetWrap>
    )}

    {/* Agent help — flex-sibling sheet */}
    {agentHelpPhase && agentHelpPhase !== 'bubble' && mode === 'custom' && (
      <SheetWrap>
      <div style={{ background:'#fff', borderRadius:'24px 24px 0 0', padding:'0 24px 52px' }}>
        <div style={{ padding:'14px 0 4px' }}><div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} /></div>
        {agentHelpPhase === 'sheet' && (
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ fontSize:16, color:T.ink, lineHeight:1.55 }}>Sure — how do you want to do this?</div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <button onMouseDown={() => { setAgentHelpPhase('recording'); setTimeout(() => { setAgentHelpPhase('thinking'); setTimeout(() => { setAgentHelpDraft(item.draft || 'Hey! Thanks for reaching out — happy to help with that. Let me know if you have any other questions 😊'); setAgentHelpPhase('draft'); }, 1500); }, 2000); }}
                style={{ width:'100%', padding:'14px 16px', background:'#1a1a1a', color:'#fff', border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer', textAlign:'left', display:'flex', alignItems:'center', gap:12 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
                <div><div>Hold to record</div><div style={{ fontSize:12, fontWeight:400, color:'rgba(255,255,255,0.6)', marginTop:2 }}>I'll turn your thoughts into a reply</div></div>
              </button>
              <button onClick={() => setAgentHelpPhase('typeInput')}
                style={{ width:'100%', padding:'14px 16px', background:'#F5F5F7', color:T.ink, border:'none', borderRadius:14, fontSize:15, cursor:'pointer', textAlign:'left', display:'flex', alignItems:'center', gap:12 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <div><div style={{ fontWeight:500 }}>Type your thoughts</div><div style={{ fontSize:12, color:T.gray, marginTop:2 }}>I'll shape it into a reply</div></div>
              </button>
            </div>
          </div>
        )}
        {agentHelpPhase === 'recording' && (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:16, padding:'8px 0' }}>
            <div style={{ width:64, height:64, borderRadius:32, background:'rgba(0,0,0,0.06)', display:'flex', alignItems:'center', justifyContent:'center', animation:'pulse 1s ease-in-out infinite' }}>
              <svg width="28" height="28" viewBox="0 0 24 24" fill={T.ink} stroke="none"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path fill="none" stroke={T.ink} strokeWidth="2" strokeLinecap="round" d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
            </div>
            <div style={{ fontSize:15, color:T.gray }}>Listening...</div>
          </div>
        )}
        {agentHelpPhase === 'typeInput' && (
          <div style={{ display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ fontSize:16, color:T.ink, lineHeight:1.55 }}>What do you want to say?</div>
            <textarea value={agentHelpInput} onChange={e => setAgentHelpInput(e.target.value)} placeholder="Type your rough thoughts..."
              style={{ background:'#F5F5F7', border:`1px solid ${T.lightGray}`, borderRadius:12, padding:'12px 14px', color:T.ink, fontSize:14, lineHeight:1.5, minHeight:80, resize:'none', fontFamily:'Inter, system-ui, sans-serif', outline:'none' }} />
            <button onClick={() => { if (!agentHelpInput.trim()) return; setAgentHelpPhase('thinking'); setTimeout(() => { setAgentHelpDraft(item.draft || 'Thanks for your message! I\'d love to help — feel free to share more details so I can point you in the right direction 😊'); setAgentHelpPhase('draft'); }, 1500); }}
              style={{ width:'100%', padding:'13px 0', background: agentHelpInput.trim() ? '#1a1a1a' : '#E0E2E5', color: agentHelpInput.trim() ? '#fff' : T.gray, border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer', transition:'all .2s' }}>
              OK
            </button>
          </div>
        )}
        {agentHelpPhase === 'thinking' && <AgentThinking />}
        {agentHelpPhase === 'draft' && (
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ fontSize:13, color:T.gray }}>Here's what I wrote:</div>
            <div style={{ borderLeft:'2px solid #E0E2E5', paddingLeft:16 }}>
              <div style={{ fontSize:15, fontStyle:'italic', color:T.ink, lineHeight:1.6 }}>{agentHelpDraft}</div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <button onClick={handleSendAgentDraft} style={{ width:'100%', padding:'13px 0', background:'#1a1a1a', color:'#fff', border:'none', borderRadius:14, fontSize:15, fontWeight:600, cursor:'pointer' }}>Send this</button>
              <button onClick={() => { setAgentHelpPhase('thinking'); setTimeout(() => { setAgentHelpDraft('I got your message! Let me look into this and get back to you shortly 🙌'); setAgentHelpPhase('draft'); }, 1500); }}
                style={{ width:'100%', padding:'13px 0', background:'#fff', color:T.gray, border:`1.5px solid ${T.lightGray}`, borderRadius:14, fontSize:15, cursor:'pointer' }}>Rewrite it</button>
              <button onClick={() => { setAgentHelpPhase(null); setAgentHelpInput(''); setAgentHelpDraft(''); }}
                style={{ padding:'8px 0', background:'none', color:T.gray, border:'none', fontSize:14, cursor:'pointer', width:'100%' }}>I'll write it myself</button>
            </div>
          </div>
        )}
      </div>
      </SheetWrap>
    )}

    {/* Undo toast */}
    {mode === 'sent' && undoCount > 0 && (
      <div style={{ position:'absolute', bottom:140, left:'50%', transform:'translateX(-50%)', background:'#E0E2E5', color:'#303336', padding:'10px 20px', borderRadius:6, fontSize:13, fontWeight:500, zIndex:20, boxShadow:'0 4px 12px rgba(0,0,0,0.15)', display:'flex', alignItems:'center', gap:12, whiteSpace:'nowrap' }}>
        <span style={{ color:'#525960' }}>✓ Sent to {item.user}</span>
        <button onClick={handleUndo} style={{ fontSize:13, color:'#303336', background:'none', border:'none', cursor:'pointer', fontWeight:700, padding:0 }}>Undo</button>
        <span style={{ color:'rgba(0,0,0,0.3)', fontSize:12 }}>({undoCount})</span>
      </div>
    )}

    {/* Toast */}
    {showToast && (
      <div style={{ position:'absolute', bottom:100, left:'50%', transform:'translateX(-50%)', background:T.ink, color:'#fff', padding:'10px 20px', borderRadius:6, fontSize:13, fontWeight:500, animation:'fadeUp .3s ease-out', whiteSpace:'nowrap', zIndex:110, boxShadow:'0 4px 12px rgba(0,0,0,0.15)', letterSpacing:'-0.01em' }}>
        {toastMsg}
      </div>
    )}

  </div>
  );
}

/* ─── Chevron icon ─── */
function ChevronIcon({ collapsed }) {

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ transition:'transform .25s ease', transform: collapsed ? 'rotate(-90deg)' : 'rotate(0deg)' }}>

/* ─── Intention group header ─── */
function IntentionIcon({ type }) {
  if (type === 'fire') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M12 2c0 0-4 4.5-4 9a4 4 0 0 0 8 0c0-2.5-1.5-4.5-2-5.5C13.5 7.5 13 9 12 9c-1 0-1.5-1-1-3z"/>
      <path d="M9 17c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2"/>
    </svg>
  );
  if (type === 'star') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
  );
  if (type === 'urgent') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  );
  return null;
}

function IntentionHeader({ label, icon, collapsed, onToggle }) {

    <div onClick={onToggle} style={{ height:52, display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer' }}>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <IntentionIcon type={icon} />
        <span style={{ fontSize:17, fontWeight:600, color:T.ink, letterSpacing:'-0.02em' }}>{label}</span>
      </div>
      <ChevronIcon collapsed={collapsed} />
    </div>
  );
}

function InboxV2({ onOverlayChange, openChatOnLoad }) {
  const [reportCollapsed, setReportCollapsed] = useState(true);

  const [showClearedSheet, setShowClearedSheet] = useState(false);
  const [chatInteractions, setChatInteractions] = useState(0);
  const [summaryOpen, setSummaryOpen] = useState(false);
  const [activeTab, setActiveTab] = useState('important');
  const [openChat, setOpenChat] = useState(null);
  const [answeredChats, setAnsweredChats] = useState(new Set());
  const [headerHidden, setHeaderHidden] = useState(false);
  const [showPriorities, setShowPriorities] = useState(false);
  const [priorityFeedbackDone, setPriorityFeedbackDone] = useState(false);
  const [skipDraftCount, setSkipDraftCount] = useState(0);
  const [draftMode, setDraftMode] = useState('suggest'); // 'suggest' | 'inline'
  const [firstSendDone, setFirstSendDone] = useState(false);
  const [showModeChangeNotif, setShowModeChangeNotif] = useState(false);
  const scrollRef = useRef(null);
  const lastScrollTop = useRef(0);

  // Auto-open a chat if passed from onboarding "Reply now"
  useEffect(() => {
    if (openChatOnLoad) {
      setTimeout(() => {
        setOpenChat({ item: openChatOnLoad, label:'', labelColor:T.gray, isSensitive:false });
      }, 300);
    }
  }, []);

  // Report overlay state AND scroll-hide to parent for nav visibility
  useEffect(() => {
    const anyOverlay = !!openChat || summaryOpen || showPriorities;
    if (onOverlayChange) onOverlayChange(anyOverlay || headerHidden);
  }, [openChat, summaryOpen, showPriorities, headerHidden]);

  const handleScroll = () => {
    if (!scrollRef.current) return;
    const st = scrollRef.current.scrollTop;
    const delta = st - lastScrollTop.current;

    if (delta > 5 && st > 40) {
      // Scrolling down
      setHeaderHidden(true);
    } else if (delta < -5) {
      // Scrolling up
      setHeaderHidden(false);
    }
    lastScrollTop.current = st;
  };

  const [showFeedbackSheet, setShowFeedbackSheet] = useState(false);
  const [feedbackCustomText, setFeedbackCustomText] = useState('');

  const [viewedChats, setViewedChats] = useState([]);
  const [sentMessages, setSentMessages] = useState({});

  const handleOpenChat = (item, label, labelColor, isSensitive) => {
    setOpenChat({ item, label, labelColor, isSensitive });
    setViewedChats(prev => [item, ...prev.filter(v => v.user !== item.user)]);
  };

  const handleFeedbackReason = (reason) => {
    setShowFeedbackSheet(false);
    setPriorityFeedbackDone(true);
  };

  const handleFeedbackCustom = () => {
    if (!feedbackCustomText.trim()) return;
    setShowFeedbackSheet(false);
    setPriorityFeedbackDone(true);
  };

  const counts = {
    important: IMPORTANT_GROUPS.reduce((sum, g) => sum + g.items.length, 0),
  };

  return (
    <div style={{ background:T.paper, height:'100%', display:'flex', flexDirection:'column', position:'relative' }}>

      {showPriorities && (
        <PrioritiesOverlay onDismiss={() => setShowPriorities(false)} />
      )}

      {/* Top spacing */}
      <div style={{ paddingTop:52, flexShrink:0 }} />

      {/* Scrollable content */}
      <div ref={scrollRef} onScroll={handleScroll}
        style={{ flex:1, overflowY:'auto', overflowX:'hidden', padding:'0 16px 0 16px' }}>
        {showModeChangeNotif && (
          <div className="fade-up" style={{ marginBottom:16, padding:'14px 16px', background:'#F5F5F7', borderRadius:14, display:'flex', gap:12, alignItems:'flex-start' }}>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:11, color:T.gray, marginBottom:4, fontWeight:500 }}>Inbox Agent</div>
              <div style={{ fontSize:13, color:T.ink, lineHeight:1.5, letterSpacing:'-0.01em' }}>I noticed you've been writing your own replies. I'll put my drafts in the conversation from now on. Easier to compare.</div>
            </div>
            <div onClick={() => setShowModeChangeNotif(false)} style={{ cursor:'pointer', color:T.gray, fontSize:18, lineHeight:1, paddingTop:1 }}>×</div>
          </div>
        )}
        {/* ═══ Morning Report ═══ */}
        {morningReportVisible && (
          <div className="fade-up" style={{ marginBottom:16 }}>
            {/* Greeting */}
            <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:4 }}>
              <h2 style={{ fontSize:22, fontWeight:700, color:T.ink, letterSpacing:'-0.03em', lineHeight:1.2, margin:0 }}>
                Good morning, Sofia ☀️
              </h2>
              <div onClick={() => setMorningReportVisible(false)}
                style={{ cursor:'pointer', color:T.gray, fontSize:16, lineHeight:1, padding:'4px', flexShrink:0, marginTop:2 }}>✕</div>
            </div>
            <div style={{ fontSize:13, color:T.gray, marginBottom:16, letterSpacing:'-0.01em' }}>
              8 messages need you · 12 replies ready
            </div>

            {/* Data card */}
            <div style={{ background:'#fff', borderRadius:16, border:`1px solid ${T.lightGray}`, padding:'16px 18px' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
                <span style={{ fontSize:15, fontWeight:600, color:T.ink, letterSpacing:'-0.02em' }}>Handled overnight</span>
                <span onClick={() => setShowClearedSheet(true)}
                  style={{ fontSize:13, color:'#2952CC', cursor:'pointer', letterSpacing:'-0.01em', fontWeight:500 }}>
                  15 cleared ›
                </span>
              </div>

              {/* Segmented progress bar */}
              <div style={{ display:'flex', gap:3, height:7, borderRadius:4, overflow:'hidden', marginBottom:12 }}>
                <div style={{ width:'9%', background:'#34C759', borderRadius:4 }} />
                <div style={{ width:'48%', background:'#2952CC', borderRadius:4 }} />
                <div style={{ width:'43%', background:T.lightGray, borderRadius:4 }} />
              </div>

              {/* Stats row */}
              <div style={{ display:'flex', gap:0, fontSize:13, color:T.gray, letterSpacing:'-0.01em' }}>
                <span><strong style={{ color:T.ink, fontWeight:600 }}>3</strong> leads</span>
                <span style={{ margin:'0 8px', color:T.lightGray }}>·</span>
                <span><strong style={{ color:T.ink, fontWeight:600 }}>20</strong> ready</span>
                <span style={{ margin:'0 8px', color:T.lightGray }}>·</span>
                <span><strong style={{ color:T.ink, fontWeight:600 }}>~5 min</strong> to review</span>
              </div>
            </div>
          </div>
        )}

        <ImportantTab onOpenChat={handleOpenChat} answeredChats={answeredChats}
          viewedChats={viewedChats}
          priorityFeedbackDone={priorityFeedbackDone}
          onFeedbackGood={() => setPriorityFeedbackDone(true)}
          onFeedbackBad={() => setShowFeedbackSheet(true)} />
      </div>

      {/* ═══ Floating agent pill — hidden ═══ */}

      {/* ═══ Expanded agent screen ═══ */}
      {summaryOpen && <AgentExpandedScreen onDismiss={() => setSummaryOpen(false)} />}

      {/* ═══ What I cleared full screen ═══ */}
      {showClearedSheet && (
        <div style={{ position:'absolute', inset:0, zIndex:80 }}>
          <div className="sheet-up" style={{
            position:'absolute', inset:0,
            background:'#151515',
            padding:'60px 24px 48px',
            display:'flex', flexDirection:'column', gap:0,
            overflowY:'auto',
          }}>
            <div style={{ fontSize:22, fontWeight:700, color:'#fff', letterSpacing:'-0.03em', marginBottom:8 }}>What I cleared</div>
            <div style={{ fontSize:14, color:'rgba(255,255,255,0.5)', lineHeight:1.55, marginBottom:24 }}>These didn't need your time. Here's why I skipped them.</div>
            {[
              { user:'@carlos_99',   reason:'Spam / no clear intent' },
              { user:'@promo.deals', reason:'Promotional account' },
              { user:'@random.user', reason:'Already answered by automation' },
              { user:'@throwaway22', reason:'No reply to follow-up after 7 days' },
              { user:'@sales.bot',   reason:'Bot-like pattern detected' },
              { user:'@lurker.44',   reason:'Commented on old post, no DM intent' },
            ].map((item, i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:12, paddingBottom:14, marginBottom:14, borderBottom: i < 5 ? '1px solid rgba(255,255,255,0.06)' : 'none' }}>
                <div style={{ width:36, height:36, borderRadius:18, background:'rgba(255,255,255,0.08)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, fontSize:14, color:'rgba(255,255,255,0.3)' }}>
                  {item.user[1].toUpperCase()}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:'#fff', letterSpacing:'-0.01em' }}>{item.user}</div>
                  <div style={{ fontSize:12, color:'rgba(255,255,255,0.35)', marginTop:2 }}>{item.reason}</div>
                </div>
              </div>
            ))}
            <button onClick={() => setShowClearedSheet(false)}
              style={{ width:'100%', padding:'14px 0', background:'#fff', color:'#151515', border:'none', borderRadius:12, fontSize:15, fontWeight:600, cursor:'pointer', marginTop:8, letterSpacing:'-0.01em' }}>
              Got it
            </button>
          </div>
        </div>
      )}

      {/* ═══ Feedback bottom sheet ═══ */}
      {showFeedbackSheet && (
        <div style={{ position:'absolute', inset:0, zIndex:80 }}>
          {/* Dim backdrop */}
          <div onClick={() => setShowFeedbackSheet(false)} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.25)' }} />
          {/* Sheet */}
          <div className="sheet-up" style={{
            position:'absolute', bottom:0, left:0, right:0,
            background:'#151515', borderRadius:'22px 22px 0 0',
            padding:'10px 22px 48px',
          }}>
            <div style={{ width:36, height:4, background:'rgba(255,255,255,0.14)', borderRadius:2, margin:'0 auto 20px' }} />
            <div style={{ fontSize:15, fontWeight:500, color:'#fff', marginBottom:14, letterSpacing:'-0.01em' }}>What feels off?</div>
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {[
                'Some of these aren\'t important to me',
                'Missing messages I care about',
                'Groups don\'t match how I think',
                'Too many categories',
                'The order feels wrong',
              ].map(reason => (
                <div key={reason} onClick={() => handleFeedbackReason(reason)}
                  style={{ padding:'13px 16px', background:'rgba(255,255,255,0.06)', borderRadius:12, cursor:'pointer', fontSize:14, color:'rgba(255,255,255,0.8)', letterSpacing:'-0.01em', transition:'background .15s ease', border:'1px solid rgba(255,255,255,0.06)' }}>
                  {reason}
                </div>
              ))}
            </div>
            <div style={{ display:'flex', gap:8, marginTop:12, alignItems:'center' }}>
              <div style={{ flex:1, padding:'13px 16px', background:'rgba(255,255,255,0.06)', borderRadius:12, border:'1px solid rgba(255,255,255,0.06)' }}>
                <input value={feedbackCustomText} onChange={e => setFeedbackCustomText(e.target.value)}
                  placeholder="Something else..."
                  onKeyDown={e => { if (e.key === 'Enter') handleFeedbackCustom(); }}
                  style={{ border:'none', outline:'none', fontSize:14, color:'#fff', width:'100%', background:'transparent', fontFamily:'Inter, system-ui, sans-serif', letterSpacing:'-0.01em' }} />
              </div>
              {feedbackCustomText.trim() && (
                <div onClick={handleFeedbackCustom}
                  style={{ width:36, height:36, borderRadius:18, background:'#fff', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#151515" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Chat Detail Overlay */}
      {openChat && (
        <ChatDetail
          item={openChat.item}
          label={openChat.label}
          labelColor={openChat.labelColor}
          isSensitive={openChat.isSensitive}
          draftMode={draftMode}
          onClose={() => {
            setOpenChat(null);
          }}
          onSent={(user, text) => {
            setAnsweredChats(prev => new Set([...prev, user]));
            setSentMessages(prev => ({ ...prev, [user]: text }));
            const newCount = chatInteractions + 1;
            setChatInteractions(newCount);
            if (newCount >= 3) setMorningReportVisible(false);
          }}
          sentMessage={sentMessages[openChat?.item?.user] || ''}
          onSkipDraft={() => {
            const newCount = skipDraftCount + 1;
            setSkipDraftCount(newCount);
            return newCount;
          }}
          onDraftFeedback={() => { setDraftMode('inline'); setShowModeChangeNotif(true); }}
          isFirstSend={!firstSendDone}
          onFirstSend={() => setFirstSendDone(true)}
        />
      )}
    </div>
  );
}


/* ─── iOS 26 Bottom Navigation ─── */
function BottomNav() {
  return (
    <div style={{ position:'absolute', bottom:0, left:0, right:0, zIndex:80, background:'rgba(255,255,255,0.92)', backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)', borderTop:`1px solid ${T.lightGray}`, padding:'8px 0 22px', display:'flex', justifyContent:'space-around', alignItems:'center' }}>
      {[
        { icon: '⌂', label: 'Home', active: false },
        { icon: '☐', label: 'Inbox', active: true },
        { icon: '☺', label: 'Contacts', active: false },
        { icon: '⚙', label: 'Automations', active: false },
      ].map((item, i) => (
        <div key={i} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, cursor:'pointer', padding:'4px 16px', borderRadius:12, background: item.active ? '#E8F0FE' : 'transparent' }}>
          <span style={{ fontSize:18, color: item.active ? T.accent : T.gray, lineHeight:1 }}>{item.icon}</span>
          <span style={{ fontSize:10, color: item.active ? T.accent : T.gray, fontWeight: item.active ? 600 : 400 }}>{item.label}</span>
        </div>

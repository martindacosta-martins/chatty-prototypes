    </div>
  );
}

/* ─── Onboarding screens: Welcome + Results ─── */
function ObWelcomeV2b({ onNext }) {
  const [vis, setVis] = useState(0); // how many elements are visible
  const total = 5; // title, body1, body2, body3, button

  useEffect(() => {
    const timers = [];
    for (let i = 1; i <= total; i++) {
      timers.push(setTimeout(() => setVis(i), i * 500 + 200));
    }
    return () => timers.forEach(t => clearTimeout(t));
  }, []);

  const show = (i) => ({
    opacity: vis >= i ? 1 : 0,
    transform: vis >= i ? 'translateY(0)' : 'translateY(8px)',
    transition: 'opacity .45s ease, transform .45s ease',
  });

  return (
    <div style={{ background:'#151515', height:'100%', display:'flex', flexDirection:'column', position:'relative', overflow:'hidden' }}>

      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'100px 28px 0' }}>
        <div style={{ marginBottom:20, ...show(1) }}>
          <h1 style={{ fontSize:34, fontWeight:900, color:'#fff', letterSpacing:'-0.04em', lineHeight:1.12, WebkitTextStroke:'0.5px #fff' }}>
            Hi Sofia.
          </h1>
        </div>

        <div style={{ ...show(2) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:12 }}>
            You've got DMs waiting.
          </p>
        </div>

        <div style={{ ...show(3) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:12 }}>
            The leads, the quick replies, the noise. I'll go through all of it and have the good ones ready for you.
          </p>
        </div>

        <div style={{ ...show(4) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6 }}>
            Want me to get started?
          </p>
        </div>
      </div>

      <div style={{ padding:'0 28px 90px', ...show(5) }}>
        <button onClick={onNext}
          style={{ width:'100%', padding:'16px', background:'transparent', color:'rgba(255,255,255,0.8)', border:'1.5px solid rgba(255,255,255,0.18)', borderRadius:50, fontSize:16, fontWeight:500, cursor:'pointer', letterSpacing:'-0.01em' }}>
          Let's do it
        </button>
      </div>
    </div>
  );
}

function ObResultsV2b({ onOpenInbox }) {
  const [vis, setVis] = useState(0);
  const total = 6; // title, stat1, stat2, stat3, stat4, btn

  useEffect(() => {
    const timers = [];
    for (let i = 1; i <= total; i++) {
      timers.push(setTimeout(() => setVis(i), i * 400 + 300));
    }
    return () => timers.forEach(t => clearTimeout(t));
  }, []);

  const show = (i) => ({
    opacity: vis >= i ? 1 : 0,
    transform: vis >= i ? 'translateY(0)' : 'translateY(8px)',
    transition: 'opacity .45s ease, transform .45s ease',
  });

  return (
    <div style={{ background:'#151515', height:'100%', display:'flex', flexDirection:'column', position:'relative', overflow:'hidden' }}>

      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'100px 28px 0' }}>
        <div style={{ marginBottom:16, ...show(1) }}>
          <h1 style={{ fontSize:34, fontWeight:900, color:'#fff', letterSpacing:'-0.04em', lineHeight:1.12, WebkitTextStroke:'0.5px #fff' }}>Went through 35 messages overnight. Here's what matters:</h1>
        </div>

        <div style={{ ...show(2) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:16 }}>
            <span style={{ fontWeight:700 }}>20</span> messages for your attention
          </p>
        </div>

        <div style={{ ...show(3) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:16 }}>
            <span style={{ fontWeight:700 }}>8</span> people interested in your 12-week course
          </p>
        </div>
        <div style={{ ...show(4) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:16 }}>
            <span style={{ fontWeight:700 }}>2</span> shared something personal (worth reading yourself)
          </p>
        </div>
        <div style={{ ...show(5) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6 }}>
            <span style={{ fontWeight:700 }}>12</span> replies ready to send
          </p>
        </div>
      </div>

      <div style={{ padding:'0 28px 90px' }}>
        <div style={{ ...show(6) }}>
          <button onClick={onOpenInbox} style={{ width:'100%', padding:'16px', background:'#fff', color:'#151515', border:'none', borderRadius:50, fontSize:16, fontWeight:600, cursor:'pointer', letterSpacing:'-0.01em' }}>
            Open Inbox
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══ APP ═══ */

function App() {
  const [screen, setScreen] = useState(window.location.hash === '#inbox' ? 'main' : 'ob-welcome');
  const [hideNav, setHideNav] = useState(false);
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden' }}>

      {/* ─── Onboarding (3-screen flow: welcome → analyzing → results) ─── */}
      {screen === 'ob-welcome' && <ObWelcomeV2b onNext={() => setScreen('ob-loading')} />}
      {screen === 'ob-loading' && <ObSorting onNext={() => setScreen('ob-results')} />}
      {screen === 'ob-results' && <ObResultsV2b onOpenInbox={() => setScreen('main')} />}

      {/* ─── Inbox ─── */}
      {screen === 'main' && <InboxV2 onOverlayChange={(open) => setHideNav(open)} />}

      {/* Bottom Nav — visible on welcome + main inbox, hidden on loading/results/overlays */}
      {(screen === 'ob-welcome' || (screen === 'main' && !hideNav)) && <BottomNav />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

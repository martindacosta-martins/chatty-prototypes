                </div>
              )}
            </div>
          </div>
        </div>{/* end floating card */}
      </div>

      {/* Bottom section — action buttons + Ask Inbox chip */}
      <div style={{ flexShrink:0, padding:'14px 16px 20px', background:'#F5F5F5', display:'flex', flexDirection:'column', gap:14 }}>
        {/* Action buttons — 48px height, 16px type */}
        {isSent ? (
          // After a custom/typed reply, show Later + Next side-by-side (both secondary).
          // AI-draft sends auto-advance after 1s — no button needed.
          wasCustomSend ? (
            <div style={{ display:'flex', gap:10 }}>
              <button onClick={() => setSnoozePicker({ item })}
                style={{ flex:1, height:48, padding:'0 16px', background:'#fff', border:'1px solid #E0E2E5', borderRadius:12, fontSize:16, fontWeight:500, color:'#292929', cursor:'pointer', lineHeight:'20px' }}>
                Later
              </button>
              <button onClick={() => goNext()}
                style={{ flex:1, height:48, padding:'0 16px', background:'#fff', border:'1px solid #E0E2E5', borderRadius:12, fontSize:16, fontWeight:500, color:'#292929', cursor:'pointer', lineHeight:'20px' }}>
                Next
              </button>
            </div>
          ) : null
        ) : (
          <div style={{ display:'flex', gap:10 }}>
            <button onClick={() => setSnoozePicker({ item })}
              style={{ flex:1, height:48, padding:'0 16px', background:'#fff', border:'1px solid #E0E2E5', borderRadius:12, fontSize:16, fontWeight:500, color:'#292929', cursor:'pointer', lineHeight:'20px' }}>
              Later
            </button>
            {draftParts.length > 0 ? (
              <button onClick={handleSend}
                style={{ flex:1, height:48, padding:'0 16px', background:'#292929', border:'none', borderRadius:12, fontSize:16, fontWeight:500, color:'#fff', cursor:'pointer', lineHeight:'20px' }}>
                Send drafts
              </button>
            ) : (
              <button onClick={() => goNext()}
                style={{ flex:1, height:48, padding:'0 16px', background:'#fff', border:'1px solid #E0E2E5', borderRadius:12, fontSize:16, fontWeight:500, color:'#292929', cursor:'pointer', lineHeight:'20px' }}>
                Next
              </button>
            )}
          </div>
        )}

        {/* Ask Inbox pill — soft gray pill, dark text */}
        <div style={{ display:'flex', justifyContent:'center' }}>
          <div onClick={() => setAgentOverlayOpen(true)} style={{ padding:'8px 18px', background:'#EEEEEE', borderRadius:400, cursor:'pointer', WebkitTapHighlightColor:'transparent' }}>
            <span style={{ fontSize:14, fontWeight:500, color:'#292929' }}>Ask Inbox</span>
          </div>
        </div>
      </div>

      {/* Snooze picker — dimmed scrim + bottom sheet with 4 duration options */}
      {snoozePicker && (
        <div style={{ position:'absolute', inset:0, zIndex:150, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
          <div onClick={() => setSnoozePicker(null)} style={{ position:'absolute', inset:0, background:'rgba(21,27,36,0.4)' }} />
          <div className="sheet-up" style={{ position:'relative', zIndex:1, background:'#fff', borderRadius:'24px 24px 0 0', display:'flex', flexDirection:'column', padding:'8px 16px 24px' }}>
            <div style={{ display:'flex', justifyContent:'center', paddingTop:5, paddingBottom:12 }}>
              <div style={{ width:36, height:5, background:'#CCC', borderRadius:100 }} />
            </div>
            <div style={{ fontSize:17, fontWeight:600, color:'#292929', lineHeight:'24px', padding:'4px 4px 8px' }}>Snooze until</div>
            <div style={{ fontSize:14, fontWeight:400, color:'#6F757E', lineHeight:'20px', padding:'0 4px 16px' }}>
              {snoozePicker.item?.name || snoozePicker.item?.user} will come back to your inbox after:
            </div>
            {[
              { label:'15 min', icon:'15' },
              { label:'1 hour', icon:'1h' },
              { label:'6 hours', icon:'6h' },
              { label:'1 day', icon:'1d' },
            ].map((opt, i) => (
              <div key={opt.label} onClick={() => handleSnoozeChoice(opt.label)}
                style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 12px', borderTop: i === 0 ? 'none' : '1px solid #F0F0F0', cursor:'pointer' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}>
                  <circle cx="12" cy="12" r="10"/>
                  <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span style={{ flex:1, fontSize:16, fontWeight:500, color:'#292929' }}>{opt.label}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Toast — unified SystemSnackbar, full-width bottom */}
      {showToast && (
        <div style={{ position:'absolute', bottom:168, left:0, right:0, zIndex:110 }}>
          <SystemSnackbar
            message={toastType === 'snooze' ? `Snoozed ${toastUser} for ${toastDuration}` : `Reply sent to ${toastUser}`}
            onUndo={handleUndo}
          />
        </div>
      )}

      {/* Full Chat Detail */}
      {chatDetailOpen && item && (
        <ChatDetail
          item={item}
          label={item.intent || ''}
          labelColor="#707070"
          onClose={() => {
            setChatDetailOpen(false);
            // If this contact was replied to, mark as sent and advance
            if (sentSet.has(item.user)) {
              setTimeout(() => {
                if (currentIdx < items.length) goNext();
              }, 300);
            }
          }}
          isSensitive={false}
          onSent={(user, text) => { setSentSet(prev => new Set([...prev, user])); if (onSent) onSent(user); }}
          draftMode="suggest"
          isFirstSend={true}
          onFirstSend={() => {}}
        />
      )}

      {/* Agent Overlay */}
      {agentOverlayOpen && (
        <AgentOverlay
          item={item}
          draft={currentDraft || item.draft}
          onChangeDraft={(newDraft) => setCurrentDraft(newDraft)}
          onClose={() => setAgentOverlayOpen(false)}
        />
      )}

      {/* Reasoning Sheet */}
      {reasoningSheet && (
        <ReasoningSheet title={reasoningSheet.title} body={reasoningSheet.body}
          onClose={() => setReasoningSheet(null)} showFeedback={true} />
      )}

      </>
      )}
    </div>
  );
}

function AgentChatHome({ onOverlayChange }) {

        type:'agent',
        content:"Is there anything would you like me to show?",
        id: Date.now(),
        isNewChat:true,
      }]);
    }, 50);
  };

  // Seed morning brief on mount
  useEffect(() => {
    const leadsWithDrafts = INTERESTED_ITEMS.filter(i => i.draft).length;

      { type:'agent', content:'Morning, Sofia', delay:300 },
      { type:'agent', content: leadsWithDrafts + ' leads are ready to buy \u2014 ' + INTERESTED_ITEMS[0].name + ' has been following you for 2 years and just asked about the 12-week program. Replies are ready. 3 of them came straight from Tuesday\u2019s Wellness Reset webinar.', delay:800,
        cardLabel: 'ready to buy',
        cardSubtitle: 'They asked about pricing or signing up',
        cards: INTERESTED_ITEMS.slice(0,3).map(item => ({
          user: item.user, name: item.name, avatar: item.avatar, _item: item,
        })),
        suggestions: ['What else for today?'],
      },
    ];
    initial.forEach((msg, i) => {
      setTimeout(() => {
        setMessages(prev => [...prev, { ...msg, id: Date.now() + i }]);
        setTimeout(() => chatRef.current?.scrollTo({ top: chatRef.current.scrollHeight, behavior:'smooth' }), 100);
      }, msg.delay);
    });
  }, []);

  // Scroll to bottom when messages change
  useEffect(() => {
    if (chatRef.current) {
      setTimeout(() => chatRef.current?.scrollTo({ top: chatRef.current.scrollHeight, behavior:'smooth' }), 100);
    }
  }, [messages.length]);

  // Pre-built responses
  const getResponse = (query) => {
    const q = query.toLowerCase();
    const allItems = [...INTERESTED_ITEMS, ...ATTENTION_ITEMS, ...COMMUNITY_ITEMS];
    const leadsWithDrafts = INTERESTED_ITEMS.filter(i => i.draft).length;

    // --- Name/handle search (most specific, check first) ---
    const nameMatch = allItems.find(item =>
      q.includes(item.user.replace('@','').toLowerCase()) ||
      (item.name.toLowerCase().split(' ')[0].length > 2 && q.includes(item.name.toLowerCase().split(' ')[0]))
    );
    if (nameMatch) {
      return {
        reasoning: 'I found ' + nameMatch.name + ' in your messages. ' + (nameMatch.context || ''),
        content: 'Here\'s what I have on ' + nameMatch.name + ':',
        cardLabel: nameMatch.name,
        cardSubtitle: nameMatch.agentRead || nameMatch.summary,
        cards: [{ user: nameMatch.user, name: nameMatch.name, avatar: nameMatch.avatar, _item: nameMatch }],
      };
    }

    // --- Webinar ---
    if (q.match(/webinar|wellness reset|free event|next live|replay|register|sign up.*webinar|webinar.*sign/)) {
      const webinarLeads = [...INTERESTED_ITEMS, ...COMMUNITY_ITEMS].filter(i =>
        i.contactBioExpanded && i.contactBioExpanded.toLowerCase().includes('webinar')
      );
      return {
        reasoning: 'I found contacts who came in through the free Wellness Reset webinar or are asking about the next one.',
        content: 'Your next Wellness Reset webinar is in 4 days — 127 people registered so far. ' + (webinarLeads.length > 0 ? webinarLeads.length + ' people who attended the last webinar have since reached out:' : 'No webinar-sourced DMs right now.'),
        cardLabel: 'webinar leads',
        cardSubtitle: 'They came via the free webinar — warm prospects',
        cards: webinarLeads.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- 1-on-1 calls / coaching ---
    if (q.match(/one.on.one|1.on.1|coaching call|book a call|individual|calendly|session|single call|standalone/)) {
      const callLeads = [...INTERESTED_ITEMS, ...COMMUNITY_ITEMS].filter(i =>
        i.tag === 'coaching_call' || (i.msg && i.msg.toLowerCase().match(/call|session|calendly/))
      );
      return {
        reasoning: 'I filtered for contacts asking specifically about 1-on-1 coaching calls or wanting to book a session.',
        content: callLeads.length > 0
          ? callLeads.length + ' people are asking about 1-on-1 coaching calls right now — most want to check fit before committing to a full program. At $150/session, these are quick wins:'
          : 'No active 1-on-1 inquiries right now. Your call page is at calendly.com/sofia-reyes.',
        cardLabel: '1-on-1 inquiries',
        cardSubtitle: '$150/session — lower barrier entry point',
        cards: callLeads.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Support / Urgent ---
    if (q.match(/support|help|issue|problem|urgent|attention|broken|error|refund|blocked|can.t access/)) {
      return {
        reasoning: 'I prioritized by urgency \u2014 clients who need immediate help, can\'t access their purchases, or have unresolved issues that could escalate.',

      };
    }

    // --- Leads / Sales ---
    if (q.match(/money|revenue|lead|interested|sales|buy|purchase|paying|convert|hot|ready to buy/)) {

    // --- Community / Fans ---
    if (q.match(/engag|fan|communit|follow|loyal|love|thank|appreciat/)) {

    // --- Collaborations ---
    if (q.match(/collaborat|partner|brand|collab|creator|sponsor/)) {

    // --- Unanswered / Waiting ---

        reasoning: 'I checked for conversations where you haven\'t replied yet and no draft is ready.',

        cardLabel: 'waiting for reply',

      if (!communityShown) {

      return {
        content: 'That\'s everything for now. I\'ll let you know when something new comes in.',

    // --- New / Today ---

          '\u2022 ' + STATS.interested + ' active leads (' + INTERESTED_ITEMS.filter(i=>i.draft).length + ' with replies ready)\n' +

          '\u2022 Estimated ' + STATS.timeSaved + ' minutes saved today',

    // --- What should I do / Priority ---

      const topLead = INTERESTED_ITEMS[0];
      return {
        reasoning: 'I prioritized by urgency first, then revenue impact, then engagement value.',
        content: 'Here\'s what I\'d prioritize:\n\n' +

          '2. Your top leads \u2014 ' + INTERESTED_ITEMS.filter(i=>i.draft).length + ' have replies ready to send.\n' +
          '3. Community engagement when you have time.',
        cardLabel: 'top priority',
        cardSubtitle: 'Highest impact right now',

          '\u2022 Most common objection: \u201CIs this just another diet?\u201D \u2014 address this in your next story.\n' +
          '\u2022 Strongest conversion path: attended the webinar first, then DM\u2019d.\n' +
          '\u2022 ' + [...INTERESTED_ITEMS, ...COMMUNITY_ITEMS].filter(i => i.tag === 'coaching_call').length + ' people asking about 1-on-1 calls \u2014 fast path to revenue if you have spots open.',
      };

    // --- Fallback with suggestion chips ---
    return {
      content: 'I\'m not sure what you\'re looking for. You can ask me things like:',

  const handleSend = () => {

    // Add thinking
    setTimeout(() => {

    // Replace thinking with response
    setTimeout(() => {
      const response = getResponse(query);
      setMessages(prev => {

        return [...withoutThinking, {

          content: response.content,
          cards: response.cards,
          cardLabel: response.cardLabel,
          cardSubtitle: response.cardSubtitle,

  return (

        {/* iOS Status Bar */}
        <div style={{ padding:'14px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center', height:44 }}>
          <span style={{ fontSize:15, fontWeight:600, color:'#292929', letterSpacing:'-0.3px' }}>9:41</span>
          <div style={{ display:'flex', alignItems:'center', gap:5 }}>
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#292929"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="0.5" fill="#292929"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="#292929"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#292929"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#292929"><path d="M8 11.5a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z"/><path d="M4.94 7.94a4.5 4.5 0 016.12 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/><path d="M2.81 5.81a7.5 7.5 0 0110.38 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/></svg>
            <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="#292929" strokeWidth="1" fill="none"/><rect x="2" y="2" width="19" height="8" rx="1" fill="#292929"/><rect x="24" y="3.5" width="2.5" height="5" rx="1" fill="#292929"/></svg>
          </div>
        </div>
        {/* Top action bar: hamburger (left) + new chat (right) */}
        <div style={{ padding:'12px 16px 12px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          {/* Hamburger menu — opens the MenuScreen drawer */}
          <div onClick={() => { setShowMenu(true); if (onOverlayChange) onOverlayChange(true); }} style={{ width:40, height:40, borderRadius:400, border:'1px solid #E0E2E5', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', WebkitTapHighlightColor:'transparent' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </div>
          {/* New chat — resets to generic greeting without suggestions */}
          <div onClick={startNewChat} style={{ width:40, height:40, borderRadius:400, border:'1px solid #E0E2E5', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', WebkitTapHighlightColor:'transparent' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
        </div>
      </div>

      {/* Scrollable chat — top-aligned; dynamic bottom padding reserves space for input + any active suggestions */}
      {(() => {
        // Compute whether suggestions are currently visible to size the bottom padding
        let lastAgentIdx = -1;
        for (let i = messages.length - 1; i >= 0; i--) {
          if (messages[i].type === 'thinking') continue;
          if (messages[i].type === 'user') break;
          if (messages[i].type === 'agent') { lastAgentIdx = i; break; }
        }
        const activeSugg = lastAgentIdx >= 0 ? messages[lastAgentIdx].suggestions : null;
        const suggCount = activeSugg ? activeSugg.length : 0;
        // 160 = input + bottom nav baseline; add ~40px per pill (32 + 8 gap)
        const bottomPad = 180 + suggCount * 40;

          <div ref={chatRef} onScroll={(e) => setScrolled(e.target.scrollTop > 10)} style={{ flex:1, overflowY:'auto', padding:`120px 24px ${bottomPad}px`, display:'flex', flexDirection:'column', gap:24 }}>

          // Agent message
          return (
            <div key={msg.id} style={{ display:'flex', flexDirection:'column', gap:12, animation:'fadeUp .4s ease both' }}>
              {/* Text content — render newlines and bullets */}
              <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929', whiteSpace:'pre-line' }}>
                {msg.content?.split('\n').map((line, li) => {
                  if (line.startsWith('\u2022')) {
                    return <div key={li} style={{ paddingLeft:8, display:'flex', gap:8 }}><span>{'\u2022'}</span><span>{line.substring(1).trim()}</span></div>;
                  }
                  if (li === 0 && (msg.content.startsWith('Morning') || msg.isNewChat || msg.content.startsWith('New chat'))) {
                    return <div key={li} style={{ fontFamily:'"Manychat Gravity", "Gravity", Inter, -apple-system, system-ui, sans-serif', fontSize:20, fontWeight:800, lineHeight:'26px', letterSpacing:'-0.02em', color:'#111' }}>{line}</div>;
                  }
                  return <div key={li}>{line}</div>;
                })}
              </div>

              {/* Reasoning disclosure — only for user-initiated queries */}
              {msg.reasoning && (
                <div onClick={() => { setReasoningSheet({ title:'Thought', body: msg.reasoning }); if (onOverlayChange) onOverlayChange(true); }}
                  style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer', padding:'8px 0' }}>
                  <span style={{ fontSize:13, fontWeight:400, color:'#707070' }}>Thought</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              )}

              {/* Contact card — single or grouped, per Figma */}
              {msg.cards && msg.cards.length > 0 && (() => {
                const total = msg.cards.length;
                const isSingle = total === 1;
                const sentCount = msg.cards.filter(c => globalSentSet.has(c.user)).length;
                const laterCount = msg.cards.filter(c => globalLaterSet.has(c.user)).length;
                const unrepliedCount = total - sentCount - laterCount;
                const allReplied = sentCount === total;
                const anyProgress = (sentCount > 0 || laterCount > 0) && !allReplied;

                if (isSingle) {
                  const card = msg.cards[0];
                  const name = card.name || card.user;
                  const subtitle = card.agentRead || card.summary || 'Ready to reply';
                  return (
                    <div onClick={() => { setFocusMode({ title: msg.cardLabel || 'Contacts', items: msg.cards.map(c => c._item) }); if (onOverlayChange) onOverlayChange(true); }}
                      style={{ background:'#fff', border:'1px solid #E0E2E5', borderRadius:16, padding:'14px 16px', display:'flex', alignItems:'center', gap:12, cursor:'pointer' }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{name}</div>
                        <div style={{ fontSize:12, fontWeight:400, color:'#9A9A9A', lineHeight:'16px', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{subtitle}</div>
                      </div>
                      <img src={card.avatar} alt="" style={{ width:32, height:32, borderRadius:400, objectFit:'cover', flexShrink:0 }} />
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><polyline points="9 18 15 12 9 6"/></svg>
                    </div>
                  );
                }

                // Group card
                const title = total + ' ' + (msg.cardLabel || 'contacts');
                const subtitle = msg.cardSubtitle || 'Tap to view';

                // Avatar stack: show up to 3. If more, show first 2 + "+N" chip.
                const avatarMax = total <= 3 ? 3 : 2;
                const avatarsToShow = msg.cards.slice(0, avatarMax);
                const remaining = total - avatarMax;

                return (
                  <div onClick={() => { setFocusMode({ title: msg.cardLabel || 'Contacts', items: msg.cards.map(c => c._item) }); if (onOverlayChange) onOverlayChange(true); }}
                    style={{ background:'#fff', border:'1px solid #E0E2E5', borderRadius:16, padding:'14px 16px', display:'flex', alignItems:'center', gap:12, cursor:'pointer' }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px', textDecoration: allReplied ? 'line-through' : 'none', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{title}</div>
                      {allReplied ? (
                        <div style={{ marginTop:6 }}>
                          <span style={{ display:'inline-block', background:'#DFF5E3', color:'#0C8143', fontSize:12, fontWeight:500, padding:'3px 8px', borderRadius:6 }}>{sentCount} replied</span>
                        </div>
                      ) : anyProgress ? (
                        <div style={{ marginTop:6, display:'flex', gap:6, flexWrap:'wrap' }}>
                          {unrepliedCount > 0 && (
                            <span style={{ background:'#FDE8D0', color:'#B45A16', fontSize:12, fontWeight:500, padding:'3px 8px', borderRadius:6 }}>{unrepliedCount} unreplied</span>
                          )}
                          {sentCount > 0 && (
                            <span style={{ background:'#DFF5E3', color:'#0C8143', fontSize:12, fontWeight:500, padding:'3px 8px', borderRadius:6 }}>{sentCount} replied</span>
                          )}
                          {laterCount > 0 && (
                            <span style={{ background:'#EDEDED', color:'#707070', fontSize:12, fontWeight:500, padding:'3px 8px', borderRadius:6 }}>{laterCount} later</span>
                          )}
                        </div>
                      ) : (
                        <div style={{ fontSize:12, fontWeight:400, color:'#9A9A9A', lineHeight:'16px', marginTop:2, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{subtitle}</div>
                      )}
                    </div>
                    {!anyProgress && !allReplied && (
                      <div style={{ display:'flex', alignItems:'center', flexShrink:0 }}>
                        {avatarsToShow.map((c, ci) => (
                          <img key={ci} src={c.avatar} alt="" style={{ width:32, height:32, borderRadius:400, objectFit:'cover', border:'2px solid #fff', marginLeft: ci > 0 ? -10 : 0, position:'relative', zIndex: 10 - ci }} />
                        ))}
                        {remaining > 0 && (
                          <div style={{ width:32, height:32, borderRadius:400, background:'#F0F0F0', border:'2px solid #fff', marginLeft:-10, position:'relative', zIndex:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                            <span style={{ fontSize:11, fontWeight:600, color:'#707070' }}>+{remaining}</span>
                          </div>
                        )}
                      </div>
                    )}
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><polyline points="9 18 15 12 9 6"/></svg>
                  </div>
                );
              })()}

            </div>
          );
        })}
      </div>
        );
      })()}

      {/* Sticky suggestions — above input, outside scroll area. Shown when the latest agent message has suggestions and no pending user action. */}
      {(() => {
        // Find last non-thinking message
        let lastAgentIdx = -1;
        for (let i = messages.length - 1; i >= 0; i--) {
          if (messages[i].type === 'thinking') continue;
          if (messages[i].type === 'user') break; // user sent, hide suggestions
          if (messages[i].type === 'agent') { lastAgentIdx = i; break; }
        }
        const activeSuggestions = lastAgentIdx >= 0 ? messages[lastAgentIdx].suggestions : null;
        if (!activeSuggestions || activeSuggestions.length === 0) return null;

        const runSuggestion = (s) => {
          setMessages(prev => prev.map(m => m.suggestions ? { ...m, suggestions: null } : m));
          setMessages(prev => [...prev, { type:'user', content: s, id: Date.now() }]);
          setTimeout(() => {
            setMessages(prev => [...prev, { type:'thinking', id: Date.now() }]);
            setTimeout(() => {
              const resp = getResponse(s);
              setMessages(prev => {
                const filtered = prev.filter(m => m.type !== 'thinking');
                return [...filtered, {
                  type: 'agent', content: resp.content, id: Date.now(),
                  ...(resp.reasoning ? { reasoning: resp.reasoning } : {}),
                  ...(resp.suggestions ? { suggestions: resp.suggestions } : {}),
                  ...(resp.cards ? { cardLabel: resp.cardLabel, cardSubtitle: resp.cardSubtitle, cards: resp.cards } : {}),
                }];
              });
            }, 1500);
          }, 300);
        };

        return (
          <div style={{ position:'absolute', bottom:164, left:16, right:16, display:'flex', flexDirection:'column', gap:8, zIndex:10, animation:'fadeUp .3s ease both' }}>
            {activeSuggestions.map((s, i) => (
              <div key={i} onClick={() => runSuggestion(s)}
                style={{ background:'#F5F5F5', border:'1px solid #E0E2E5', borderRadius:16,
                  height:32, padding:'0 12px 0 14px', display:'flex', alignItems:'center', justifyContent:'space-between',
                  gap:12, cursor:'pointer', WebkitTapHighlightColor:'transparent',
                  boxShadow:'0 1px 2px rgba(15,23,42,0.04), 0 4px 16px rgba(15,23,42,0.06)' }}>
                <span style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{s}</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
              </div>
            ))}
          </div>
        );
      })()}

      {/* Input bar — sticky bottom, matches Figma */}
      <div style={{ position:'absolute', bottom:90, left:16, right:16, height:52, background:'#fff', border: homeInputFocused ? '1px solid #292929' : '1px solid #E0E2E5', borderRadius:16, padding:'0 16px', display:'flex', alignItems:'center', gap:8, zIndex:10, boxShadow:'0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.08)', transition:'border-color .15s ease' }}>
        <input ref={inputRef} value={inputVal} onChange={e => setInputVal(e.target.value)}
          onFocus={() => setHomeInputFocused(true)}
          onBlur={() => setHomeInputFocused(false)}
          onKeyDown={e => { if (e.key === 'Enter' && inputVal.trim()) handleSend(); }}
          placeholder="Ask me anything..."
          style={{ flex:1, fontSize:15, color: inputVal ? '#292929' : '#9A9A9A', lineHeight:'20px', border:'none', outline:'none', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
        {inputVal.trim() ? (
          <div onClick={handleSend}
            style={{ width:32, height:32, borderRadius:16, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
        ) : (
          <div style={{ width:32, height:32, borderRadius:16, background:'#F0F0F0', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round"><line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="7" x2="8" y2="17"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="16" y1="7" x2="16" y2="17"/><line x1="20" y1="10" x2="20" y2="14"/></svg>
          </div>
        )}
      </div>

      {/* Reasoning Sheet */}
      {reasoningSheet && (
        <ReasoningSheet title={reasoningSheet.title} body={reasoningSheet.body}
          onClose={() => { setReasoningSheet(null); if (onOverlayChange) onOverlayChange(false); }} showFeedback={true} />
      )}

      {/* Focus Mode */}
      {focusMode && (
        <FocusMode
          title={focusMode.title}
          items={focusMode.items}
          initialSentSet={globalSentSet}
          initialLaterSet={globalLaterSet}
          onClose={(finalSentSet, finalLaterSet) => {
            const newlySent = finalSentSet ? [...finalSentSet].filter(u => !globalSentSet.has(u)) : [];
            const newlyLater = finalLaterSet ? [...finalLaterSet].filter(u => !globalLaterSet.has(u)) : [];
            if (finalSentSet) setGlobalSentSet(new Set([...globalSentSet, ...finalSentSet]));
            if (finalLaterSet) setGlobalLaterSet(new Set([...globalLaterSet, ...finalLaterSet]));

            // Smart summary message
            if (newlySent.length > 0 || newlyLater.length > 0) {
              const parts = [];
              if (newlySent.length > 0) parts.push(newlySent.length + ' replied');
              if (newlyLater.length > 0) parts.push(newlyLater.length + ' snoozed for later');
              setMessages(prev => [...prev, {
                type: 'agent',
                content: parts.join(', ') + '.',
                id: Date.now(),
              }]);
            }

            // Proactive next step — find what hasn't been shown yet
            const shownCards = messages.filter(m => m.cardLabel).map(m => m.cardLabel);
            const allHandled = [...(finalSentSet || []), ...(finalLaterSet || [])];
            setTimeout(() => {
              if (!shownCards.includes('need your attention') && ATTENTION_ITEMS.length > 0) {
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'Next up: ' + ATTENTION_ITEMS.length + ' people need your help \u2014 ' + ATTENTION_ITEMS[0].name + ' has been waiting since yesterday.',
                  cardLabel: 'need your attention',
                  cardSubtitle: 'They need personal support from you',
                  cards: ATTENTION_ITEMS.slice(0,3).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
                  id: Date.now() + 1,
                }]);
              } else if (!shownCards.includes('community')) {
                const withDrafts = COMMUNITY_ITEMS.filter(i => i.draft).length;
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'When you have a moment: ' + withDrafts + ' community messages have replies ready.',
                  cardLabel: 'community',
                  cardSubtitle: 'A little love goes a long way',
                  cards: COMMUNITY_ITEMS.filter(i => i.draft).slice(0,3).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
                  id: Date.now() + 1,
                }]);
              } else {
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'You\'re all caught up for now. I\'ll let you know when something new comes in.',
                  id: Date.now() + 1,
                }]);
              }
            }, 800);

            setFocusMode(null);
            if (onOverlayChange) onOverlayChange(false);
          }}
          onSent={(user) => { setGlobalSentSet(prev => new Set([...prev, user])); }}
        />
      )}

      {/* Chat Detail */}
      {openChat && (
        <ChatDetail item={openChat.item} label={openChat.label} labelColor={openChat.labelColor}
          onClose={handleCloseChat} isSensitive={openChat.isSensitive}
          onSent={(user, text) => {}} draftMode={'suggest'}
          isFirstSend={true} onFirstSend={() => {}} />
      )}

      {/* Menu Screen — slide-in drawer */}
      {showMenu && (
        <MenuScreen
          onClose={() => { setShowMenu(false); if (onOverlayChange) onOverlayChange(false); }}
          onOpenChat={openChatFromMenu}
          onNewChat={startNewChat}
        />
      )}
    </div>
  );
}

/* ─── Onboarding screens: Welcome + Results ─── */
function ObWelcomeV2b({ onNext }) {
  const [vis, setVis] = useState(0);

  useEffect(() => {
    const timers = [];
    // 0: greeting, 1: intro paragraph, 2: bullet 1, 3: bullet 2, 4: bullet 3, 5: button
    const delays = [250, 700, 1200, 1550, 1900, 2350];
    delays.forEach((d, i) => {
      timers.push(setTimeout(() => setVis(i + 1), d));
    });
    return () => timers.forEach(t => clearTimeout(t));
  }, []);

  const show = (i) => ({
    opacity: vis >= i ? 1 : 0,
    transform: vis >= i ? 'translateY(0)' : 'translateY(10px)',

      <div style={{ padding:'14px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center', height:44, flexShrink:0 }}>
        <span style={{ fontSize:15, fontWeight:600, color:'#292929', letterSpacing:'-0.3px' }}>9:41</span>
        <div style={{ display:'flex', alignItems:'center', gap:5 }}>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#292929"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="0.5" fill="#292929"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="#292929"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#292929"/></svg>

          <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="#292929" strokeWidth="1" fill="none"/><rect x="2" y="2" width="19" height="8" rx="1" fill="#292929"/><rect x="24" y="3.5" width="2.5" height="5" rx="1" fill="#292929"/></svg>
        </div>
      </div>

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'0 28px 118px', minHeight:0 }}>

/* Rainbow shadow behind the CTA — soft, multi-hue halo hugging the button */
function RainbowGlow() {
  return (
    <div
      aria-hidden
      style={{
        position:'absolute',
        inset:0,
        borderRadius:12,
        zIndex:0,
        pointerEvents:'none',
        background: 'conic-gradient(from 0deg, #FFB3B3, #FFDCA8, #FFF3A8, #B8F2C9, #B8DCFF, #D6B8FF, #FFB8E3, #FFB3B3)',
        filter:'blur(8px)',
        opacity:0.9,
      }}
    />
  );
}

function useCountUp(target, duration, active) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = Date.now();
    const timer = setInterval(() => {
      const elapsed = Date.now() - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.round(eased * target));
      if (progress >= 1) clearInterval(timer);
    }, 16);
    return () => clearInterval(timer);
  }, [active]);
  return val;
}

function ObResultsV2b({ onOpenInbox }) {
  const [vis, setVis] = useState(0);
  const [closing, setClosing] = useState(false);

  useEffect(() => {
    const timers = [];
    // 0: heading, 1-4: stat rows, 5: ready line, 6: button
    const delays = [250, 900, 1100, 1300, 1500, 1900, 2300];
    delays.forEach((d, i) => {
      timers.push(setTimeout(() => setVis(i + 1), d));
    });
    return () => timers.forEach(t => clearTimeout(t));
  }, []);

  function handleOpen() {
    setClosing(true);
    setTimeout(onOpenInbox, 520);
  }

  const show = (i) => ({
    opacity: vis >= i ? 1 : 0,
    transform: vis >= i ? 'translateY(0)' : 'translateY(10px)',
    transition: 'opacity .5s cubic-bezier(.25,.46,.45,.94), transform .55s cubic-bezier(.25,.46,.45,.94)',
  });

  // Main count in heading
  const nTotal      = useCountUp(STATS.totalHandled, 1100, vis >= 1);
  // Stat rows — count up once their row is visible
  const nAttention  = useCountUp(ATTENTION_ITEMS.length, 700, vis >= 2);
  const nInterested = useCountUp(INTERESTED_ITEMS.length, 700, vis >= 3);
  const nCommunity  = useCountUp(COMMUNITY_ITEMS.length, 700, vis >= 4);
  const nReplies    = useCountUp([...INTERESTED_ITEMS, ...COMMUNITY_ITEMS].filter(i => i.draft).length, 700, vis >= 5);

  const statRows = [
    { n: nAttention,  label: 'conversations for your attention' },
    { n: nInterested, label: 'people interested in your services' },
    { n: nCommunity,  label: 'engaged followers' },
    { n: nReplies,    label: 'replies ready to send' },
  ];

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', position:'relative', overflow:'hidden', background:'#FFFFFF' }}>
      {/* iOS Status Bar */}
      <div style={{ padding:'14px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center', height:44, flexShrink:0 }}>
        <span style={{ fontSize:15, fontWeight:600, color:'#292929', letterSpacing:'-0.3px' }}>9:41</span>
        <div style={{ display:'flex', alignItems:'center', gap:5 }}>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#292929"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="0.5" fill="#292929"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="#292929"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#292929"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#292929"><path d="M8 11.5a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z"/><path d="M4.94 7.94a4.5 4.5 0 016.12 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/><path d="M2.81 5.81a7.5 7.5 0 0110.38 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="#292929" strokeWidth="1" fill="none"/><rect x="2" y="2" width="19" height="8" rx="1" fill="#292929"/><rect x="24" y="3.5" width="2.5" height="5" rx="1" fill="#292929"/></svg>
        </div>
      </div>

      {/* Content */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', padding:'0 28px 118px', minHeight:0 }}>
        {/* Top breathing room — matches welcome step */}
        <div style={{ flex:'0 0 140px' }} />

        {/* Heading */}
        <div style={show(1)}>
          <h1 style={{ fontFamily:'"Manychat Gravity", "Gravity", Inter, -apple-system, system-ui, sans-serif', fontSize:32, fontWeight:800, color:'#111', letterSpacing:'-0.03em', lineHeight:'36px', margin:0 }}>
            Done. Went through {nTotal} messages.
          </h1>
        </div>

        {/* Stat rows */}
        <div style={{ display:'flex', flexDirection:'column', gap:14, marginTop:32 }}>
          {statRows.map((row, i) => (
            <div key={i} style={{ display:'flex', alignItems:'baseline', gap:16, ...show(2 + i) }}>
              <div style={{
                fontFamily:'"Manychat Gravity", "Gravity", Inter, -apple-system, system-ui, sans-serif',
                fontSize:26, fontWeight:800, color:'#111', letterSpacing:'-0.02em',
                minWidth:40, textAlign:'left', flexShrink:0,
                lineHeight:'28px',
                fontVariantNumeric:'tabular-nums',
              }}>{row.n}</div>
              <div style={{ fontSize:16, fontWeight:400, color:'#303336', lineHeight:'22px' }}>
                {row.label}
              </div>
            </div>
          ))}
        </div>

        {/* Ready line */}
        <div style={{ marginTop:28, ...show(6) }}>
          <p style={{ fontSize:16, fontWeight:400, color:'#303336', lineHeight:'24px', margin:0 }}>
            Your inbox is ready.
          </p>
        </div>

        {/* Spacer to push button to bottom */}
        <div style={{ flex:1 }} />

        {/* CTA button with rainbow glow */}
        <div style={{ position:'relative', ...show(7) }}>
          <RainbowGlow />
          <button
            onClick={handleOpen}
            style={{
              position:'relative', zIndex:1,
              width:'100%', height:56,
              background:'#1C1C1E', color:'#fff',
              border:'none', borderRadius:12,
              fontSize:17, fontWeight:600, letterSpacing:'-0.01em',
              cursor:'pointer',
              fontFamily:'inherit',
            }}
          >
            Open Inbox
          </button>
        </div>
      </div>

      {closing && (
        <div style={{ position:'absolute', inset:0, zIndex:20, background:'#fff', animation:'fadeIn 0.5s ease both' }} />
      )}
    </div>
  );
}

/* ═══ APP ═══ */

function App() {
  const [screen, setScreen] = useState(window.location.hash === '#inbox' ? 'main' : 'ob-welcome');
  const [hideNav, setHideNav] = useState(false);
  const onOnboarding = screen === 'ob-welcome' || screen === 'ob-loading' || screen === 'ob-results';
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden' }}>

      {/* ─── Onboarding ─── */}
      {onOnboarding && (
        <div style={{ position:'absolute', inset:0, background:'#FFFFFF', zIndex:0 }}>
          <div
            key={screen}
            className="ob-step-layer"
            style={{ position:'absolute', inset:0, zIndex:1 }}
          >
            {screen === 'ob-welcome' && <ObWelcomeV2b onNext={() => setScreen('ob-loading')} />}
            {screen === 'ob-loading' && <ObSorting onNext={() => setScreen('ob-results')} />}
            {screen === 'ob-results' && <ObResultsV2b onOpenInbox={() => setScreen('main')} />}
          </div>
        </div>
      )}

      {/* ─── Inbox ─── */}
      {screen === 'main' && (
        <div style={{ position:'absolute', inset:0, animation:'fadeIn 0.45s ease both' }}>
          <AgentChatHome onOverlayChange={(open) => setHideNav(open)} />
        </div>
      )}

      {/* Bottom Nav — visible on welcome + main, hidden during loading/results */}
      {screen === 'ob-welcome' && <BottomNav />}
      {screen === 'main' && !hideNav && <BottomNav />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

1. PRIORITIZE — Surface only messages that need the creator's attention: people asking about products or services, meaningful engagement (compliments, collaboration asks, genuine interactions), and questions the creator needs to answer directly. Filter everything else silently.

2. GROUP — Organize messages into three groups:
   • Interested in your services — anyone asking about a program, 1-on-1 call, webinar, price, format, or showing purchase intent
   • Engaged — positive interactions, fans, people connecting warmly (not just a generic hello)
   • Questions — specific questions the creator needs to answer personally (info not in the automation)

3. DRAFT — For each message in "Interested in your services", write a ready-to-send reply. Match the contact's language and tone. Keep it short, human, warm. If the agent is not confident or the message is sensitive, leave the draft empty — the creator opens the chat and replies manually. No "Input needed" state — just no draft.

4. FILTER — Silently remove: generic greetings with no follow-up ("Hello", "Bon día"), bots, empty messages, and spam. Never surface more than the creator can handle.

5. ORDER — Within each group: show items with a reply draft first, then sort by recency (most recent first).

6. REMIND — Flag conversations where the contact hasn't received a reply in 5+ days. The creator should follow up before the lead goes cold.`;

};

const OB_GRID_MASK = 'radial-gradient(ellipse 85% 70% at 52% 48%, black 10%, rgba(0,0,0,0.45) 52%, transparent 82%)';

/* ─── Shared purple background + fixed grid; loading = pulses on rails (Tron-style) ─── */
function PurpleBg({ gridMode = 'idle' }) {
  const canvasRef = useRef(null);
  const loading = gridMode === 'loading';
  const lineH = loading ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.17)';
  const lineV = loading ? 'rgba(255,255,255,0.17)' : 'rgba(255,255,255,0.15)';

  useEffect(() => {
    if (!loading) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 393;
    const H = 852;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const CW = 84;
    const CH = 87;
    const vXs = [];
    for (let x = CW - 42; x < W; x += CW) vXs.push(x);
    const hYs = [];
    for (let y = 0; y <= H; y += CH) hYs.push(y);

    /* Electric Cyan — OB_GRID_ACCENT */
    const cyan = 'rgba(0,246,255,0.55)';

    function mkV(x) {
      return { x, y: Math.random() * H, speed: 0.9 + Math.random() * 1.4, len: 32 + Math.random() * 44 };
    }
    function mkH(y) {
      return { x: Math.random() * W, y, speed: 0.75 + Math.random() * 1.2, len: 36 + Math.random() * 50 };
    }
    const vSegs = vXs.map(mkV);
    const hSegs = hYs.map(mkH);

    let id;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 1.25;

      vSegs.forEach((w) => {
        w.y += w.speed;
        if (w.y > H + w.len) w.y = -w.len;
        const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.len);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.5)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.4)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x, w.y + w.len);
        ctx.stroke();
      });

      hSegs.forEach((w) => {
        w.x += w.speed;
        if (w.x > W + w.len) w.x = -w.len;
        const g = ctx.createLinearGradient(w.x, 0, w.x + w.len, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.32)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x + w.len, w.y);
        ctx.stroke();
      });

      id = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(id);
  }, [loading]);

  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', zIndex:0, pointerEvents:'none' }}>
      <div style={{
        position:'absolute', inset:'-20%',
        background: OB_PURPLE.blurConic,
        filter:`blur(${OB_PURPLE.blur}px)`,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(${lineH} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(90deg, ${lineV} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      {loading && (
        <canvas
          ref={canvasRef}
          style={{
            position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
            maskImage: OB_GRID_MASK, WebkitMaskImage: OB_GRID_MASK,
          }}
        />
      )}
    </div>
  );
}

/* Matrix lines — soft pastel rainbow lines drifting H+V, constant opacity, self-building grid */
const MATRIX_COLORS = ['#FFB3B3', '#FFDCA8', '#FFF3A8', '#B8F2C9', '#B8DCFF', '#D6B8FF', '#FFB8E3'];

function MatrixLines() {
  // Pre-generate 8 lines with randomized positions, directions, speeds, lengths
  const lines = React.useMemo(() => {
    const out = [];
    // 4 horizontal
    const hPositions = [12, 38, 62, 88]; // % from top
    hPositions.forEach((topPct, i) => {
      out.push({
        orient: 'h',
        pos: topPct,
        color: MATRIX_COLORS[i % MATRIX_COLORS.length],
        length: 30 + Math.random() * 30, // % of width
        duration: 9 + Math.random() * 5,
        delay: -Math.random() * 12,
        dir: i % 2 === 0 ? 1 : -1,
      });
    });
    // 4 vertical
    const vPositions = [18, 45, 72, 92]; // % from left
    vPositions.forEach((leftPct, i) => {
      out.push({
        orient: 'v',
        pos: leftPct,
        color: MATRIX_COLORS[(i + 3) % MATRIX_COLORS.length],
        length: 25 + Math.random() * 30,
        duration: 10 + Math.random() * 5,
        delay: -Math.random() * 12,
        dir: i % 2 === 0 ? -1 : 1,
      });
    });
    return out;
  }, []);

  return (
    <div style={{ position:'absolute', inset:0, zIndex:0, pointerEvents:'none', overflow:'hidden' }}>
      <style>{`
        @keyframes mlH {
          from { transform: translateX(var(--start, -40%)); }
          to   { transform: translateX(var(--end, 140%)); }
        }
        @keyframes mlV {
          from { transform: translateY(var(--start, -40%)); }
          to   { transform: translateY(var(--end, 140%)); }
        }
      `}</style>
      {lines.map((ln, i) => {
        if (ln.orient === 'h') {
          const start = ln.dir > 0 ? '-60%' : '160%';
          const end   = ln.dir > 0 ? '160%' : '-60%';
          return (
            <div key={i}
              style={{
                position:'absolute',
                top: `${ln.pos}%`,
                left:0,
                width: `${ln.length}%`,
                height: 1,
                background: `linear-gradient(90deg, transparent 0%, ${ln.color} 20%, ${ln.color} 80%, transparent 100%)`,
                opacity: 0.85,
                '--start': start,
                '--end': end,
                animation: `mlH ${ln.duration}s linear ${ln.delay}s infinite`,
              }}
            />
          );
        } else {
          const start = ln.dir > 0 ? '-60%' : '160%';
          const end   = ln.dir > 0 ? '160%' : '-60%';
          return (
            <div key={i}
              style={{
                position:'absolute',
                left: `${ln.pos}%`,
                top:0,
                height: `${ln.length}%`,
                width: 1,
                background: `linear-gradient(180deg, transparent 0%, ${ln.color} 20%, ${ln.color} 80%, transparent 100%)`,
                opacity: 0.85,
                '--start': start,
                '--end': end,
                animation: `mlV ${ln.duration}s linear ${ln.delay}s infinite`,
              }}
            />
          );
        }
      })}
    </div>
  );
}

/* ─── Sheet expansion via measured height — physically pushes chat body up ─── */
/* Measures content height, then transitions from 0→h so flex:1 chat shrinks live */
function SheetWrap({ children, delay }) {
  const [h, setH] = useState(0);
  const [stable, setStable] = useState(false);
  const inner = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => {
      const naturalH = inner.current ? inner.current.scrollHeight : 600;
      // Double RAF: ensure browser has painted height:0 before transitioning
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setH(naturalH);
        // After animation, release height so content can grow freely (e.g. Why section)
        setTimeout(() => setStable(true), 420);
      }));
    }, delay || 0);
    return () => clearTimeout(t);
  }, []);

  if (stable) return <div style={{ flexShrink:0 }}>{children}</div>;

  return (
    <div style={{
      flexShrink:0,
      height: h,
      overflow:'hidden',
      transition: h > 0 ? 'height 380ms cubic-bezier(0.32,0.72,0,1)' : 'none',
    }}>
      <div ref={inner}>{children}</div>
    </div>
  );
}

  const handleMove = (clientY) => {
    if (!dragging) return;
    setDragY(Math.max(0, clientY - startY.current));

  const handleEnd = () => {
    setDragging(false);
    if (dragY > 100 && onDismiss) onDismiss();

          transition: dragging ? 'none' : 'transform .3s ease',
          opacity: dragging ? Math.max(0.5, 1 - dragY / 300) : 1,
        }}
          onTouchMove={e => handleMove(e.touches[0].clientY)}
          onMouseMove={e => { if (dragging) handleMove(e.clientY); }}
          onTouchEnd={handleEnd}
          onMouseUp={handleEnd}
          onMouseLeave={() => { if (dragging) handleEnd(); }}
        >
          <div onTouchStart={handleTouchStart} onMouseDown={handleMouseDown}
            style={{ padding:'14px 0 4px', cursor:'grab', flexShrink:0 }}>
            <div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} />
          </div>
          {children}
        </div>
      </div>
    </SheetWrap>
  );
}

/* ─── Streaming text — character-by-character like ChatGPT/Claude ─── */
/* ═══ CHAT DETAIL ═══ */
function ChatDetail({ item, label, labelColor, onClose, isSensitive, onSent, sentMessage, draftMode, onSkipDraft, onDraftFeedback, isFirstSend, onFirstSend, onDismissItem, isDismissing }) {
  const useSuggestMode = draftMode === 'suggest' && item.draft && !isSensitive;

  // Modes:
  // suggest — AI proposes next action at bottom
  // inline — draft shown in chat body, input at bottom (fallback after feedback)
  // editing — editing draft (works in both modes)
  // custom — user writing from scratch
  // sent — message sent
  // summary — sensitive message summary
  // feedback — AI asks why user keeps skipping drafts
  const getInitialMode = () => {
    if (isSensitive) return 'summary';
    if (item.mode === 'ask') return 'ask';
    if (!item.draft) return 'custom';
    if (sentMessage) return 'custom';
    return useSuggestMode ? 'suggest' : 'inline';
  };

  const [mode, setMode] = useState(getInitialMode);
  const [editVal, setEditVal] = useState(item.draft || '');
  const [customVal, setCustomVal] = useState('');
  const [bioExpanded, setBioExpanded] = useState(false);

  // DM bubble renderer — used by both legacy chatHistory and timeline sessions
  const renderDMBubble = (m, i, arr) => {
    const isOutgoing = m.from === 'you' || m.from === 'automation';
    const isAutomation = m.from === 'automation';
    const isLast = i === arr.length - 1 || arr[i+1]?.from !== m.from;
    const radius = m.from === 'them'
      ? (isLast ? '12px 12px 12px 2px' : '12px')
      : (isLast ? '12px 12px 2px 12px' : '12px');
    const bubbleBg = isOutgoing ? '#006BE2' : '#F5F5F5';
    const textColor = isOutgoing ? '#fff' : '#292929';
    const headerColor = '#BCD5FF';
    return (
      <div key={i}>
        {isOutgoing ? (
          <div style={{ display:'flex', justifyContent:'flex-end', paddingLeft:50 }}>
            <div style={{ padding:'10px 16px', borderRadius:radius, background:bubbleBg, maxWidth:288 }}>
              <div style={{ fontSize:12, fontWeight:500, color:headerColor, lineHeight:'16px', marginBottom:2 }}>
                {isAutomation ? 'Agent auto-reply' : 'You'}
              </div>
              <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:textColor }}>{m.text}</div>
            </div>
          </div>
        ) : (
          <div style={{ paddingRight:50 }}>
            <div style={{ display:'inline-block', padding:'10px 16px', borderRadius:radius, background:bubbleBg, maxWidth:288 }}>
              <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:textColor }}>{m.text}</div>
            </div>
          </div>
        )}
      </div>
    );
  };

  // Timeline renderer — for items with item.timeline
  const renderTimeline = (timeline, extraMsgs) => (
    <>
      {timeline.map((entry, ei) => {
        if (entry.type === 'comment') return (
          <div key={ei}>
            <div style={{ textAlign:'center', marginBottom:8 }}>
              <span style={{ fontSize:11, color:'#ABABAB' }}>{entry.date}</span>
            </div>
            <div style={{ borderLeft:'2px solid #E0E0E0', paddingLeft:10, marginBottom:5 }}>
              <div style={{ fontSize:10, fontWeight:500, color:'#ABABAB', letterSpacing:'0.03em', textTransform:'uppercase', marginBottom:3 }}>Comment on {entry.postLabel}</div>
              <div style={{ fontSize:12, fontWeight:400, color:'#4A4A4A', lineHeight:'17px' }}>{entry.comment}</div>
            </div>
            {entry.creatorReply && (
              <div style={{ display:'flex', alignItems:'flex-start', gap:6, paddingLeft:12 }}>
                <img src="https://i.pravatar.cc/40?u=sofiacoach" alt="" style={{ width:16, height:16, borderRadius:8, objectFit:'cover', flexShrink:0, marginTop:1, opacity:0.6 }} />
                <div style={{ borderLeft:'2px solid #F0F0F0', paddingLeft:8 }}>
                  <div style={{ fontSize:10, fontWeight:500, color:'#ABABAB', marginBottom:2 }}>You replied</div>
                  <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'17px' }}>{entry.creatorReply}</div>
                </div>
              </div>
            )}
          </div>
        );
        if (entry.type === 'bridge') return (
          <div key={ei} style={{ display:'flex', alignItems:'center', gap:8, margin:'4px 0 8px' }}>
            <div style={{ flex:1, height:1, background:'#EBEBEB' }} />
            <span style={{ fontSize:10, fontWeight:500, color:'#ABABAB', letterSpacing:'0.02em', whiteSpace:'nowrap' }}>Followed through DM</span>
            <div style={{ flex:1, height:1, background:'#EBEBEB' }} />
          </div>
        );
        if (entry.type === 'session') return (
          <div key={ei}>
            <div style={{ textAlign:'center', margin:'10px 0 8px' }}>
              <span style={{ fontSize:11, color:'#ABABAB' }}>{entry.date}</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {entry.messages.map((m, i) => renderDMBubble(m, i, entry.messages))}
            </div>
          </div>
        );
        return null;
      })}
      {extraMsgs.length > 0 && (
        <div style={{ display:'flex', flexDirection:'column', gap:8, marginTop:8 }}>
          {extraMsgs.map((m, i) => renderDMBubble(m, i, extraMsgs))}
        </div>
      )}
    </>
  );
  const [showToast, setShowToast] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [sentMsgs, setSentMsgs] = useState([]);
  const [activeTone, setActiveTone] = useState(null);
  const [editFeedback, setEditFeedback] = useState(null); // null | 'asking' | 'done'
  const [customFeedback, setCustomFeedback] = useState(null); // null | 'asking' | 'done'
  const [feedbackEligible, setFeedbackEligible] = useState(false);
  const customInputRef = useRef(null);
  const [chatInputFocused, setChatInputFocused] = useState(false);
  const [askVal, setAskVal] = useState('');
  const [askPhase, setAskPhase] = useState('input');
  const [showAskStyleReason, setShowAskStyleReason] = useState(false);
  const [generatedDraft, setGeneratedDraft] = useState('');
  const [generatedBecause, setGeneratedBecause] = useState('');
  const [showSendCelebration, setShowSendCelebration] = useState(false);
  const [undoCount, setUndoCount] = useState(0);
  const [lastSentCount, setLastSentCount] = useState(1);
  const [sentFromAgent, setSentFromAgent] = useState(false); // true only when agent draft was sent
  const undoTimerRef = useRef(null);
  const originalDraft = item.draft || '';
  const chatBodyRef = useRef(null);
  const [agentHelpPhase, setAgentHelpPhase] = useState(null); // null | 'bubble' | 'sheet' | 'recording' | 'typeInput' | 'thinking' | 'draft'
  const [agentHelpInput, setAgentHelpInput] = useState('');
  const [agentHelpDraft, setAgentHelpDraft] = useState('');

  // Simple diff: percentage of words changed
  const calcEditDistance = (a, b) => {
    if (!a || !b) return 1;
    const words1 = a.toLowerCase().split(/\s+/);
    const words2 = b.toLowerCase().split(/\s+/);
    let matches = 0;
    words2.forEach(w => { if (words1.includes(w)) matches++; });
    return 1 - (matches / Math.max(words1.length, 1));
  };

  // Intent label + context menu
  const [intentLabel, setIntentLabel] = useState(item.intent || null);
  const [intentMenu, setIntentMenu] = useState(false); // false | 'main' | 'change' | 'why'
  const allIntents = ['Interested', 'FAQ', 'Collab', 'Emotional', 'Spam', 'Other'];

  // Reasoning bottom sheet
  const [reasoningSheet, setReasoningSheet] = useState(null); // null or { title, body }
  const [agentOverlayOpen, setAgentOverlayOpen] = useState(false);
  const [currentDraft, setCurrentDraft] = useState(item.draft || '');

  const intentColors = {
    'Interested':'#E8710A', 'FAQ':'#2952CC', 'Collab':'#7627BB',
    'Emotional':'#D93025', 'Spam':'#6F757E', 'Other':'#525960',
  };

  const triggerToast = (msg) => {
    setToastMsg(msg);
    setShowToast(true);
    setTimeout(() => setShowToast(false), 2500);
  };

  // Helper: split draft into 2 messages at sentence boundary
  const splitDraft = (draft) => {
    if (!draft) return [draft];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };

  const handleSend = () => {
    const wasEditing = (mode === 'editing');
    const msg = wasEditing ? editVal : item.draft;
    // When sending from agent card (not editing), split into 2 messages
    if (!wasEditing) {
      const parts = splitDraft(msg);
      setLastSentCount(parts.length);
      setSentMsgs(prev => [...prev, ...parts]);
    } else {
      setLastSentCount(1);
      setSentMsgs(prev => [...prev, msg]);
    }
    setSentFromAgent(true);
    setMode('sent');
    if (wasEditing) {
      const distance = calcEditDistance(originalDraft, editVal);
      if (distance > 0.5 && !activeTone) {
        // Major rewrite — ask what was off after a brief pause
        setTimeout(() => setEditFeedback('asking'), 1200);
      } else {
        triggerToast(activeTone
          ? 'Got it, ' + activeTone.toLowerCase() + ' tone for similar messages.'
          : 'Noted. I\'ll adjust my style based on your edit.');
      }
    }
    if (onSent) onSent(item.user, msg);
    if (isFirstSend && onFirstSend) {
      onFirstSend();
      setShowSendCelebration(true);
      setTimeout(() => setShowSendCelebration(false), 1500);
    }
  };

  const handleSendCustom = () => {
    if (!customVal.trim()) return;
    setLastSentCount(1);
    setSentFromAgent(false);
    setSentMsgs(prev => [...prev, customVal]);
    setMode('sent');
    setCustomVal('');
    if (onSent) onSent(item.user, customVal);
    setTimeout(() => {
      setMode('custom');
      if (feedbackEligible) {
        setCustomFeedback('asking');
        setFeedbackEligible(false);
      }
    }, 300);
  };

  const handleSendAgentDraft = () => {
    if (!agentHelpDraft.trim()) return;
    setSentMsgs(prev => [...prev, agentHelpDraft]);
    setMode('sent');
    if (onSent) onSent(item.user, agentHelpDraft);
    setAgentHelpPhase(null);
    triggerToast('Got it, I\'ll adjust for next time');
  };

  const handleIllReply = () => {
    if (onSkipDraft) {
      const count = onSkipDraft();
      if (count >= 5) {
        // 5th skip — trigger feedback
        setMode('feedback');
        return;
      }
    }
    setMode('custom');
    setCustomVal('');
    if (item.draft) setFeedbackEligible(true);
  };

  const handleAskSubmit = () => {
    if (!askVal.trim()) return;
    setAskPhase('generating');
    setTimeout(() => {
      const draft = (item.draftTemplate || '').replace('{answer}', askVal.trim());
      const styleR = item.styleReasonTemplate || '';
      setGeneratedDraft(draft);
      setGeneratedBecause(styleR);
      setAskPhase('ready');
    }, 1500);
  };

  const handleAskSend = () => {
    setSentMsgs(prev => [...prev, generatedDraft]);
    setMode('sent');
    triggerToast('Got it, I\'ll use this for similar questions.');
    if (onSent) onSent(item.user);
  };

  const handleFeedbackChoice = (reason) => {
    triggerToast('Got it, ' + reason + '. I\'ll adjust.');
    if (onDraftFeedback) onDraftFeedback(); // switches parent to inline mode
    setMode('custom');
    setCustomVal('');
  };

  const handleUndo = () => {
    clearInterval(undoTimerRef.current);
    setSentMsgs(prev => prev.slice(0, -lastSentCount));
    setUndoCount(0);
    setMode('undo');
  };

  // Auto-focus custom input when transitioning from suggest
  useEffect(() => {
    if (mode === 'custom' && customInputRef.current) {
      setTimeout(() => customInputRef.current?.focus(), 50);
    }
  }, [mode]);

  // Scroll chat to bottom on mode change — keep scrolling during sheet resize
  useEffect(() => {
    if (!chatBodyRef.current) return;
    const el = chatBodyRef.current;
    const scroll = () => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    if (mode === 'suggest' || mode === 'ask' || mode === 'summary') {
      // Sheet has a delay + height animation; keep scrolling as it resizes
      const scrollInterval = setInterval(scroll, 100);
      setTimeout(() => clearInterval(scrollInterval), 2000);
    } else {
      setTimeout(scroll, 50);
    }
  }, [mode]);

  // Instant scroll to bottom on mount — user lands pre-scrolled, no animation
  useEffect(() => {
    if (!chatBodyRef.current) return;
    const el = chatBodyRef.current;
    el.scrollTop = el.scrollHeight;
  }, []);

  // Show agent help bubble when user starts typing in a chat they already replied to
  useEffect(() => {
    if (!sentMessage) return;
    if (customVal.trim() && agentHelpPhase === null) {
      setAgentHelpPhase('bubble');
    } else if (!customVal.trim() && agentHelpPhase === 'bubble') {
      setAgentHelpPhase(null);
    }
  }, [customVal]);

  // Undo countdown when mode becomes 'sent'
  useEffect(() => {
    if (mode !== 'sent') return;
    setUndoCount(5);
    let count = 5;
    undoTimerRef.current = setInterval(() => {
      count -= 1;
      setUndoCount(count);
      if (count <= 0) clearInterval(undoTimerRef.current);
    }, 1000);
    return () => clearInterval(undoTimerRef.current);
  }, [mode]);

  // Conversation history — use item.chatHistory if provided, otherwise generate default
  const chatHistory = item.chatHistory || [
    ...(item.source === 'DM' ? [{ from: 'them', text: 'Hey!', time: '2h ago' }] : []),
    { from: 'them', text: item.msg, time: item.time || '2h ago' },
  ];

  const sheetActive = (
    (mode === 'suggest' && !!item.draft) ||
    mode === 'ask' || mode === 'summary' || mode === 'undo' || mode === 'feedback' ||
    (!!agentHelpPhase && agentHelpPhase !== 'bubble' && mode === 'custom')
  );

  return (
    <div className={isDismissing ? 'screen-slide-out' : 'screen-slide-in'} onClick={(e) => e.stopPropagation()}
      style={{ position:'absolute', inset:0, zIndex:100,
        display:'flex', flexDirection:'column',
        background: T.paper,
        overflow:'hidden',
      }}>

    {/* ═══ CHAT CARD — flex:1 ═══ */}
    <div style={{
      flex:1, minHeight:0,
      background:T.paper,
      display:'flex', flexDirection:'column',
      overflow:'hidden',
    }}>
      {/* Header — back + avatar/name/context + intent + kebab */}
      <div style={{ padding:'48px 16px 10px', borderBottom:'1px solid #D6D6D6', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <div onClick={(e) => { e.stopPropagation(); onClose(); }} style={{ width:40, height:40, borderRadius:400, border:'1px solid #E0E2E5', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0, WebkitTapHighlightColor:'transparent' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </div>
          {item.avatar && <img src={item.avatar} alt="" style={{ width:32, height:32, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)', flexShrink:0 }} />}
          <div onClick={(e) => { e.stopPropagation(); setReasoningSheet({ title: 'About ' + (item.name || item.user), body: item.context || 'No additional context available.', intent: item.intent }); }}
            style={{ flex:1, minWidth:0, cursor:'pointer' }}>
            <div style={{ fontSize:14, fontWeight:500, color:'#292929', lineHeight:'20px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</div>
            <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px', display:'flex', alignItems:'center', gap:4 }}>
              <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.context || item.agentRead || item.summary || 'DM'}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" style={{ flexShrink:0 }}><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          {item.intent && (
            <div onClick={(e) => { e.stopPropagation(); setReasoningSheet({ title: 'Why ' + item.intent, body: item.context || 'No additional context available.', intent: item.intent }); }}
              style={{ background:'#F0F0F0', borderRadius:6, padding:'4px 8px', flexShrink:0, cursor:'pointer' }}>
              <span style={{ fontSize:12, fontWeight:500, color:'#525960', lineHeight:'16px' }}>{item.intent}</span>
            </div>
          )}
          <div style={{ width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center', cursor:'default', flexShrink:0 }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </div>
        </div>
      </div>

      {/* Chat body */}
      <div ref={chatBodyRef} style={{ flex:1, minHeight:0, overflowY:'auto', padding:'12px 16px 12px', display:'flex', flexDirection:'column', gap:12 }}>

        {/* Timeline renderer (rich history) or legacy flat chatHistory */}
        {item.timeline ? renderTimeline(item.timeline, sentMsgs) : (
          <>
            <div style={{ textAlign:'center' }}>
              <span style={{ fontSize:12, color:'#707070', lineHeight:'16px' }}>Today {item.time || '8:10 AM'}</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {chatHistory.map((m, i) => renderDMBubble(m, i, chatHistory))}
            </div>
          </>
        )}

        {/* Summary removed from chat body — agent explains in bottom sheet */}

        {/* Inline draft (fallback mode — draft shown in chat body) */}
        {mode === 'inline' && item.draft && (
          <div className="fade-up" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11, color:T.gray, marginBottom:4, fontWeight:500 }}>Inbox Agent</div>
            <div style={{ display:'flex', justifyContent:'flex-end' }}>
              <div style={{ maxWidth:'85%' }}>

        {sentMsgs.map((msg, i) => {

        {/* Inline draft replies — shown in chat body when draft exists */}
        {mode === 'suggest' && item.draft && (() => {
          const sentences = item.draft.split(/(?<=[.!?])\s+/);
          const splitIdx = Math.max(1, sentences.length - 1);
          const parts = [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')].filter(Boolean);

              {/* Why this reply */}
              {item.styleReason && (

              {/* Send replies button */}

                  Send replies
                </button>

          );
        })()}

        {/* Edit feedback moved to bottom section */}
      </div>

    </div>{/* ─── end chat card ─── */}

    {/* ═══ AGENT CARDS — below the chat, above input ═══ */}

    {/* AgentSheet removed — drafts now inline in chat body */}

    {/* Snackbar layer — in flow above input: agent on top, system at bottom */}
    {(showToast || (mode === 'sent' && undoCount > 0 && sentFromAgent)) && (
      <div style={{ flexShrink:0, display:'flex', flexDirection:'column' }}>
        {showToast && <AgentSnackbar message={toastMsg} />}
        {mode === 'sent' && undoCount > 0 && sentFromAgent && <SystemSnackbar message={lastSentCount > 1 ? 'Replies sent' : 'Reply sent'} onUndo={handleUndo} />}

    {/* ═══ Message Input — always visible ═══ */}

                style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>Yes</button>
              <button onClick={() => setCustomFeedback('why')}

                  style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>
                  {reason}
                </button>
              ))}
            </div>
          </div>

        {/* Expanded input — matches Figma: placeholder text on top, + and Ask Inbox + mic on bottom row */}
        <div style={{ background:'#fff', border: chatInputFocused ? '1px solid #006BE2' : '1px solid #E0E2E5', borderRadius:16, padding:'14px 16px', display:'flex', flexDirection:'column', gap:10, transition:'border-color .15s ease' }}>

              onFocus={() => setChatInputFocused(true)}
              onBlur={() => setChatInputFocused(false)}
              onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }}
              style={{ width:'100%', fontSize:15, color:'#292929', lineHeight:'20px', border:'none', outline:'none', resize:'none', minHeight:20, maxHeight:120, fontFamily:'Inter, system-ui, sans-serif', background:'transparent', padding:0 }} />
          ) : (
            <textarea ref={customInputRef} value={customVal} onChange={e => setCustomVal(e.target.value)}
              placeholder="Reply on Instagram..."
              onFocus={() => setChatInputFocused(true)}
              onBlur={() => setChatInputFocused(false)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey && customVal.trim()) { e.preventDefault(); handleSendCustom(); } }}
              onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }}
              rows={1}
              style={{ width:'100%', fontSize:15, color: customVal ? '#292929' : '#9A9A9A', lineHeight:'20px', border:'none', outline:'none', background:'transparent', fontFamily:'Inter, system-ui, sans-serif', resize:'none', minHeight:20, maxHeight:120, padding:0 }} />
          )}
          {/* Bottom row: + left, Ask Inbox pill + mic right */}
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ width:28, height:28, borderRadius:400, background:'#F0F0F0', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </div>
            <div style={{ flex:1 }} />
            <div onClick={() => setAgentOverlayOpen(true)}
              style={{ padding:'6px 14px', borderRadius:400, background:'#EEEEEE', cursor:'pointer', flexShrink:0, WebkitTapHighlightColor:'transparent' }}>
              <span style={{ fontSize:14, fontWeight:500, color:'#292929', lineHeight:'20px' }}>Ask Inbox</span>
            </div>
            {(mode === 'editing' ? editVal.trim() : customVal.trim()) ? (
              <div onClick={mode === 'editing' ? handleSend : handleSendCustom}
                style={{ width:32, height:32, borderRadius:16, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </div>
            ) : (
              <div style={{ width:32, height:32, borderRadius:16, background:'#F0F0F0', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </div>
            )}
          </div>
          {/* Tone pills — only in edit mode */}
          {mode === 'editing' && (
            <div style={{ display:'flex', gap:4 }}>
              {['Friendly','Formal','Shorter','Direct'].map(tone => (
                <div key={tone} onClick={() => {
                  setActiveTone(tone);
                  const base = originalDraft;
                  if (tone === 'Shorter') setEditVal(base.split(/(?<=[.!?])\s+/).slice(0,2).join(' '));
                  else if (tone === 'Friendly') setEditVal('Hey! ' + base.charAt(0).toLowerCase() + base.slice(1));
                  else if (tone === 'Formal') setEditVal('Thank you for reaching out. ' + base.replace(/!/g, '.'));
                  else if (tone === 'Direct') setEditVal(base.split(/(?<=[.!?])\s+/).filter(s => s.length > 20).join(' '));
                }}
                  style={{ background: activeTone === tone ? '#292929' : '#F5F5F5', borderRadius:8, padding:'8px 12px', cursor:'pointer' }}>
                  <span style={{ fontSize:12, fontWeight:500, color: activeTone === tone ? '#fff' : '#292929', lineHeight:'16px' }}>{tone}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    )}

    {/* Ask me about this DM — now integrated as tab above input */}

    {/* Agent Overlay */}
    {agentOverlayOpen && (
      <AgentOverlay
        item={item}
        draft={currentDraft || item.draft}
        onChangeDraft={(newDraft) => setCurrentDraft(newDraft)}
        onClose={() => setAgentOverlayOpen(false)}
      />
    )}

    {/* Reasoning Bottom Sheet */}
    {reasoningSheet && (
      <ReasoningSheet
        title={reasoningSheet.title}
        body={reasoningSheet.body}
        onClose={() => setReasoningSheet(null)}
        showSources={!reasoningSheet.intent}
        showFeedback={true}
        intent={reasoningSheet.intent}
        onNotInterested={() => {
          setReasoningSheet(null);
          if (onDismissItem) onDismissItem();
          onClose();
        }}
      />
    )}


  </div>
  );
}



/* ═══ AGENT OVERLAY — Siri-like floating chat ═══ */
function AgentOverlay({ item, draft, onChangeDraft, onClose }) {
  const [msgs, setMsgs] = useState([
    { from:'agent', text:'Is there anything you want to know about this contact or want me to do?' }
  ]);
  const [input, setInput] = useState('');
  const [pendingAction, setPendingAction] = useState(null); // { newDraft, closeAfter, skipContact }
  const inputRef = useRef(null);
  const msgsEndRef = useRef(null);
  const [overlayInputFocused, setOverlayInputFocused] = useState(false);

  useEffect(() => {
    if (inputRef.current) setTimeout(() => inputRef.current.focus(), 200);
  }, []);

  // Auto-scroll to latest message
  useEffect(() => {
    if (msgsEndRef.current) msgsEndRef.current.scrollIntoView({ behavior:'smooth' });
  }, [msgs.length]);

  // Generate proposal based on user query
  const getProposal = (q) => {
    const lower = q.toLowerCase();
    const contactName = item.name ? item.name.split(' ')[0] : 'this contact';

    // --- Info queries (no confirmation) ---
    if (lower.match(/tell me|who is|about|more info|background|bio/)) {
      const info = item.contactBioExpanded || item.context || (contactName + ' has been engaging with your content recently.');
      return { thinking: 'Looking up ' + contactName + '...', proposal: 'Here\'s what I know about ' + contactName + ':\n\n' + info, question: null };
    }

    if (lower.match(/why|reason|explain/)) {
      const info = item.styleReason || ('I based this reply on your usual tone and the context of ' + contactName + '\'s message.');
      return { thinking: 'Let me explain...', proposal: info, question: null };
    }

    if (lower.match(/history|previous|past|conversation/)) {
      const msgCount = (item.chatHistory ? item.chatHistory.length : 0);
      const timelineCount = (item.timeline ? item.timeline.length : 0);
      return { thinking: 'Checking history...', proposal: msgCount > 2 || timelineCount > 0
        ? (contactName + ' has ' + msgCount + ' messages in the current thread' + (timelineCount > 0 ? ' and a longer history with comments and past conversations' : '') + '. Tap their name to see the full thread.')
        : ('This is ' + contactName + '\'s first conversation with you. No previous history.'), question: null };
    }

    // --- Draft modifications (confirmation required) ---
    if (lower.match(/warm|friend|personal/)) {
      const newDraft = 'Hey ' + contactName + '! ' + draft;
      return { thinking: 'Making it warmer...', proposal: 'How about this?\n\n"' + newDraft + '"', question: 'Want me to update the reply?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/short|concise|brief/)) {
      const sentences = draft.split(/(?<=[.!?])\s+/);
      const newDraft = sentences.slice(0, 2).join(' ');
      return { thinking: 'Shortening it...', proposal: 'Here\'s a shorter version:\n\n"' + newDraft + '"', question: 'Should I use this instead?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/formal|professional/)) {
      const newDraft = draft.replace(/[^\w\s.,!?'"()\-:;]/g, '').replace(/^Hey |^Hi |^Hello /i, 'Dear ');
      return { thinking: 'Making it more professional...', proposal: 'Here\'s a more formal version:\n\n"' + newDraft + '"', question: 'Want me to use this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/longer|more detail|expand|elaborate/)) {
      const newDraft = draft + ' Let me know if you have any other questions \u2014 I\'m happy to help!';
      return { thinking: 'Expanding it...', proposal: 'Here\'s a more detailed version:\n\n"' + newDraft + '"', question: 'Should I update it?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/emoji|more personality|fun/)) {
      const emojis = ['\uD83D\uDE4C', '\uD83D\uDCAA', '\u2728', '\uD83C\uDF89', '\uD83D\uDC9B'];
      const picked = emojis[Math.floor(Math.random() * emojis.length)];
      const newDraft = picked + ' ' + draft;
      return { thinking: 'Adding personality...', proposal: 'How about this?\n\n"' + newDraft + '"', question: 'Want to use this version?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/no emoji|remove emoji|plain|clean/)) {
      const newDraft = draft.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}]/gu, '').replace(/\s{2,}/g, ' ').trim();
      return { thinking: 'Cleaning it up...', proposal: 'Here\'s a cleaner version:\n\n"' + newDraft + '"', question: 'Should I use this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/spanish|espanol|espa\u00f1ol/)) {
      const newDraft = '[Translated to Spanish] ' + draft;
      return { thinking: 'Switching to Spanish...', proposal: 'Here it is in Spanish:\n\n"' + newDraft + '"', question: 'Want me to switch?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/ignore|skip|don.t show|remove|archive/)) {
      return { thinking: 'Got it...', proposal: 'I\'ll archive ' + contactName + ' and won\'t show them again.', question: 'Confirm?', newDraft: '', closeAfter: true, skipContact: true };
    }

    if (lower.match(/book|link|calendly|schedule|call/)) {
      const newDraft = draft + '\n\nHere\'s my calendar to book a call: calendly.com/sofia';
      return { thinking: 'Adding the link...', proposal: 'I\'ll add your booking link at the end:\n\n"' + newDraft + '"', question: 'Look good?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/price|pricing|cost|how much/)) {
      const priceInfo = '\n\nPricing: 4-Week Kickstart is $197. 12-Week Reboot is $597 (or 3x $197/month).';
      const newDraft = draft + priceInfo;
      return { thinking: 'Adding pricing...', proposal: 'Added the pricing details:\n\n"' + newDraft + '"', question: 'Want me to include this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/follow.?up|remind|later|tomorrow/)) {
      return { thinking: 'Setting a reminder...', proposal: 'I\'ll remind you to follow up with ' + contactName + ' tomorrow. Should I send the current draft now?', question: 'Send and set reminder?', newDraft: draft, closeAfter: true };
    }

    if (lower.match(/vip|special|discount|exclusive/)) {
      const newDraft = draft.replace(/\.$/, '') + ' \u2014 and since you\'re one of my most valued community members, I have something special for you.';
      return { thinking: 'Adding VIP touch...', proposal: 'Here\'s a version with VIP treatment:\n\n"' + newDraft + '"', question: 'Want me to use this?', newDraft: newDraft, closeAfter: true };
    }

    // --- Draft generation (for items without drafts) ---
    if (lower.match(/draft|write|compose|reply for me|suggest a reply/)) {
      if (!draft || draft.trim() === '') {
        const templates = {
          Support: 'Hey ' + contactName + ', I\'m so sorry about this. Let me look into it right now and I\'ll get back to you within the hour. Hang tight!',
          Opportunities: 'Hey ' + contactName + '! Thanks for reaching out \u2014 I\'d love to tell you more about the program. What\'s your main goal right now?',
          Fans: contactName + ', thank you so much for this message! It truly means a lot to me. Keep going \u2014 you\'re doing amazing!',
        };
        const generated = templates[item.intent] || ('Hey ' + contactName + ', thanks for reaching out! Let me get back to you on this.');
        return { thinking: 'Writing a reply to ' + contactName + '...', proposal: 'How about this?\n\n"' + generated + '"', question: 'Want me to use this as the draft?', newDraft: generated, closeAfter: true };
      }
      return { thinking: 'Checking...', proposal: 'There\'s already a draft ready:\n\n"' + draft + '"\n\nWant me to modify it?', question: null };
    }

    // --- Context-aware fallback ---
    const suggestions = [];
    if (draft) {
      suggestions.push('Make it shorter', 'Make it warmer', 'Add a booking link');
    } else {
      suggestions.push('Draft a reply for me', 'Skip this one');
    }
    suggestions.push('Tell me about ' + contactName);

    return {
      thinking: 'Hmm...',
      proposal: 'I\'m not sure what you mean. Here are some things I can do:\n\n' + suggestions.map(function(s) { return '\u2022 ' + s; }).join('\n'),
      question: null,
    };
  };

  const send = () => {
    if (!input.trim()) return;
    const userMsg = input.trim();
    setInput('');

    // Add user message
    setMsgs(prev => [...prev, { from:'user', text:userMsg }]);

    // Add thinking
    setTimeout(() => {
      setMsgs(prev => [...prev, { from:'thinking' }]);
    }, 200);

    // Replace thinking with proposal
    const proposal = getProposal(userMsg);
    setTimeout(() => {
      setMsgs(prev => {
        const withoutThinking = prev.filter(m => m.from !== 'thinking');
        const newMsgs = [...withoutThinking, { from:'agent', text:proposal.proposal }];
        if (proposal.question) {
          newMsgs.push({ from:'confirm', text:proposal.question });
          setPendingAction({ newDraft:proposal.newDraft, closeAfter:proposal.closeAfter, skipContact:proposal.skipContact });
        }
        return newMsgs;
      });
    }, 1200);
  };

  const handleConfirm = (yes) => {
    if (yes && pendingAction) {
      if (pendingAction.newDraft !== undefined) onChangeDraft(pendingAction.newDraft);
      setMsgs(prev => [...prev, { from:'user', text:'Yes' }, { from:'agent', text:'Done ✓' }]);
      setPendingAction(null);
      // Close overlay after a brief moment
      if (pendingAction.closeAfter) setTimeout(onClose, 800);
    } else {
      setMsgs(prev => [...prev, { from:'user', text:'No' }, { from:'agent', text:'Okay, what would you prefer?' }]);
      setPendingAction(null);
    }
  };

  return (
    <div className="fade-in" style={{ position:'absolute', inset:0, zIndex:150, background:'rgba(21,27,36,0.55)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)', display:'flex', flexDirection:'column' }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>

      {/* Done button — top right */}
      {/* Close button — top right, white circle with X */}
      <div style={{ position:'absolute', top:52, right:20, zIndex:2 }} onClick={e => e.stopPropagation()}>
        <div onClick={onClose} style={{ width:40, height:40, borderRadius:400, background:'#FFFFFF', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', boxShadow:'0 2px 8px rgba(0,0,0,0.12)' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
      </div>

      {/* Spacer to push chat to bottom */}
      <div style={{ flex:1 }} />

      {/* Messages */}
      <div style={{ padding:'0 20px 12px', display:'flex', flexDirection:'column', gap:8, maxHeight:'60%', overflowY:'auto' }}>
        {msgs.map((m, i) => {
          // Thinking indicator
          if (m.from === 'thinking') {
            return (
              <div key={i} className="siri-bubble" style={{ display:'flex', justifyContent:'flex-start' }}>
                <div style={{ fontSize:14, lineHeight:'20px', color:'#292929', background:'#CDCDCD', padding:'10px 14px', borderRadius:'18px 18px 18px 4px', animation:'pulse 1.2s ease infinite' }}>Thinking...</div>
              </div>
            );
          }
          // Confirm buttons — home-style shortcut chips, side-by-side
          if (m.from === 'confirm') {
            return (
              <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', flexDirection:'column', gap:10 }}>
                <div style={{ alignSelf:'flex-start', fontSize:14, lineHeight:'20px', color:'#292929', background:'#CDCDCD', padding:'10px 14px', borderRadius:'18px 18px 18px 4px', maxWidth:'82%' }}>
                  {m.text}
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <div onClick={() => handleConfirm(false)}
                    style={{ flex:1, background:'#F5F5F5', border:'1px solid #E0E2E5', borderRadius:16, height:40, padding:'0 12px 0 14px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, cursor:'pointer', WebkitTapHighlightColor:'transparent', boxShadow:'0 1px 2px rgba(15,23,42,0.04), 0 4px 16px rgba(15,23,42,0.06)' }}>
                    <span style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>No</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                  </div>
                  <div onClick={() => handleConfirm(true)}
                    style={{ flex:1, background:'#F5F5F5', border:'1px solid #E0E2E5', borderRadius:16, height:40, padding:'0 12px 0 14px', display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, cursor:'pointer', WebkitTapHighlightColor:'transparent', boxShadow:'0 1px 2px rgba(15,23,42,0.04), 0 4px 16px rgba(15,23,42,0.06)' }}>
                    <span style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>Yes</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                  </div>
                </div>
              </div>
            );
          }
          // Regular messages — flat grey bubbles, no blur
          return (
            <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
              <div style={{
                maxWidth:'82%', fontSize:14, lineHeight:'20px',
                background: m.from === 'user' ? '#FFFFFF' : '#CDCDCD',
                color:'#292929',
                padding:'10px 14px',
                borderRadius: m.from === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                whiteSpace:'pre-line',
              }}>{m.text}</div>
            </div>
          );
        })}
        <div ref={msgsEndRef} />
      </div>

      {/* Input — expanded style, same dimensions as chat detail but light-gray fill + white border */}
      <div style={{ padding:'0 20px 24px' }} onClick={e => e.stopPropagation()}>
        <div style={{ background:'#F0F0F0', border:'1px solid #FFFFFF', borderRadius:16, padding:'14px 16px', display:'flex', flexDirection:'column', gap:10 }}>
          <textarea ref={inputRef} value={input} onChange={e => setInput(e.target.value)}
            onFocus={() => setOverlayInputFocused(true)}
            onBlur={() => setOverlayInputFocused(false)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}
            placeholder="Ask me anything"
            rows={1}
            onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }}
            style={{ width:'100%', fontSize:15, color: input ? '#292929' : '#9A9A9A', lineHeight:'20px', border:'none', outline:'none', resize:'none', minHeight:20, maxHeight:120, fontFamily:'Inter, system-ui, sans-serif', background:'transparent', padding:0 }} />
          {/* Bottom row: mic/send aligned right */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'flex-end' }}>
            {input.trim() ? (
              <div onClick={send}
                style={{ width:32, height:32, borderRadius:16, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </div>
            ) : (
              <div style={{ width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round"><line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="7" x2="8" y2="17"/><line x1="12" y1="4" x2="12" y2="20"/><line x1="16" y1="7" x2="16" y2="17"/><line x1="20" y1="10" x2="20" y2="14"/></svg>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══ FOCUS MODE (Tinder-like card swiper) ═══ */

function FocusMode({ title, items, initialSentSet, initialLaterSet, onClose, onSent }) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [sentSet, setSentSet] = useState(initialSentSet || new Set());
  const [laterSet, setLaterSet] = useState(initialLaterSet || new Set());
  const [showToast, setShowToast] = useState(false);
  const [toastUser, setToastUser] = useState('');
  const [toastType, setToastType] = useState('reply'); // 'reply' | 'snooze'
  const [toastDuration, setToastDuration] = useState('');
  const [snoozePicker, setSnoozePicker] = useState(null); // null or { item }
  const [expandedSummary, setExpandedSummary] = useState(false);
  // replyMode removed — input is always visible via tabs
  const [replyVal, setReplyVal] = useState('');
  const [agentOverlayOpen, setAgentOverlayOpen] = useState(false);
  const [chatDetailOpen, setChatDetailOpen] = useState(false);
  const [currentDraft, setCurrentDraft] = useState('');
  const [customSentMsg, setCustomSentMsg] = useState('');
  // true when the last send on this card was a custom/typed reply.
  // AI-draft sends auto-advance; we use this flag to avoid briefly flashing
  // the "Next" button for auto-advance sends.
  const [wasCustomSend, setWasCustomSend] = useState(false);
  const replyInputRef = useRef(null);
  const [replyFocused, setReplyFocused] = useState(false);
  const [reasoningSheet, setReasoningSheet] = useState(null);
  const [slideDir, setSlideDir] = useState('none'); // 'left' | 'right' | 'none'
  const [animKey, setAnimKey] = useState(0);
  const touchStartX = useRef(0);
  const touchDeltaX = useRef(0);

  const item = items[currentIdx];
  const allDone = !item || currentIdx >= items.length;

  // Split draft into 2 messages
  const splitDraft = (draft) => {
    if (!draft) return [];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };
  const draftParts = allDone ? [] : splitDraft(currentDraft || (item && item.draft));
  const isSent = allDone ? false : sentSet.has(item && item.user);
  const isLater = allDone ? false : laterSet.has(item && item.user);

  const goNext = () => {
    if (currentIdx < items.length) {
      setSlideDir('left');
      setAnimKey(k => k + 1);
      setExpandedSummary(false);
      setReplyVal('');
      setCustomSentMsg('');
      setWasCustomSend(false);
      setTimeout(() => setCurrentIdx(i => i + 1), 50);
    }
  };
  const goPrev = () => {
    if (currentIdx > 0) {
      setSlideDir('right');
      setAnimKey(k => k + 1);
      setTimeout(() => setCurrentIdx(i => i - 1), 50);
    }
  };

  const undoTimerRef = useRef(null);
  const prevIdxRef = useRef(0);

  const handleSend = () => {
    // Step 1: Drafts turn blue + toast appears immediately
    setSentSet(prev => new Set([...prev, item.user]));
    setToastUser(item.name || item.user);
    setToastType('reply');
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    setShowToast(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
    // Step 2: After 1s, slide to next card (or completion)
    setTimeout(() => {
      if (currentIdx < items.length) {
        goNext();
      }
    }, 1000);
  };

  const handleUndo = () => {
    if (toastType === 'snooze') {
      // Undo snooze: remove from laterSet and go back
      const userToUndo = items[prevIdxRef.current]?.user;
      if (userToUndo) setLaterSet(prev => { const n = new Set(prev); n.delete(userToUndo); return n; });
      setShowToast(false);
      clearTimeout(undoTimerRef.current);
      setSlideDir('right');
      setAnimKey(k => k + 1);
      setExpandedSummary(false);
      setTimeout(() => setCurrentIdx(prevIdxRef.current), 50);
      return;
    }
    // Undo reply: remove from sent, go back to previous card
    const userToUndo = items[prevIdxRef.current]?.user;
    if (userToUndo) setSentSet(prev => { const n = new Set(prev); n.delete(userToUndo); return n; });
    setShowToast(false);
    clearTimeout(undoTimerRef.current);
    // Swipe back to previous card
    setSlideDir('right');
    setAnimKey(k => k + 1);
    setExpandedSummary(false);
    setTimeout(() => setCurrentIdx(prevIdxRef.current), 50);
  };

  const handleSendCustomReply = () => {
    if (!replyVal.trim()) return;
    setCustomSentMsg(replyVal);
    setReplyVal('');
    setSentSet(prev => new Set([...prev, item.user]));
    setWasCustomSend(true);
    setToastUser(item.name || item.user);
    setToastType('reply');
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    // NO auto-advance — user stays on this card and sees a "Next" button
    setShowToast(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
  };

  const handleSnoozeChoice = (durationLabel) => {
    const snoozedItem = snoozePicker?.item || item;
    if (!snoozedItem) return;
    setLaterSet(prev => new Set([...prev, snoozedItem.user]));
    setToastUser(snoozedItem.name || snoozedItem.user);
    setToastType('snooze');
    setToastDuration(durationLabel);
    prevIdxRef.current = currentIdx;
    setSnoozePicker(null);
    goNext();
    setShowToast(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
  };

  // Auto-focus removed — input is always visible

  // Sync currentDraft when card changes
  useEffect(() => {
    if (item) {
      setCurrentDraft(item.draft || '');
      setAgentOverlayOpen(false);
    }
  }, [currentIdx]);

  // Touch swipe handlers
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchMove = (e) => { touchDeltaX.current = e.touches[0].clientX - touchStartX.current; };
  const onTouchEnd = () => {
    if (touchDeltaX.current < -60) goNext();
    else if (touchDeltaX.current > 60) goPrev();
    touchDeltaX.current = 0;
  };

  return (
    <div className="screen-slide-in" style={{ position:'absolute', inset:0, zIndex:100, background:'#F5F5F5', display:'flex', flexDirection:'column' }}>

      {/* Header — back arrow (left) + title (center); no new-chat button per design */}
      <div style={{ padding:'52px 16px 12px', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
        <div onClick={() => onClose(sentSet, laterSet)} style={{ width:40, height:40, borderRadius:400, background:'#fff', border:'1px solid #E0E2E5', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0, WebkitTapHighlightColor:'transparent' }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div style={{ flex:1, textAlign:'center' }}>
          <div style={{ fontSize:16, fontWeight:600, color:'#292929', lineHeight:'20px' }}>{title}</div>
          <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px' }}>{allDone ? 'Done' : (currentIdx + 1) + ' of ' + items.length}</div>
        </div>
        <div style={{ width:40, flexShrink:0 }} />
      </div>

      {/* Completion state — empty state below header */}
      {allDone ? (
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:32 }}>
          <div style={{ fontSize:20, fontWeight:600, color:'#292929', textAlign:'center', lineHeight:'28px', marginBottom:16 }}>All done!</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'center' }}>
            {sentSet.size > 0 && (
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0C8143" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span style={{ fontSize:14, fontWeight:500, color:'#0C8143' }}>{sentSet.size} replied</span>
              </div>
            )}
            {laterSet.size > 0 && (
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span style={{ fontSize:14, fontWeight:500, color:'#707070' }}>{laterSet.size} for later</span>
              </div>
            )}
          </div>
        </div>
      ) : (
      <>

      {/* Scrollable card area */}
      <div key={animKey} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ flex:1, display:'flex', flexDirection:'column', padding:'0 16px 12px', minHeight:0,
          transformOrigin:'50% 100%',
          animation: slideDir === 'left' ? 'cardRiseIn .42s cubic-bezier(.22,.9,.32,1.02) both' : slideDir === 'right' ? 'cardReturnIn .4s cubic-bezier(.22,.9,.32,1.02) both' : 'cardRiseIn .35s cubic-bezier(.22,.9,.32,1.02) both'
        }}>

        {/* Floating contact card — holds its own chat scroll + input */}
        <div style={{ flex:1, background:'#fff', border:'1px solid #E6E6E6', borderRadius:20, boxShadow:'0 1px 2px rgba(15,23,42,0.04), 0 12px 32px rgba(15,23,42,0.10)', display:'flex', flexDirection:'column', overflow:'hidden', minHeight:0 }}>

          {/* Pinned card header */}
          <div style={{ padding:'14px 16px', display:'flex', alignItems:'center', gap:12, borderBottom:'1px solid #F0F0F0', flexShrink:0 }}>
            <img src={item.avatar} alt="" style={{ width:36, height:36, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)', flexShrink:0 }} />
            <div onClick={() => setReasoningSheet({ title: 'About ' + (item.name || item.user), body: item.context || 'No context available.', intent: item.intent })} style={{ flex:1, minWidth:0, cursor:'pointer' }}>
              <div style={{ fontSize:14, fontWeight:600, color:'#292929', lineHeight:'18px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</div>
              <div style={{ display:'flex', alignItems:'center', gap:2, marginTop:1 }}>
                <span style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.context || item.agentRead || item.summary || 'DM'}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            </div>
            {item.intent && (
              <div style={{ background:'#F0F0F0', borderRadius:6, padding:'4px 8px', flexShrink:0 }}>
                <span style={{ fontSize:12, fontWeight:500, color:'#525960', lineHeight:'16px' }}>{item.intent}</span>
              </div>
            )}
          </div>

          {/* Scrollable chat body — auto-scrolled to bottom. Tapping opens full ChatDetail. */}
          <div onClick={() => setChatDetailOpen(true)} ref={el => { if (el) { setTimeout(() => { el.scrollTop = el.scrollHeight; }, 30); } }} style={{ flex:1, overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:10, minHeight:0, cursor:'pointer' }}>
            {/* Render existing chat history / timeline */}
            {item.timeline && item.timeline.length > 0 && item.timeline.map((entry, ei) => {
              if (entry.type === 'comment') return (
                <div key={'t'+ei} style={{ marginBottom:4 }}>
                  <div style={{ textAlign:'center', marginBottom:6 }}>
                    <span style={{ fontSize:11, color:'#ABABAB' }}>{entry.date}</span>
                  </div>
                  <div style={{ borderLeft:'2px solid #E0E0E0', paddingLeft:10 }}>
                    <div style={{ fontSize:10, fontWeight:500, color:'#ABABAB', letterSpacing:'0.03em', textTransform:'uppercase', marginBottom:3 }}>Comment on {entry.postLabel}</div>
                    <div style={{ fontSize:13, fontWeight:400, color:'#4A4A4A', lineHeight:'18px' }}>{entry.comment}</div>
                  </div>
                </div>
              );
              if (entry.type === 'bridge') return (
                <div key={'t'+ei} style={{ display:'flex', alignItems:'center', gap:8, margin:'4px 0' }}>
                  <div style={{ flex:1, height:1, background:'#EBEBEB' }} />
                  <span style={{ fontSize:11, fontWeight:500, color:'#ABABAB', whiteSpace:'nowrap' }}>Followed through DM</span>
                  <div style={{ flex:1, height:1, background:'#EBEBEB' }} />
                </div>
              );
              if (entry.type === 'session') return (
                <React.Fragment key={'t'+ei}>
                  <div style={{ textAlign:'center', margin:'6px 0' }}>
                    <span style={{ fontSize:11, color:'#ABABAB' }}>{entry.date}</span>
                  </div>
                  {entry.messages.map((m, mi) => {
                    const outgoing = m.from === 'you' || m.from === 'automation';
                    const isAutomation = m.from === 'automation';
                    const bg = outgoing ? '#006BE2' : '#F0F0F0';
                    const txtColor = outgoing ? '#fff' : '#292929';
                    return (
                      <div key={'m'+mi} style={{ display:'flex', justifyContent: outgoing ? 'flex-end' : 'flex-start' }}>
                        <div style={{ maxWidth:'80%', padding:'10px 14px', borderRadius: outgoing ? '14px 14px 2px 14px' : '14px 14px 14px 2px', background:bg }}>
                          {outgoing && (
                            <div style={{ fontSize:11, fontWeight:500, color:'#BCD5FF', lineHeight:'14px', marginBottom:2 }}>
                              {isAutomation ? 'Agent auto-reply' : 'You'}
                            </div>
                          )}
                          <div style={{ fontSize:14, fontWeight:400, lineHeight:'20px', color:txtColor }}>{m.text}</div>
                        </div>
                      </div>
                    );
                  })}
                </React.Fragment>
              );
              return null;
            })}

            {/* Legacy chatHistory — render as bubbles if no timeline */}
            {(!item.timeline || item.timeline.length === 0) && item.chatHistory && item.chatHistory.length > 0 && item.chatHistory.map((m, mi) => {
              const outgoing = m.from === 'you' || m.from === 'automation';
              const isAutomation = m.from === 'automation';
              const bg = outgoing ? '#006BE2' : '#F0F0F0';
              const txtColor = outgoing ? '#fff' : '#292929';
              return (
                <div key={'ch'+mi} style={{ display:'flex', justifyContent: outgoing ? 'flex-end' : 'flex-start' }}>
                  <div style={{ maxWidth:'80%', padding:'10px 14px', borderRadius: outgoing ? '14px 14px 2px 14px' : '14px 14px 14px 2px', background:bg }}>
                    {outgoing && (
                      <div style={{ fontSize:11, fontWeight:500, color:'#BCD5FF', lineHeight:'14px', marginBottom:2 }}>
                        {isAutomation ? 'Agent auto-reply' : 'You'}
                      </div>
                    )}
                    <div style={{ fontSize:14, fontWeight:400, lineHeight:'20px', color:txtColor }}>{m.text}</div>
                  </div>
                </div>
              );
            })}

            {/* Fallback single message if nothing else */}
            {!item.timeline && !item.chatHistory && item.msg && (
              <div style={{ display:'flex', justifyContent:'flex-start' }}>
                <div style={{ maxWidth:'80%', padding:'10px 14px', borderRadius:'14px 14px 14px 2px', background:'#F0F0F0' }}>
                  <div style={{ fontSize:14, fontWeight:400, lineHeight:'20px', color:'#292929' }}>{item.msg}</div>
                </div>
              </div>
            )}

            {/* Draft bubbles at the bottom */}
            {!customSentMsg && draftParts.length > 0 && (
              <div style={{ display:'flex', flexDirection:'column', gap:6, alignItems:'flex-end', marginTop:4 }}>
                {draftParts.map((part, pi) => (
                  <div key={'d'+pi} style={{
                    maxWidth:'80%',
                    padding:'10px 14px',
                    borderRadius: pi === draftParts.length - 1 ? '14px 14px 2px 14px' : '14px',
                    background: isSent ? '#006BE2' : 'transparent',
                    border: isSent ? 'none' : '1.5px dashed #292929',
                    transition: 'all .4s ease',
                  }}>
                    {isSent && pi === 0 && <div style={{ fontSize:11, fontWeight:500, color:'#BCD5FF', lineHeight:'14px', marginBottom:2 }}>You</div>}
                    <div style={{ fontSize:14, fontWeight:400, fontStyle: isSent ? 'normal' : 'italic', lineHeight:'20px', color: isSent ? '#fff' : '#292929' }}>{part}</div>
                  </div>
                ))}
                {item.styleReason && !isSent && (
                  <div onClick={(e) => { e.stopPropagation(); setReasoningSheet({ title:'Why this reply', body: item.styleReason }); }}
                    style={{ display:'flex', alignItems:'center', gap:4, cursor:'pointer', marginTop:2 }}>
                    <span style={{ fontSize:12, fontWeight:400, color:'#707070' }}>Why this reply</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                  </div>
                )}
              </div>
            )}

            {/* No-draft explainer */}
            {!customSentMsg && draftParts.length === 0 && !isSent && item.noDraftReason && (
              <div style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'8px 0' }}>

              <div className="fade-up" style={{ display:'flex', justifyContent:'flex-end', marginTop:4 }}>

                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2.2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </div>
              <textarea ref={replyInputRef} value={replyVal} onChange={e => setReplyVal(e.target.value)}
                onFocus={() => setReplyFocused(true)}
                onBlur={() => setReplyFocused(false)}
                placeholder="Reply on Instagram..."
                rows={1}
                onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; }}
                style={{ flex:1, fontSize:15, color: replyVal ? '#292929' : '#9A9A9A', lineHeight:'20px', border:'none', outline:'none', resize:'none', minHeight:20, maxHeight:120, fontFamily:'Inter, system-ui, sans-serif', background:'transparent', padding:0 }} />
              {replyVal.trim() ? (
                <div onClick={handleSendCustomReply}
                  style={{ width:32, height:32, borderRadius:16, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

              ) : (
                <div style={{ width:32, height:32, borderRadius:16, background:'#F0F0F0', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, cursor:'pointer' }}>

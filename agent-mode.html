/* Figma: node 1085:62016 "purple background" — exact conic + blur from Figma variables */
const OB_PURPLE = {
  base: '#5400AF',       /* purple.700 — darkest stop */
  blurConic: 'conic-gradient(from 90deg at 50% 50%, #5400AF 0%, #590AB5 4.57%, #5F15BB 9.13%, #6A2AC8 18.27%, #7F53E0 36.54%, #6E30D4 63.94%, #6118C2 81.97%, #5B0CB8 90.99%, #5400AF 100%)',
  blur: 50,              /* Figma: blur(50px) */
};
const OB_GRID_ACCENT = '#00F6FF'; /* Electric Cyan — traveling highlight on rails */
const OB_GRID_MASK = 'radial-gradient(ellipse 85% 70% at 52% 48%, black 10%, rgba(0,0,0,0.45) 52%, transparent 82%)';

const OB_ICON = {
  onlyMatters: '#77CADF',
  repliesVoice: '#A5CA66',
  personalStuff: '#F14D33',
};

/* ─── Shared purple background + fixed grid; loading = pulses on rails (Tron-style) ─── */
function PurpleBg({ gridMode = 'idle' }) {
  const canvasRef = useRef(null);
  const loading = gridMode === 'loading';
  const lineH = loading ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.17)';
  const lineV = loading ? 'rgba(255,255,255,0.17)' : 'rgba(255,255,255,0.15)';

  useEffect(() => {
    if (!loading) return;
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = 393;
    const H = 852;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = `${W}px`;
    canvas.style.height = `${H}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const CW = 84;
    const CH = 87;
    const vXs = [];
    for (let x = CW - 42; x < W; x += CW) vXs.push(x);
    const hYs = [];
    for (let y = 0; y <= H; y += CH) hYs.push(y);

    /* Electric Cyan — OB_GRID_ACCENT */
    const cyan = 'rgba(0,246,255,0.55)';

    function mkV(x) {
      return { x, y: Math.random() * H, speed: 0.9 + Math.random() * 1.4, len: 32 + Math.random() * 44 };
    }
    function mkH(y) {
      return { x: Math.random() * W, y, speed: 0.75 + Math.random() * 1.2, len: 36 + Math.random() * 50 };
    }
    const vSegs = vXs.map(mkV);
    const hSegs = hYs.map(mkH);

    let id;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.lineWidth = 1.25;

      vSegs.forEach((w) => {
        w.y += w.speed;
        if (w.y > H + w.len) w.y = -w.len;
        const g = ctx.createLinearGradient(0, w.y, 0, w.y + w.len);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.5)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.4)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x, w.y + w.len);
        ctx.stroke();
      });

      hSegs.forEach((w) => {
        w.x += w.speed;
        if (w.x > W + w.len) w.x = -w.len;
        const g = ctx.createLinearGradient(w.x, 0, w.x + w.len, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
        g.addColorStop(0.52, cyan);
        g.addColorStop(0.7, 'rgba(255,255,255,0.32)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.beginPath();
        ctx.moveTo(w.x, w.y);
        ctx.lineTo(w.x + w.len, w.y);
        ctx.stroke();
      });

      id = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(id);
  }, [loading]);

  return (
    <div style={{ position:'absolute', inset:0, overflow:'hidden', zIndex:0, pointerEvents:'none' }}>
      <div style={{
        position:'absolute', inset:'-20%',
        background: OB_PURPLE.blurConic,
        filter:`blur(${OB_PURPLE.blur}px)`,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(${lineH} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      <div style={{
        position:'absolute', inset:0,
        backgroundImage: `linear-gradient(90deg, ${lineV} 1px, transparent 1px)`,
        backgroundSize:'84px 87px',
        backgroundPosition:'-42px 0',
        maskImage: OB_GRID_MASK,
        WebkitMaskImage: OB_GRID_MASK,
      }} />
      {loading && (
        <canvas
          ref={canvasRef}
          style={{
            position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
            maskImage: OB_GRID_MASK, WebkitMaskImage: OB_GRID_MASK,
          }}
        />
      )}
    </div>
  );
}

/* ─── Step 2: Loading — grid motion via PurpleBg + cycling messages ─── */
function ObSorting({ onNext }) {
  const [msgIdx, setMsgIdx] = useState(0);
  const [msgVis, setMsgVis] = useState(true);

  const messages = [
    'Reading your DMs...',
    'Finding what needs you...',
    'Drafting replies...',
    'Almost ready...',
  ];

  // Cycle messages with a fade cross-dissolve
  useEffect(() => {
    const iv = setInterval(() => {
      setMsgVis(false);
      setTimeout(() => { setMsgIdx(i => (i + 1) % messages.length); setMsgVis(true); }, 280);
    }, 1100);
    return () => clearInterval(iv);
  }, []);

  // Auto-advance after 4s
  useEffect(() => {
    const t = setTimeout(onNext, 4000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', position:'relative' }}>
      <div style={{ position:'relative', zIndex:2, opacity: msgVis ? 1 : 0, transition:'opacity 0.28s ease' }}>

          WebkitTextFillColor:'transparent',
          backgroundClip:'text',
          animation:'textShimmer 2.5s linear infinite',
        }}>{messages[msgIdx]}</span>

    </div>
  );
}

/* ─── Sheet expansion via measured height — physically pushes chat body up ─── */
/* Measures content height, then transitions from 0→h so flex:1 chat shrinks live */
function SheetWrap({ children, delay }) {
  const [h, setH] = useState(0);
  const [stable, setStable] = useState(false);
  const inner = useRef(null);

  useEffect(() => {
    const t = setTimeout(() => {
      const naturalH = inner.current ? inner.current.scrollHeight : 600;
      // Double RAF: ensure browser has painted height:0 before transitioning
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setH(naturalH);
        // After animation, release height so content can grow freely (e.g. Why section)
        setTimeout(() => setStable(true), 420);
      }));
    }, delay || 0);
    return () => clearTimeout(t);
  }, []);

  if (stable) return <div style={{ flexShrink:0 }}>{children}</div>;

  return (
    <div style={{
      flexShrink:0,
      height: h,
      overflow:'hidden',
      transition: h > 0 ? 'height 380ms cubic-bezier(0.32,0.72,0,1)' : 'none',
    }}>
      <div ref={inner}>{children}</div>
    </div>
  );
}

/* ─── Agent Sheet Shell — bottom sheet for ask / summary / undo / etc. ─── */
function AgentSheetShell({ children, onDismiss }) {
  const [dragY, setDragY] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startY = useRef(0);

  const handleTouchStart = (e) => { startY.current = e.touches[0].clientY; setDragging(true); };
  const handleMouseDown = (e) => { startY.current = e.clientY; setDragging(true); };
  const handleMove = (clientY) => {
    if (!dragging) return;
    setDragY(Math.max(0, clientY - startY.current));
  };
  const handleEnd = () => {
    setDragging(false);
    if (dragY > 100 && onDismiss) onDismiss();
    else setDragY(0);
  };

  return (
    <SheetWrap>
      {/* Padding wrapper — paddingBottom is included in scrollHeight (unlike margin) so the 32px gap renders correctly */}
      <div style={{ padding:'0 16px 32px' }}>
        <div style={{
          background:'#fff', borderRadius:12,
          border:'1px solid #D6D6D6',
          boxShadow:'0 8px 16px rgba(132,146,166,0.12)',
          padding:'0 24px 32px',
          display:'flex', flexDirection:'column', gap:16,
          transform:`translateY(${dragY}px)`,
          transition: dragging ? 'none' : 'transform .3s ease',
          opacity: dragging ? Math.max(0.5, 1 - dragY / 300) : 1,
        }}
          onTouchMove={e => handleMove(e.touches[0].clientY)}
          onMouseMove={e => { if (dragging) handleMove(e.clientY); }}
          onTouchEnd={handleEnd}
          onMouseUp={handleEnd}
          onMouseLeave={() => { if (dragging) handleEnd(); }}
        >
          <div onTouchStart={handleTouchStart} onMouseDown={handleMouseDown}
            style={{ padding:'14px 0 4px', cursor:'grab', flexShrink:0 }}>
            <div style={{ width:36, height:4, background:'rgba(0,0,0,0.12)', borderRadius:2, margin:'0 auto' }} />
          </div>
          {children}
        </div>
      </div>
    </SheetWrap>
  );
}

  const useSuggestMode = draftMode === 'suggest' && item.draft && !isSensitive;

  // Modes:
  // suggest — AI proposes next action at bottom
  // inline — draft shown in chat body, input at bottom (fallback after feedback)
  // editing — editing draft (works in both modes)
  // custom — user writing from scratch
  // sent — message sent
  // summary — sensitive message summary
  // feedback — AI asks why user keeps skipping drafts
  const getInitialMode = () => {
    if (isSensitive) return 'summary';
    if (item.mode === 'ask') return 'ask';
    if (!item.draft) return 'custom';
    if (sentMessage) return 'custom';
    return useSuggestMode ? 'suggest' : 'inline';

  const [mode, setMode] = useState(getInitialMode);
  const [editVal, setEditVal] = useState(item.draft || '');

  const [bioExpanded, setBioExpanded] = useState(false);

  // DM bubble renderer — used by both legacy chatHistory and timeline sessions
  const renderDMBubble = (m, i, arr) => {
    const isOutgoing = m.from === 'you' || m.from === 'automation';
    const isAutomation = m.from === 'automation';
    const isLast = i === arr.length - 1 || arr[i+1]?.from !== m.from;
    const radius = m.from === 'them'
      ? (isLast ? '12px 12px 12px 2px' : '12px')

                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AB3EC1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>

      {extraMsgs.length > 0 && (

  const [showToast, setShowToast] = useState(false);

  const [sentMsgs, setSentMsgs] = useState([]);
  const [activeTone, setActiveTone] = useState(null);

  const calcEditDistance = (a, b) => {
    if (!a || !b) return 1;
    const words1 = a.toLowerCase().split(/\s+/);
    const words2 = b.toLowerCase().split(/\s+/);
    let matches = 0;
    words2.forEach(w => { if (words1.includes(w)) matches++; });

  // Helper: split draft into 2 messages at sentence boundary
  const splitDraft = (draft) => {
    if (!draft) return [draft];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };

  const handleSend = () => {
    const wasEditing = (mode === 'editing');
    const msg = wasEditing ? editVal : item.draft;
    // When sending from agent card (not editing), split into 2 messages
    if (!wasEditing) {
      const parts = splitDraft(msg);
      setLastSentCount(parts.length);
      setSentMsgs(prev => [...prev, ...parts]);
    } else {
      setLastSentCount(1);
      setSentMsgs(prev => [...prev, msg]);
    }
    setSentFromAgent(true);
    setMode('sent');
    if (wasEditing) {
      const distance = calcEditDistance(originalDraft, editVal);
      if (distance > 0.5 && !activeTone) {
        // Major rewrite — ask what was off after a brief pause
        setTimeout(() => setEditFeedback('asking'), 1200);
      } else {
        triggerToast(activeTone
          ? 'Got it, ' + activeTone.toLowerCase() + ' tone for similar messages.'
          : 'Noted. I\'ll adjust my style based on your edit.');
      }
    }
    if (onSent) onSent(item.user, msg);
    if (isFirstSend && onFirstSend) {
      onFirstSend();
      setShowSendCelebration(true);
      setTimeout(() => setShowSendCelebration(false), 1500);
    }
  };

  const handleSendCustom = () => {
    if (!customVal.trim()) return;
    setLastSentCount(1);
    setSentFromAgent(false);
    setSentMsgs(prev => [...prev, customVal]);
    setMode('sent');
    setCustomVal('');
    if (onSent) onSent(item.user, customVal);
    setTimeout(() => {
      setMode('custom');
      if (feedbackEligible) {
        setCustomFeedback('asking');
        setFeedbackEligible(false);
      }
    }, 300);
  };

  const handleSendAgentDraft = () => {
    if (!agentHelpDraft.trim()) return;
    setSentMsgs(prev => [...prev, agentHelpDraft]);
    setMode('sent');
    if (onSent) onSent(item.user, agentHelpDraft);
    setAgentHelpPhase(null);
    triggerToast('Got it, I\'ll adjust for next time');
  };

  const handleIllReply = () => {
    if (onSkipDraft) {
      const count = onSkipDraft();
      if (count >= 5) {
        // 5th skip — trigger feedback
        setMode('feedback');
        return;
      }
    }
    setMode('custom');
    setCustomVal('');
    if (item.draft) setFeedbackEligible(true);
  };

  const handleAskSubmit = () => {
    if (!askVal.trim()) return;
    setAskPhase('generating');
    setTimeout(() => {
      const draft = (item.draftTemplate || '').replace('{answer}', askVal.trim());
      const styleR = item.styleReasonTemplate || '';
      setGeneratedDraft(draft);
      setGeneratedBecause(styleR);
      setAskPhase('ready');
    }, 1500);
  };

  const handleAskSend = () => {
    setSentMsgs(prev => [...prev, generatedDraft]);
    setMode('sent');
    triggerToast('Got it, I\'ll use this for similar questions.');
    if (onSent) onSent(item.user);
  };

  const handleFeedbackChoice = (reason) => {
    triggerToast('Got it, ' + reason + '. I\'ll adjust.');
    if (onDraftFeedback) onDraftFeedback(); // switches parent to inline mode
    setMode('custom');
    setCustomVal('');
  };

  const handleUndo = () => {
    clearInterval(undoTimerRef.current);
    setSentMsgs(prev => prev.slice(0, -lastSentCount));
    setUndoCount(0);
    setMode('undo');
  };

  // Auto-focus custom input when transitioning from suggest
  useEffect(() => {
    if (mode === 'custom' && customInputRef.current) {
      setTimeout(() => customInputRef.current?.focus(), 50);
    }
  }, [mode]);

  // Scroll chat to bottom on mode change — keep scrolling during sheet resize
  useEffect(() => {
    if (!chatBodyRef.current) return;
    const el = chatBodyRef.current;
    const scroll = () => el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    if (mode === 'suggest' || mode === 'ask' || mode === 'summary') {
      // Sheet has a delay + height animation; keep scrolling as it resizes
      const scrollInterval = setInterval(scroll, 100);
      setTimeout(() => clearInterval(scrollInterval), 2000);
    } else {
      setTimeout(scroll, 50);
    }
  }, [mode]);

  // Show agent help bubble when user starts typing in a chat they already replied to
  useEffect(() => {
    if (!sentMessage) return;
    if (customVal.trim() && agentHelpPhase === null) {
      setAgentHelpPhase('bubble');
    } else if (!customVal.trim() && agentHelpPhase === 'bubble') {
      setAgentHelpPhase(null);
    }
  }, [customVal]);

  // Undo countdown when mode becomes 'sent'
  useEffect(() => {
    if (mode !== 'sent') return;
    setUndoCount(5);
    let count = 5;
    undoTimerRef.current = setInterval(() => {
      count -= 1;
      setUndoCount(count);
      if (count <= 0) clearInterval(undoTimerRef.current);
    }, 1000);
    return () => clearInterval(undoTimerRef.current);
  }, [mode]);

  // Conversation history — use item.chatHistory if provided, otherwise generate default
  const chatHistory = item.chatHistory || [
    ...(item.source === 'DM' ? [{ from: 'them', text: 'Hey!', time: '2h ago' }] : []),
    { from: 'them', text: item.msg, time: item.time || '2h ago' },
  ];

  const sheetActive = (
    (mode === 'suggest' && !!item.draft) ||
    mode === 'ask' || mode === 'summary' || mode === 'undo' || mode === 'feedback' ||
    (!!agentHelpPhase && agentHelpPhase !== 'bubble' && mode === 'custom')
  );

  return (
    <div className={isDismissing ? 'screen-slide-out' : 'screen-slide-in'} onClick={(e) => e.stopPropagation()}
      style={{ position:'absolute', inset:0, zIndex:100,
        display:'flex', flexDirection:'column',
        background: T.paper,
        overflow:'hidden',
      }}>

    {/* ═══ CHAT CARD — flex:1 ═══ */}
    <div style={{
      flex:1, minHeight:0,
      background:T.paper,
      display:'flex', flexDirection:'column',
      overflow:'hidden',
    }}>
      {/* Header */}
      <div style={{ padding:'48px 16px 10px', borderBottom:'1px solid #D6D6D6', flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <div onClick={(e) => { e.stopPropagation(); onClose(); }} style={{ cursor:'pointer', padding:'8px', margin:'-8px' }}>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </div>
          {item.avatar && <img src={item.avatar} alt="" style={{ width:32, height:32, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)', flexShrink:0 }} />}
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ fontSize:14, fontWeight:500, color:'#292929', lineHeight:'20px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</div>
            <div onClick={(e) => { e.stopPropagation(); setReasoningSheet({ title: 'Why ' + (item.intent || 'this classification'), body: item.context || 'No additional context available.', intent: item.intent }); }}
              style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px', display:'flex', alignItems:'center', gap:4, cursor:'pointer' }}>
              <span>{item.intent || 'DM'}</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
        </div>
        {/* Expandable contact bio — only when data present */}
        {item.contactBio && (
          <div onClick={(e) => { e.stopPropagation(); setBioExpanded(b => !b); }}
            style={{ marginTop:8, cursor:'pointer', paddingLeft:44 }}>
            {!bioExpanded ? (
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <span style={{ fontSize:11, fontWeight:400, color:'#ABABAB', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', flex:1 }}>{item.contactBio}</span>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#ABABAB" strokeWidth="2" style={{ flexShrink:0 }}><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            ) : (
              <div>
                <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:500, color:'#707070' }}>About Laura</span>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" style={{ flexShrink:0, transform:'rotate(180deg)' }}><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div style={{ fontSize:11, fontWeight:400, color:'#707070', lineHeight:'16px' }}>{item.contactBioExpanded}</div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Chat body */}
      <div ref={chatBodyRef} style={{ flex:1, minHeight:0, overflowY:'auto', padding:'12px 16px 12px', display:'flex', flexDirection:'column', gap:12 }}>

        {/* Timeline renderer (rich history) or legacy flat chatHistory */}
        {item.timeline ? renderTimeline(item.timeline, sentMsgs) : (
          <>
            <div style={{ textAlign:'center' }}>
              <span style={{ fontSize:12, color:'#707070', lineHeight:'16px' }}>Today {item.time || '8:10 AM'}</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {chatHistory.map((m, i) => renderDMBubble(m, i, chatHistory))}
            </div>
          </>
        )}

        {/* Summary removed from chat body — agent explains in bottom sheet */}

        {/* Inline draft (fallback mode — draft shown in chat body) */}
        {mode === 'inline' && item.draft && (
          <div className="fade-up" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11, color:T.gray, marginBottom:4, fontWeight:500 }}>Inbox Agent</div>
            <div style={{ display:'flex', justifyContent:'flex-end' }}>
              <div style={{ maxWidth:'85%' }}>
                <div style={{ padding:'13px 16px', borderRadius:18, borderTopRightRadius:6, border:`1.5px dashed ${T.lightGray}`, background:T.warmGray }}>
                  <div style={{ fontSize:14, lineHeight:1.5, color:T.ink, letterSpacing:'-0.01em' }}>{item.draft}</div>
                </div>
                <div style={{ display:'flex', gap:6, marginTop:8 }}>
                  <button onClick={handleSend} style={{ padding:'7px 16px', background:'#2952CC', color:'#fff', border:'none', borderRadius:20, fontSize:12, fontWeight:600, cursor:'pointer' }}>Send</button>
                  <button onClick={() => { setMode('editing'); setEditVal(item.draft); }} style={{ padding:'7px 14px', background:'transparent', border:`1px solid ${T.lightGray}`, borderRadius:20, fontSize:12, fontWeight:500, cursor:'pointer', color:T.ink }}>Edit</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Sent messages — grouped with Airbnb corners, avatar only on last */}
        {sentMsgs.map((msg, i) => {
          const isLast = i === sentMsgs.length - 1;
          const radius = isLast ? '12px 12px 2px 12px' : '12px';
          return (
            <div key={i} className={isLast ? 'fade-up' : ''} style={{ display:'flex', gap:4, alignItems:'flex-end', justifyContent:'flex-end', paddingLeft:50 }}>
              <div style={{ maxWidth:288, padding:'12px 16px', borderRadius:radius, background:'#C2DBFF', opacity:0.89 }}>
                <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>{msg}</div>
              </div>
              {isLast ? (
                <img src={CREATOR_AVATAR} alt="" style={{ width:20, height:20, borderRadius:400, objectFit:'cover', flexShrink:0, border:'0.5px solid rgba(44,50,58,0.12)' }} />
              ) : (
                <div style={{ width:20, flexShrink:0 }} />
              )}
            </div>
          );
        })}

        {/* Edit feedback moved to bottom section */}
      </div>

    </div>{/* ─── end chat card ─── */}

    {/* ═══ AGENT CARDS — below the chat, above input ═══ */}

    {/* Suggest mode */}
    {mode === 'suggest' && item.draft && <AgentSheet item={item} onSend={handleSend} onEdit={() => { setMode('editing'); setEditVal(item.draft); setFeedbackEligible(true); }} onSkip={handleIllReply} onWhy={() => setReasoningSheet({ title:'Reply reasoning', body: item.styleReason || item.context || '' })} />}

    {/* Snackbar layer — in flow above input: agent on top, system at bottom */}
    {(showToast || (mode === 'sent' && undoCount > 0 && sentFromAgent)) && (
      <div style={{ flexShrink:0, display:'flex', flexDirection:'column' }}>
        {showToast && <AgentSnackbar message={toastMsg} />}
        {mode === 'sent' && undoCount > 0 && sentFromAgent && <SystemSnackbar message={lastSentCount > 1 ? 'Replies sent' : 'Reply sent'} onUndo={handleUndo} />}
      </div>
    )}

    {/* ═══ Message Input — hidden during suggest mode, slides up when agent card dismissed ═══ */}
    {mode !== 'suggest' && (
      <div style={{ margin:'0 16px 32px', flexShrink:0, animation:'toastUp .4s cubic-bezier(.25,.46,.45,.94) both' }}>
        {/* Follow-up question — shows after user edits/dismisses/types instead of sending directly */}
        {/* Edit feedback — same style as follow-up card */}
        {editFeedback === 'asking' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>I noticed you changed my reply a lot. Was it off?</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {['Not my tone', 'Wrong info', 'I just wanted to personalize'].map(reason => (
                <button key={reason} onClick={() => {
                  setEditFeedback('done');
                  triggerToast(reason === 'I just wanted to personalize'
                    ? 'Got it, draft was fine, you wanted your touch.'
                    : 'Got it, ' + reason.toLowerCase() + '. I\'ll adjust.');
                }}
                  style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>{reason}</button>
              ))}
            </div>
          </div>
        )}

        {/* Follow-up feedback — after user ignored/dismissed the agent draft */}
        {mode === 'custom' && customFeedback === 'asking' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>Was my reply helpful as a starting point?</div>
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={() => { setCustomFeedback('done'); triggerToast('Got it, glad it helped.'); }}
                style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>Yes</button>
              <button onClick={() => setCustomFeedback('why')}
                style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>No</button>
            </div>
          </div>
        )}

        {/* Why feedback — shown after user taps No */}
        {mode === 'custom' && customFeedback === 'why' && (
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, marginBottom:8, display:'flex', flexDirection:'column', gap:16, animation:'slideInRight .4s cubic-bezier(.25,.46,.45,.94) both' }}>
            <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px' }}>What wasn't right?</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
              {['Tone was off', 'Wrong info', 'Too long', 'I wrote my own'].map(reason => (
                <button key={reason} onClick={() => { setCustomFeedback('done'); triggerToast('Got it, I\'ll do better next time.'); }}
                  style={{ padding:'8px 16px', border:'none', borderRadius:12, background:'#F0F0F0', fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer', letterSpacing:'-0.104px', lineHeight:'18px' }}>
                  {reason}
                </button>
              ))}
            </div>
          </div>
        )}

        {/* The actual input field */}
        <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:8, display:'flex', flexDirection:'column', gap: mode === 'editing' ? 8 : 0 }}>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <div style={{ width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:12, flexShrink:0 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            </div>
            {mode === 'editing' ? (
              <textarea value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus
                ref={el => { if (el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; } }}
                style={{ flex:1, fontSize:16, color:'#292929', lineHeight:'24px', border:'none', outline:'none', resize:'none', minHeight:24, maxHeight:200, fontFamily:'Inter, system-ui, sans-serif', background:'transparent', overflow:'auto' }} />
            ) : (
              <input ref={customInputRef} value={customVal} onChange={e => setCustomVal(e.target.value)}
                placeholder="Reply..."
                onKeyDown={e => { if (e.key === 'Enter' && customVal.trim()) handleSendCustom(); }}
                style={{ flex:1, fontSize:16, color: customVal ? '#292929' : '#878787', lineHeight:'24px', border:'none', outline:'none', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
            )}
            {(mode === 'editing' ? editVal.trim() : customVal.trim()) ? (
              <div onClick={mode === 'editing' ? handleSend : handleSendCustom}
                style={{ width:36, height:36, borderRadius:20, background:'#006BE2', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </div>
            ) : (
              <div style={{ width:36, height:36, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:12, flexShrink:0 }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </div>
            )}
          </div>
          {/* Tone pills — only in edit mode */}
          {mode === 'editing' && (
            <div style={{ display:'flex', gap:4, paddingLeft:44 }}>
              {['Friendly','Formal','Shorter','Direct'].map(tone => (
                <div key={tone} onClick={() => {
                  setActiveTone(tone);
                  const base = originalDraft;
                  if (tone === 'Shorter') setEditVal(base.split(/(?<=[.!?])\s+/).slice(0,2).join(' '));
                  else if (tone === 'Friendly') setEditVal('Hey! ' + base.charAt(0).toLowerCase() + base.slice(1));
                  else if (tone === 'Formal') setEditVal('Thank you for reaching out. ' + base.replace(/!/g, '.'));
                  else if (tone === 'Direct') setEditVal(base.split(/(?<=[.!?])\s+/).filter(s => s.length > 20).join(' '));
                }}
                  style={{ background: activeTone === tone ? '#292929' : '#F5F5F5', borderRadius:8, padding:'8px 12px', cursor:'pointer' }}>
                  <span style={{ fontSize:12, fontWeight:500, color: activeTone === tone ? '#fff' : '#292929', lineHeight:'16px' }}>{tone}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    )}

    {/* Message input removed from suggest mode — only appears after agent card is dismissed */}

    {/* Reasoning Bottom Sheet */}
    {reasoningSheet && (
      <ReasoningSheet
        title={reasoningSheet.title}
        body={reasoningSheet.body}
        onClose={() => setReasoningSheet(null)}
        showSources={!reasoningSheet.intent}
        showFeedback={true}
        intent={reasoningSheet.intent}
        onNotInterested={() => {
          setReasoningSheet(null);
          if (onDismissItem) onDismissItem();
          onClose();
        }}
      />
    )}


  </div>
  );
}

/* ─── Chevron icon ─── */
function ChevronIcon({ collapsed }) {
  return (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
      style={{ transition:'transform .25s ease', transform: collapsed ? 'rotate(-90deg)' : 'rotate(0deg)' }}>
      <polyline points="6 9 12 15 18 9" />
    </svg>
  );
}

/* ─── Intention group header ─── */
function IntentionIcon({ type }) {
  if (type === 'fire') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M12 2c0 0-4 4.5-4 9a4 4 0 0 0 8 0c0-2.5-1.5-4.5-2-5.5C13.5 7.5 13 9 12 9c-1 0-1.5-1-1-3z"/>
      <path d="M9 17c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2"/>
    </svg>
  );
  if (type === 'star') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </svg>
  );
  if (type === 'urgent') return (
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={T.ink} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ opacity:0.55 }}>
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  );
  return null;
}

function IntentionHeader({ label, icon, collapsed, onToggle }) {
  const [stuck, setStuck] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const obs = new IntersectionObserver(([e]) => setStuck(e.intersectionRatio < 1), { threshold:[1], rootMargin:'-1px 0px 0px 0px' });
    obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return (
    <div ref={ref} onClick={onToggle} style={{ padding:'16px 0 8px', display:'flex', alignItems:'center', justifyContent:'space-between', cursor:'pointer', position:'sticky', top:-1, background:'#fff', zIndex:5, borderBottom: stuck ? '1px solid #E0E0E0' : '1px solid transparent', transition:'border-color .15s ease' }}>
      <span style={{ fontSize:17, fontWeight:700, color:'#292929', lineHeight:'26px', letterSpacing:'-0.306px' }}>{label}</span>
      <ChevronIcon collapsed={collapsed} />
    </div>
  );
}

/* ─── Important Tab ─── */
function ImportantTab({ onOpenChat, answeredChats, hiddenItems = new Set(), viewedChats = [], priorityFeedbackDone, onFeedbackGood, onFeedbackBad, headerHidden, onShowReasoning }) {
  const [collapsedGroups, setCollapsedGroups] = useState(new Set());
  const [showInfoModal, setShowInfoModal] = useState(false);
  const [showHistory, setShowHistory] = useState(false);

  const totalPending = IMPORTANT_GROUPS.reduce((sum, g) => sum + g.items.filter(item => !answeredChats.has(item.user)).length, 0);

  const toggleGroup = (gi) => {
    setCollapsedGroups(prev => {
      const next = new Set(prev);
      next.has(gi) ? next.delete(gi) : next.add(gi);
      return next;
    });
  };

  return (
    <div style={{ position:'relative' }}>
      {/* Header — Inbox title, hides on scroll */}
      <div style={{ padding:'8px 0', position:'relative', maxHeight: headerHidden ? 0 : 60, opacity: headerHidden ? 0 : 1, overflow:'hidden', transition:'max-height .25s ease, opacity .2s ease' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontSize:28, fontWeight:700, color:'#292929', lineHeight:'38px', letterSpacing:'-0.392px' }}>Inbox</span>
          {/* History button — only shows after user has opened at least one chat */}
          {viewedChats.length > 0 && (
            <div onClick={() => setShowHistory(h => !h)} style={{ width:32, height:32, display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', borderRadius:8 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.gray} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
            </div>
          )}
        </div>
      </div>

      {/* History popover — outside header to avoid overflow:hidden clipping */}
      {showHistory && viewedChats.length > 0 && (
        <>
          <div onClick={() => setShowHistory(false)} style={{ position:'fixed', inset:0, zIndex:150 }} />
          <div className="fade-in" style={{ position:'absolute', top:56, right:0, zIndex:151, background:'#fff', borderRadius:16, boxShadow:'0 4px 24px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.06)', minWidth:260, maxWidth:300, overflow:'hidden' }}>
            <div style={{ padding:'14px 16px 8px', fontSize:13, fontWeight:500, color:T.gray }}>History</div>
            <div style={{ paddingBottom:8 }}>
              {viewedChats.map((item) => (
                <div key={item.user} onClick={() => { onOpenChat(item, '', T.gray, !!item._sensitive); setShowHistory(false); }}
                  style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 16px', cursor:'pointer' }}>
                  <img src={item.avatar} alt="" style={{ width:32, height:32, borderRadius:16, objectFit:'cover', flexShrink:0 }} />
                  <span style={{ flex:1, fontSize:14, fontWeight:500, color:T.ink, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.name || item.user}</span>
                  {answeredChats.has(item.user) && (
                    <span style={{ fontSize:11, fontWeight:500, color:'#2952CC', background:'rgba(41,82,204,0.08)', padding:'2px 7px', borderRadius:6, flexShrink:0 }}>Replied</span>
                  )}
                </div>
              ))}
            </div>
          </div>
        </>
      )}

      {/* Info sheet — prioritization + filtered messages */}
      {showInfoModal && (() => {
        const filteredGroup = IMPORTANT_GROUPS.find(g => g.icon === 'urgent');
        return (
          <div style={{ position:'absolute', inset:0, zIndex:200 }}>
            <div onClick={() => setShowInfoModal(false)} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.5)' }} />
            <div className="sheet-up" style={{ position:'absolute', bottom:0, left:0, right:0, background:'#151515', borderRadius:'24px 24px 0 0', padding:'16px 0 52px', display:'flex', flexDirection:'column', maxHeight:'82%' }}>
              <div style={{ width:36, height:4, background:'rgba(255,255,255,0.14)', borderRadius:2, margin:'0 auto 20px', flexShrink:0 }} />
              <div style={{ overflowY:'auto', flex:1, padding:'0 24px' }}>

                {/* How I prioritize */}
                <div style={{ fontSize:16, fontWeight:400, color:'#fff', lineHeight:1.6, marginBottom:18 }}>
                  I read every conversation and decide what actually needs you. Here's how:
                </div>
                <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:28 }}>
                  {[
                    'People interested in your products or services',
                    'True fans engaging meaningfully with your content',
                    'Urgent matters that need your attention',
                    'Questions only you can answer',
                  ].map((item, i) => (
                    <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:12 }}>
                      <div style={{ width:4, height:4, borderRadius:2, background:'rgba(255,255,255,0.25)', flexShrink:0, marginTop:9 }} />
                      <span style={{ fontSize:15, color:'rgba(255,255,255,0.75)', lineHeight:1.55 }}>{item}</span>
                    </div>
                  ))}
                </div>

                {/* Divider + Filtered section */}
                {filteredGroup && filteredGroup.items.length > 0 && (
                  <>
                    <div style={{ height:1, background:'rgba(255,255,255,0.08)', marginBottom:24 }} />
                    <div style={{ fontSize:13, fontWeight:600, color:'rgba(255,255,255,0.35)', letterSpacing:'0.06em', textTransform:'uppercase', marginBottom:16 }}>
                      {filteredGroup.items.length} filtered out
                    </div>
                    {filteredGroup.items.map((item, i) => (
                      <div key={item.user} style={{ paddingBottom:20, marginBottom:20, borderBottom: i < filteredGroup.items.length - 1 ? '1px solid rgba(255,255,255,0.08)' : 'none' }}>
                        <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:8 }}>
                          <img src={item.avatar} alt="" style={{ width:36, height:36, borderRadius:18, objectFit:'cover', flexShrink:0 }} />
                          <div style={{ flex:1, minWidth:0 }}>
                            <div style={{ fontSize:14, fontWeight:600, color:'#fff', letterSpacing:'-0.01em' }}>{item.user}</div>
                            <div style={{ fontSize:13, color:'rgba(255,255,255,0.35)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.msg}</div>
                          </div>
                          <div style={{ fontSize:11, fontWeight:500, color:'rgba(255,255,255,0.3)', background:'rgba(255,255,255,0.06)', padding:'3px 8px', borderRadius:6, flexShrink:0 }}>{item.status}</div>
                        </div>
                        <div style={{ fontSize:13, color:'rgba(255,255,255,0.45)', lineHeight:1.55, paddingLeft:46 }}>{item.context}</div>
                      </div>
                    ))}
                  </>
                )}

                {/* Feedback */}
                <div style={{ height:1, background:'rgba(255,255,255,0.08)', marginBottom:20 }} />
                <div style={{ fontSize:15, color:'#fff', fontWeight:500, marginBottom:14 }}>Is this working for you?</div>
                <div style={{ display:'flex', flexDirection:'column', gap:10, paddingBottom:8 }}>
                  <button onClick={() => { onFeedbackGood(); setShowInfoModal(false); }}
                    style={{ width:'100%', padding:'14px 0', background:'#fff', color:'#151515', border:'none', borderRadius:12, fontSize:15, fontWeight:600, cursor:'pointer', letterSpacing:'-0.01em' }}>
                    Looks right to me
                  </button>
                  <button onClick={() => { onFeedbackBad(); setShowInfoModal(false); }}
                    style={{ width:'100%', padding:'14px 0', background:'rgba(255,255,255,0.08)', color:'rgba(255,255,255,0.6)', border:'none', borderRadius:12, fontSize:15, fontWeight:500, cursor:'pointer', letterSpacing:'-0.01em' }}>
                    Something feels off
                  </button>
                </div>

              </div>
            </div>
          </div>
        );
      })()}

      {/* Empty state — all important DMs answered */}
      {totalPending === 0 && (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'80px 32px 40px', textAlign:'center' }}>
          <div style={{ fontSize:64, marginBottom:16 }}>☕</div>
          <div style={{ fontSize:20, fontWeight:700, color:T.ink, letterSpacing:'-0.02em', marginBottom:6 }}>Time to grab a coffee</div>
          <div style={{ fontSize:14, color:T.gray, lineHeight:1.5 }}>I'll let you know when something that needs your attention comes in</div>
        </div>
      )}

      {/* Active groups — skip filtered group, render normally for the rest */}
      {IMPORTANT_GROUPS.filter(g => g.icon !== 'urgent').map((group, gi) => {
        const pending = group.items.filter(item => !answeredChats.has(item.user) && !hiddenItems.has(item.user));
        if (pending.length === 0) return null;
        const isCollapsed = collapsedGroups.has(gi);

        return (
          <div key={gi}>
            <IntentionHeader label={group.intention} icon={group.icon} collapsed={isCollapsed} onToggle={() => toggleGroup(gi)} />
            {!isCollapsed && pending.map((item, i) => (
              <MsgRow key={item.user} user={item.user} name={item.name} avatar={item.avatar} time={item.time}
                isAsk={item.mode === 'ask'}
                isLast={i === pending.length - 1}
                msg={item.msg}
                status={item.status}
                onClick={() => onOpenChat(item, '', T.gray, !!item._sensitive)} />
            ))}
          </div>
        );
      })}

      {priorityFeedbackDone && (
        <div className="fade-in" style={{ padding:'20px 0 16px', textAlign:'center' }}>
          <span style={{ fontSize:12, color:T.gray }}>Thanks. I'll keep adjusting as we work together.</span>
        </div>
      )}

      {/* Reasoning row — Claude-style disclosure */}
      {(() => {
        const filteredGroup = IMPORTANT_GROUPS.find(g => g.icon === 'urgent');
        const count = filteredGroup ? filteredGroup.items.length : 0;
        return (
          <div onClick={() => onShowReasoning ? onShowReasoning() : setShowInfoModal(true)}
            style={{ display:'flex', alignItems:'center', gap:8, padding:'32px 16px', margin:'0 -16px', cursor:'pointer' }}>
            {/* SelectAll icon — 20px */}
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#707070" strokeWidth="1.5" strokeLinecap="round" style={{ flexShrink:0 }}>
              <circle cx="3" cy="4" r="1" fill="#707070" stroke="none"/><line x1="7" y1="4" x2="17" y2="4"/>
              <circle cx="3" cy="10" r="1" fill="#707070" stroke="none"/><line x1="7" y1="10" x2="17" y2="10"/>
              <circle cx="3" cy="16" r="1" fill="#707070" stroke="none"/><line x1="7" y1="16" x2="14" y2="16"/>
            </svg>
            <div style={{ flex:1, display:'flex', alignItems:'center', minWidth:0 }}>
              <span style={{ flex:1, fontSize:14, fontWeight:400, color:'#707070', lineHeight:'20px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                Prioritized. {count} DMs filtered out
              </span>
              {/* ChevronRight — 16px */}
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0 }}>
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          </div>
        );
      })()}

    </div>
  );
}

/* ─── Priorities Overlay (matches Figma design) ─── */
function PrioritiesOverlay({ onDismiss }) {
  const [selected, setSelected] = useState(['coaching', 'scheduling']);
  const [showToast, setShowToast] = useState(false);
  const priorities = [
    { id: 'coaching', label: 'People interested in coaching', desc: 'Leads asking about your services' },
    { id: 'comments', label: 'Comments on my posts', desc: 'Engage with your audience' },
    { id: 'collabs', label: 'Collaboration requests', desc: 'Brand deals and partnerships' },
    { id: 'scheduling', label: 'Scheduling and booking', desc: 'Session requests and reschedules' },
  ];

  const toggle = (id) => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  const handleSave = () => { setShowToast(true); setTimeout(() => onDismiss(), 1200); };

  return (
    <div className="fade-up" style={{ position:'absolute', inset:0, zIndex:160, background:T.paper, display:'flex', flexDirection:'column' }}>
      <div style={{ padding:'52px 20px 0', flexShrink:0 }}>
        <div onClick={onDismiss} style={{ cursor:'pointer', fontSize:20, color:T.ink, fontWeight:300, padding:'8px 12px', margin:'-8px -12px', display:'inline-block' }}>←</div>
      </div>

      <div style={{ flex:1, overflowY:'auto', padding:'20px 28px 0' }}>
        <div style={{ fontSize:11, color:T.gray, marginBottom:6, fontWeight:500 }}>Inbox Agent</div>
        <h1 style={{ fontSize:26, fontWeight:700, color:T.ink, lineHeight:1.15, marginBottom:10, letterSpacing:'-0.02em' }}>
          What matters most to you right now?
        </h1>
        <p style={{ fontSize:14, color:T.gray, marginBottom:28, lineHeight:1.5 }}>
          I'll focus on these first. You can change this anytime.
        </p>

        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {priorities.map((p) => {
            const on = selected.includes(p.id);
            return (
              <div key={p.id} onClick={() => toggle(p.id)}
                style={{ display:'flex', alignItems:'center', gap:14, padding:'18px', borderRadius:14,
                  border: on ? '1.5px solid #2952CC' : `1.5px solid ${T.lightGray}`,
                  background: on ? '#E8F0FE' : T.cardBg, cursor:'pointer', transition:'all .2s ease' }}>
                <div style={{ width:32, height:32, borderRadius:16,
                  border: on ? 'none' : `1.5px solid ${T.lightGray}`,
                  background: on ? '#2952CC' : 'transparent',
                  display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all .2s ease' }}>
                  {on && <span style={{ color:'#fff', fontSize:14 }}>✓</span>}
                </div>
                <div>
                  <div style={{ fontSize:15, fontWeight:600, color:T.ink, letterSpacing:'-0.01em' }}>{p.label}</div>
                  <div style={{ fontSize:12, color:T.gray, marginTop:1 }}>{p.desc}</div>
                </div>
              </div>
            );
          })}

          {/* Something else */}
          <div style={{ display:'flex', alignItems:'center', gap:14, padding:'18px', borderRadius:14,
            border:`1.5px dashed ${T.lightGray}`, cursor:'pointer' }}>
            <div style={{ width:32, height:32, borderRadius:16, border:`1.5px solid ${T.lightGray}`,
              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
              <span style={{ fontSize:16, color:T.gray, fontWeight:300 }}>+</span>
            </div>
            <span style={{ fontSize:15, color:T.gray, letterSpacing:'-0.01em' }}>Something else...</span>
          </div>
        </div>
      </div>

      {showToast && (
        <div className="fade-up" style={{ position:'absolute', top:60, left:'50%', transform:'translateX(-50%)', background:T.ink, color:'#fff', padding:'10px 24px', borderRadius:6, fontSize:13, fontWeight:500, zIndex:170, whiteSpace:'nowrap' }}>
          Updating your priorities...
        </div>
      )}

      <div style={{ padding:'16px 28px 50px' }}>
        <BlackBtn label="Save" onClick={handleSave} disabled={selected.length === 0} />
      </div>
    </div>
  );
}

/* ═══ ASPIRATIONAL COMPONENTS ═══ */

function CirclePill({ icon, count, label, subLabel, color, onTap, active }) {
  const bg = active ? '#292929' : '#fff';
  const textColor = active ? '#fff' : '#292929';
  const labelColor = active ? 'rgba(255,255,255,0.7)' : '#707070';
  return (
    <div onClick={onTap} style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:6, cursor:'pointer', flexShrink:0 }}>
      <div style={{ width:68, background:bg, border:'1px solid #D6D6D6', borderRadius:16, padding:'12px 8px 10px', display:'flex', flexDirection:'column', alignItems:'center', gap:3, boxShadow:'0 2px 8px rgba(0,0,0,0.06)', transition:'all .15s ease' }}>
        <div style={{ color: active ? '#fff' : (color || '#292929'), lineHeight:0, height:16, display:'flex', alignItems:'center', justifyContent:'center' }}>{icon}</div>
        <div style={{ fontSize:20, fontWeight:700, color:textColor, lineHeight:1.1, minHeight:22 }}>{count !== null && count !== undefined ? count : ''}</div>
      </div>
      <div style={{ fontSize:10, fontWeight:500, color:'#707070', textAlign:'center', lineHeight:1.2, maxWidth:72 }}>{subLabel || label}</div>
    </div>
  );
}

function OptimizationCard({ onInfo }) {
  const pct = STATS.score;
  return (
    <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:16, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, margin:'0 16px 12px' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
        <span style={{ fontSize:12, fontWeight:500, color:'#707070' }}>Inbox score</span>
        <div onClick={onInfo} style={{ cursor:'pointer', color:'#707070', fontSize:15, width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:10, background:'#F5F5F5' }}>ⓘ</div>
      </div>
      <div style={{ display:'flex', alignItems:'baseline', gap:6, marginBottom:10 }}>
        <span style={{ fontSize:32, fontWeight:700, color:'#292929', lineHeight:1 }}>{pct}</span>
        <span style={{ fontSize:14, fontWeight:400, color:'#707070' }}>out of 100</span>
      </div>
      <div style={{ height:3, background:'#F0F0F0', borderRadius:100, marginBottom:12, overflow:'hidden' }}>
        <div style={{ width:`${pct}%`, height:'100%', background:'#292929', borderRadius:100 }} />
      </div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
        {[`${STATS.spamFiltered}% spam filtered`, `${STATS.repliesReady} drafts ready`, `${STATS.timeSaved} min saved today`].map(chip => (
          <div key={chip} style={{ background:'#F5F5F5', borderRadius:8, padding:'4px 10px', fontSize:12, fontWeight:500, color:'#292929' }}>{chip}</div>
        ))}
      </div>
    </div>
  );
}

function AgentOvernightCard({ onShowMore }) {
  return (
    <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:16, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:16, margin:'0 16px 16px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:8 }}>
        <div style={{ width:22, height:22, borderRadius:11, background:'#F5F5F5', display:'flex', alignItems:'center', justifyContent:'center' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 3l1.45 3.04L17 7.27l-2.5 2.43.59 3.43L12 11.23l-3.09 1.9.59-3.43L7 7.27l3.55-.23z"/>
            <path d="M5 12.5A7 7 0 0 0 12 19.5"/>
          </svg>
        </div>
        <span style={{ fontSize:11, fontWeight:500, color:'#707070', letterSpacing:'0.02em', textTransform:'uppercase' }}>Overnight</span>
      </div>
      <div style={{ fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px', marginBottom:10 }}>
        3 new leads came in overnight — including a warm follow-up from last week. One client can't access module 3, needs your reply.

      <span onClick={onShowMore} style={{ fontSize:12, fontWeight:500, color:'#2952CC', cursor:'pointer' }}>Show more →</span>
    </div>
  );
}

function MsgRowAsp({ item, onTap, inRepliesView, homeView }) {
  const [replyExpanded, setReplyExpanded] = React.useState(false);
  const hasDraft = !!item.draft;
  return (
    <div onClick={() => onTap(item)} style={{ display:'flex', alignItems:'flex-start', gap:12, padding:'12px 0', cursor:'pointer', borderBottom:'1px solid #F0F0F0' }}>
      <img src={item.avatar} alt="" style={{ width:48, height:48, borderRadius:400, objectFit:'cover', flexShrink:0, border:'0.5px solid rgba(44,50,58,0.1)', marginTop:2 }} />
      <div style={{ flex:1, minWidth:0 }}>
        {/* Name + time */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:2 }}>
          <span style={{ fontSize:14, fontWeight:500, color:'#292929' }}>{item.name}</span>
          <span style={{ fontSize:12, fontWeight:400, color:'#707070', flexShrink:0, marginLeft:8 }}>{item.time}</span>
        </div>
        {/* Home view: summary only. Other views: message + green square, then summary */}
        {homeView ? (
          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
            <span style={{ fontSize:13, fontWeight:400, color:'#707070', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.summary}</span>
            {hasDraft && <div style={{ width:8, height:8, borderRadius:2, background:'#1E7A3C', flexShrink:0 }} />}
          </div>
        ) : (
          <>
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:2 }}>
              <span style={{ fontSize:13, fontWeight:400, color:'#707070', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.msg}</span>
              {hasDraft && <div style={{ width:8, height:8, borderRadius:2, background:'#1E7A3C', flexShrink:0 }} />}
            </div>
            {item.summary && (
              <div style={{ fontSize:12, color:'#ABABAB', lineHeight:'16px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{item.summary}</div>
            )}
          </>
        )}
        {/* Replies view only: intent badge + expandable reply */}
        {inRepliesView && (
          <div style={{ marginTop:6 }}>
            <span style={{ background:'#F5F5F5', borderRadius:4, padding:'2px 8px', fontSize:10, fontWeight:500, color:'#707070' }}>{item.intent}</span>
            {hasDraft && (
              <div style={{ marginTop:6 }}>
                <div onClick={(e) => { e.stopPropagation(); setReplyExpanded(r => !r); }}
                  style={{ display:'flex', alignItems:'center', gap:4, cursor:'pointer' }}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1E7A3C" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"
                    style={{ transform: replyExpanded ? 'rotate(90deg)' : 'rotate(0deg)', transition:'transform .18s ease', flexShrink:0 }}>
                    <path d="M9 18l6-6-6-6"/>
                  </svg>
                  <span style={{ fontSize:12, fontWeight:600, color:'#1E7A3C', flexShrink:0 }}>Reply:</span>
                  {!replyExpanded && (
                    <span style={{ fontSize:12, fontWeight:400, color:'#ABABAB', flex:1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                      {item.draft}
                    </span>
                  )}
                </div>
                {replyExpanded && (
                  <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'17px', marginTop:4, paddingLeft:16 }}>
                    {item.draft}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function FeedSection({ title, count, items, onSeeAll, onOpenChat, answeredChats, hiddenItems }) {
  const visible = items.filter(it => !hiddenItems.has(it.user));
  if (visible.length === 0) return null;
  return (
    <div style={{ margin:'0 16px 20px' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:16, fontWeight:600, color:'#292929' }}>{title}</span>
          <span style={{ background:'#F5F5F5', borderRadius:20, padding:'2px 8px', fontSize:12, fontWeight:500, color:'#707070' }}>{count}</span>
        </div>
        <span onClick={onSeeAll} style={{ fontSize:13, fontWeight:500, color:'#2952CC', cursor:'pointer' }}>See all →</span>
      </div>

/* ═══ AGENT OVERLAY — Siri-like floating chat ═══ */
function AgentOverlay({ item, draft, onChangeDraft, onClose }) {
  const [msgs, setMsgs] = useState([
    { from:'agent', text:'Is there anything you want to know about this contact or want me to do?' }
  ]);
  const [input, setInput] = useState('');
  const [pendingAction, setPendingAction] = useState(null); // { newDraft, closeAfter, skipContact }
  const inputRef = useRef(null);
  const msgsEndRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) setTimeout(() => inputRef.current.focus(), 200);
  }, []);

  // Auto-scroll to latest message
  useEffect(() => {
    if (msgsEndRef.current) msgsEndRef.current.scrollIntoView({ behavior:'smooth' });
  }, [msgs.length]);

  // Generate proposal based on user query
  const getProposal = (q) => {
    const lower = q.toLowerCase();
    if (lower.match(/warm|friend/)) {
      const newDraft = '💛 ' + draft;
      return { thinking:'Adjusting the tone...', proposal:'How about this?\n\n"' + newDraft + '"', question:'Want me to update the reply?', newDraft, closeAfter:true };
    }
    if (lower.match(/short|concise|brief/)) {
      const newDraft = draft.split(/(?<=[.!?])\s+/).slice(0,2).join(' ');
      return { thinking:'Shortening it...', proposal:'Here\'s a shorter version:\n\n"' + newDraft + '"', question:'Should I use this instead?', newDraft, closeAfter:true };
    }
    if (lower.match(/spanish|español/)) {
      const newDraft = '[ES] ' + draft;
      return { thinking:'Translating...', proposal:'Here it is in Spanish:\n\n"' + newDraft + '"', question:'Want me to switch to this?', newDraft, closeAfter:true };
    }
    if (lower.match(/ignore|skip|don't show|remove|archive/)) {
      return { thinking:'Checking...', proposal:'I\'ll archive this contact and won\'t show them again.', question:'Confirm?', newDraft:'', closeAfter:true, skipContact:true };
    }
    if (lower.match(/book|link|calendly/)) {
      const newDraft = draft + ' → calendly.com/sofia';
      return { thinking:'Adding the link...', proposal:'I\'ll add your booking link at the end:\n\n"' + newDraft + '"', question:'Look good?', newDraft, closeAfter:true };
    }
    if (lower.match(/tell me|who is|about|more info|background/)) {
      const info = item.contactBioExpanded || item.context || 'This contact has been engaging with your content recently.';
      return { thinking:'Looking up...', proposal: info, question:null }; // Info only, no confirmation needed
    }
    if (lower.match(/why|reason|explain/)) {
      const info = item.styleReason || 'I based this reply on your usual tone and the context of their message.';
      return { thinking:'Let me explain...', proposal: info, question:null };
    }
    return { thinking:'Thinking...', proposal:'I\'ll keep that in mind for future replies.', question:null };
  };

  const send = () => {
    if (!input.trim()) return;
    const userMsg = input.trim();
    setInput('');

    // Add user message
    setMsgs(prev => [...prev, { from:'user', text:userMsg }]);

    // Add thinking
    setTimeout(() => {
      setMsgs(prev => [...prev, { from:'thinking' }]);
    }, 200);

    // Replace thinking with proposal
    const proposal = getProposal(userMsg);
    setTimeout(() => {
      setMsgs(prev => {
        const withoutThinking = prev.filter(m => m.from !== 'thinking');
        const newMsgs = [...withoutThinking, { from:'agent', text:proposal.proposal }];
        if (proposal.question) {
          newMsgs.push({ from:'confirm', text:proposal.question });
          setPendingAction({ newDraft:proposal.newDraft, closeAfter:proposal.closeAfter, skipContact:proposal.skipContact });
        }
        return newMsgs;
      });
    }, 1200);
  };

  const handleConfirm = (yes) => {
    if (yes && pendingAction) {
      if (pendingAction.newDraft !== undefined) onChangeDraft(pendingAction.newDraft);
      setMsgs(prev => [...prev, { from:'user', text:'Yes' }, { from:'agent', text:'Done ✓' }]);
      setPendingAction(null);
      // Close overlay after a brief moment
      if (pendingAction.closeAfter) setTimeout(onClose, 800);
    } else {
      setMsgs(prev => [...prev, { from:'user', text:'No' }, { from:'agent', text:'Okay, what would you prefer?' }]);
      setPendingAction(null);
    }
  };

  return (
    <div className="fade-in" style={{ position:'absolute', inset:0, zIndex:60, background:'rgba(0,0,0,0.55)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)', display:'flex', flexDirection:'column' }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>

      {/* Done button — top right */}
      <div style={{ display:'flex', justifyContent:'flex-end', padding:'56px 20px 0', flexShrink:0 }}>
        <div onClick={onClose} style={{ fontSize:14, fontWeight:500, color:'rgba(255,255,255,0.7)', cursor:'pointer', padding:'8px 4px' }}>Done</div>
      </div>

      {/* Spacer to push chat to bottom */}
      <div style={{ flex:1 }} />

      {/* Messages */}
      <div style={{ padding:'0 20px 12px', display:'flex', flexDirection:'column', gap:8, maxHeight:'60%', overflowY:'auto' }}>
        {msgs.map((m, i) => {
          // Thinking indicator
          if (m.from === 'thinking') {
            return (
              <div key={i} className="siri-bubble" style={{ display:'flex', justifyContent:'flex-start' }}>
                <div style={{ fontSize:14, color:'rgba(255,255,255,0.5)', animation:'pulse 1.2s ease infinite' }}>Thinking...</div>
              </div>
            );
          }
          // Confirm buttons
          if (m.from === 'confirm') {
            return (
              <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', flexDirection:'column', gap:8 }}>
                <div style={{ fontSize:14, lineHeight:1.5, color:'#FFFFFF', background:'rgba(255,255,255,0.16)', border:'1px solid rgba(255,255,255,0.22)', padding:'10px 14px', borderRadius:'18px 18px 18px 4px', backdropFilter:'blur(10px)', display:'inline-block' }}>
                  {m.text}
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <button onClick={() => handleConfirm(true)}
                    style={{ padding:'8px 20px', background:'#FFFFFF', border:'none', borderRadius:100, fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer' }}>Yes</button>
                  <button onClick={() => handleConfirm(false)}
                    style={{ padding:'8px 20px', background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.3)', borderRadius:100, fontSize:13, fontWeight:500, color:'#FFFFFF', cursor:'pointer', backdropFilter:'blur(10px)' }}>No</button>
                </div>
              </div>
            );
          }
          // Regular messages
          return (
            <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
              <div style={{
                maxWidth:'82%', fontSize:14, lineHeight:1.5,
                background: m.from === 'user' ? '#FFFFFF' : 'rgba(255,255,255,0.16)',
                color: m.from === 'user' ? '#292929' : '#FFFFFF',
                border: m.from === 'user' ? 'none' : '1px solid rgba(255,255,255,0.22)',
                padding:'10px 14px',
                borderRadius: m.from === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                backdropFilter: m.from === 'user' ? 'none' : 'blur(10px)',
                whiteSpace:'pre-line',
              }}>{m.text}</div>
            </div>
          );
        })}
        <div ref={msgsEndRef} />
      </div>

      {/* Input row */}
      <div style={{ padding:'0 20px 24px', display:'flex', gap:8, alignItems:'center' }} onClick={e => e.stopPropagation()}>
        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          placeholder="Talk to the agent..."
          style={{ flex:1, background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.25)', borderRadius:100, padding:'12px 16px', fontSize:13.5, color:'#FFF', outline:'none', backdropFilter:'blur(10px)', fontFamily:'Inter, system-ui, sans-serif' }} />
        <button onClick={send} style={{ width:38, height:38, borderRadius:'50%', background:'#FFF', border:'none', color:'#292929', fontSize:16, fontWeight:600, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>\u2191</button>
      </div>
    </div>
  );
}

/* ═══ FOCUS MODE (Tinder-like card swiper) ═══ */

function FocusMode({ title, items, onClose, onSent }) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [sentSet, setSentSet] = useState(new Set());
  const [showToast, setShowToast] = useState(false);
  const [toastUser, setToastUser] = useState('');
  const [expandedSummary, setExpandedSummary] = useState(false);
  const [replyMode, setReplyMode] = useState(false);
  const [replyVal, setReplyVal] = useState('');
  const [agentOverlayOpen, setAgentOverlayOpen] = useState(false);
  const [currentDraft, setCurrentDraft] = useState('');
  const [customSentMsg, setCustomSentMsg] = useState('');
  const replyInputRef = useRef(null);
  const [reasoningSheet, setReasoningSheet] = useState(null);
  const [slideDir, setSlideDir] = useState('none'); // 'left' | 'right' | 'none'
  const [animKey, setAnimKey] = useState(0);
  const touchStartX = useRef(0);
  const touchDeltaX = useRef(0);

  const item = items[currentIdx];
  if (!item) return null;

  // Split draft into 2 messages
  const splitDraft = (draft) => {
    if (!draft) return [];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };
  const draftParts = splitDraft(currentDraft || item.draft);
  const isSent = sentSet.has(item.user);

  const goNext = () => {
    if (currentIdx < items.length - 1) {
      setSlideDir('left');
      setAnimKey(k => k + 1);
      setExpandedSummary(false);
      setReplyMode(false);
      setReplyVal('');
      setCustomSentMsg('');
      setTimeout(() => setCurrentIdx(i => i + 1), 50);
    }
  };
  const goPrev = () => {
    if (currentIdx > 0) {
      setSlideDir('right');
      setAnimKey(k => k + 1);
      setTimeout(() => setCurrentIdx(i => i - 1), 50);
    }
  };

  const undoTimerRef = useRef(null);
  const prevIdxRef = useRef(0);

  const handleSend = () => {
    // Step 1: Drafts turn blue
    setSentSet(prev => new Set([...prev, item.user]));
    setToastUser(item.name || item.user);
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    // Step 2: Wait 1.2s for the blue transition to be visible, then slide to next
    setTimeout(() => {
      if (currentIdx < items.length - 1) {
        goNext();
      }
    }, 1200);
    // Step 3: Show toast after the slide
    setTimeout(() => {
      setShowToast(true);
      clearTimeout(undoTimerRef.current);
      undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
    }, 1500);
  };

  const handleUndo = () => {
    // Undo: remove from sent, go back to previous card
    const userToUndo = items[prevIdxRef.current]?.user;
    if (userToUndo) setSentSet(prev => { const n = new Set(prev); n.delete(userToUndo); return n; });
    setShowToast(false);
    clearTimeout(undoTimerRef.current);
    // Swipe back to previous card
    setSlideDir('right');
    setAnimKey(k => k + 1);
    setExpandedSummary(false);
    setTimeout(() => setCurrentIdx(prevIdxRef.current), 50);
  };

  const handleSendCustomReply = () => {
    if (!replyVal.trim()) return;
    setCustomSentMsg(replyVal);
    setReplyVal('');
    setToastUser(item.name || item.user);
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    // Wait for blue transition, then slide
    setTimeout(() => {
      if (currentIdx < items.length - 1) goNext();
    }, 1200);
    setTimeout(() => {
      setShowToast(true);
      clearTimeout(undoTimerRef.current);
      undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
    }, 1500);
  };

  // Auto-focus reply input when entering reply mode
  useEffect(() => {
    if (replyMode && replyInputRef.current) {
      setTimeout(() => replyInputRef.current?.focus(), 100);
    }
  }, [replyMode]);

  // Sync currentDraft when card changes
  useEffect(() => {
    setCurrentDraft(item.draft || '');
    setAgentOverlayOpen(false);
  }, [currentIdx]);

  // Touch swipe handlers
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchMove = (e) => { touchDeltaX.current = e.touches[0].clientX - touchStartX.current; };
  const onTouchEnd = () => {
    if (touchDeltaX.current < -60) goNext();
    else if (touchDeltaX.current > 60) goPrev();
    touchDeltaX.current = 0;
  };

  return (
    <div className="screen-slide-in" style={{ position:'absolute', inset:0, zIndex:100, background:'#fff', display:'flex', flexDirection:'column' }}>
      {/* Header */}
      <div style={{ padding:'52px 16px 12px', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
        <div onClick={onClose} style={{ cursor:'pointer', padding:8, margin:-8 }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div style={{ flex:1, textAlign:'center' }}>
          <div style={{ fontSize:16, fontWeight:600, color:'#292929', lineHeight:'20px' }}>{title}</div>
          <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px' }}>{currentIdx + 1} of {items.length}</div>
        </div>
        <div style={{ width:24 }} />
      </div>

      {/* Scrollable card area */}
      <div key={animKey} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ flex:1, overflowY:'auto', padding:'0 16px 16px',
          animation: slideDir === 'left' ? 'slideFromRight .3s ease both' : slideDir === 'right' ? 'slideFromLeft .3s ease both' : 'fadeIn .3s ease both'
        }}>

        {/* Agent summary — 14px, 1 line, tap to expand */}
        <div onClick={() => setExpandedSummary(!expandedSummary)}
          style={{ padding:'12px 0', fontSize:14, fontWeight:400, color:'#292929', lineHeight:'20px', cursor:'pointer',
            ...(!expandedSummary ? { overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' } : {}) }}>
          {item.context || 'This contact is waiting for your reply.'}
        </div>

        {/* Contact card */}
        <div style={{ border:'1px solid #D6D6D6', borderRadius:16, padding:20, display:'flex', flexDirection:'column', gap:16 }}>
          {/* Contact info */}
          <div style={{ display:'flex', alignItems:'center', gap:12 }}>
            <img src={item.avatar} alt="" style={{ width:44, height:44, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)' }} />
            <div>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <span style={{ fontSize:16, fontWeight:600, color:'#292929' }}>{item.name || item.user}</span>
                <span style={{ fontSize:14, color:'#292929' }}>★</span>
              </div>
              {item.intent && (
                <div style={{ display:'inline-block', background:'#F0F0F0', borderRadius:4, padding:'2px 8px', marginTop:4 }}>
                  <span style={{ fontSize:12, fontWeight:400, color:'#707070' }}>{item.intent === 'Opportunities' ? 'High value' : item.intent}</span>
                </div>
              )}
            </div>
          </div>

          {/* Last message */}
          <div style={{ background:'#F5F5F5', borderRadius:12, padding:'12px 16px' }}>
            <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>
              {item.chatHistory ? item.chatHistory[item.chatHistory.length - 1]?.text : item.msg}
            </div>
          </div>

          {/* Draft section — hidden in reply mode */}
          {!replyMode && !customSentMsg && (
            <>
              {/* Divider — reply ready */}
              {draftParts.length > 0 && (
                <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                  <div style={{ flex:1, height:1, background:'#E0E0E0' }} />
                  <span style={{ fontSize:12, fontWeight:400, color:'#707070', whiteSpace:'nowrap' }}>{draftParts.length}-message reply ready</span>
                  <div style={{ flex:1, height:1, background:'#E0E0E0' }} />
                </div>
              )}

              {/* Draft bubbles */}
              {draftParts.length > 0 && (
                <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end' }}>
                  {draftParts.map((part, pi) => (
                    <div key={pi} style={{
                      padding:12,
                      borderRadius: pi === draftParts.length - 1 ? '12px 12px 2px 12px' : '12px',
                      background: isSent ? '#C2DBFF' : '#fff',
                      border: isSent ? 'none' : '1.5px dashed #292929',
                      transition: 'all .4s ease',
                    }}>
                      <div style={{ fontSize:14, fontWeight:400, fontStyle: isSent ? 'normal' : 'italic', lineHeight:'20px', color:'#292929' }}>{part}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Why this reply */}
              {item.styleReason && !isSent && (
                <div onClick={() => setReasoningSheet({ title:'Why this reply', body: item.styleReason })}
                  style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:4, cursor:'pointer' }}>
                  <span style={{ fontSize:13, fontWeight:400, color:'#707070' }}>Why this reply</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              )}
            </>
          )}

          {/* Custom sent message — shown after user sends their own reply */}
          {customSentMsg && (
            <div className="fade-up" style={{ display:'flex', justifyContent:'flex-end', marginTop:8 }}>
              <div style={{ maxWidth:288, padding:'12px 16px', borderRadius:'12px 12px 2px 12px', background:'#C2DBFF', transition:'all .4s ease' }}>
                <div style={{ fontSize:14, fontWeight:400, lineHeight:'20px', color:'#292929' }}>{customSentMsg}</div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Bottom section — buttons or reply input */}
      {!replyMode ? (

              style={{ flex:1, fontSize:16, color:'#292929', lineHeight:'24px', border:'none', outline:'none', resize:'none', minHeight:24, maxHeight:120, fontFamily:'Inter, system-ui, sans-serif', background:'transparent' }}
              onInput={e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }} />

                style={{ width:36, height:36, borderRadius:20, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

    )}

    {/* Ask me about this DM — now integrated as tab above input */}

    {/* Agent Overlay */}
    {agentOverlayOpen && (
      <AgentOverlay
        item={item}
        draft={currentDraft || item.draft}
        onChangeDraft={(newDraft) => setCurrentDraft(newDraft)}
        onClose={() => setAgentOverlayOpen(false)}
      />
    )}

    {/* Reasoning Bottom Sheet */}
    {reasoningSheet && (
      <ReasoningSheet
        title={reasoningSheet.title}
        body={reasoningSheet.body}
        onClose={() => setReasoningSheet(null)}
        showSources={!reasoningSheet.intent}
        showFeedback={true}
        intent={reasoningSheet.intent}
        onNotInterested={() => {
          setReasoningSheet(null);
          if (onDismissItem) onDismissItem();
          onClose();
        }}
      />
    )}


  </div>
  );
}



/* ═══ AGENT OVERLAY — Siri-like floating chat ═══ */
function AgentOverlay({ item, draft, onChangeDraft, onClose }) {
  const [msgs, setMsgs] = useState([
    { from:'agent', text:'Is there anything you want to know about this contact or want me to do?' }
  ]);
  const [input, setInput] = useState('');
  const [pendingAction, setPendingAction] = useState(null); // { newDraft, closeAfter, skipContact }
  const inputRef = useRef(null);
  const msgsEndRef = useRef(null);

  useEffect(() => {
    if (inputRef.current) setTimeout(() => inputRef.current.focus(), 200);
  }, []);

  // Auto-scroll to latest message
  useEffect(() => {
    if (msgsEndRef.current) msgsEndRef.current.scrollIntoView({ behavior:'smooth' });
  }, [msgs.length]);

  // Generate proposal based on user query
  const getProposal = (q) => {
    const lower = q.toLowerCase();
    const contactName = item.name ? item.name.split(' ')[0] : 'this contact';

    // --- Info queries (no confirmation) ---
    if (lower.match(/tell me|who is|about|more info|background|bio/)) {
      const info = item.contactBioExpanded || item.context || (contactName + ' has been engaging with your content recently.');
      return { thinking: 'Looking up ' + contactName + '...', proposal: 'Here\'s what I know about ' + contactName + ':\n\n' + info, question: null };
    }

    if (lower.match(/why|reason|explain/)) {
      const info = item.styleReason || ('I based this reply on your usual tone and the context of ' + contactName + '\'s message.');
      return { thinking: 'Let me explain...', proposal: info, question: null };
    }

    if (lower.match(/history|previous|past|conversation/)) {
      const msgCount = (item.chatHistory ? item.chatHistory.length : 0);
      const timelineCount = (item.timeline ? item.timeline.length : 0);
      return { thinking: 'Checking history...', proposal: msgCount > 2 || timelineCount > 0
        ? (contactName + ' has ' + msgCount + ' messages in the current thread' + (timelineCount > 0 ? ' and a longer history with comments and past conversations' : '') + '. Tap their name to see the full thread.')
        : ('This is ' + contactName + '\'s first conversation with you. No previous history.'), question: null };
    }

    // --- Draft modifications (confirmation required) ---
    if (lower.match(/warm|friend|personal/)) {
      const newDraft = 'Hey ' + contactName + '! ' + draft;
      return { thinking: 'Making it warmer...', proposal: 'How about this?\n\n"' + newDraft + '"', question: 'Want me to update the reply?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/short|concise|brief/)) {
      const sentences = draft.split(/(?<=[.!?])\s+/);
      const newDraft = sentences.slice(0, 2).join(' ');
      return { thinking: 'Shortening it...', proposal: 'Here\'s a shorter version:\n\n"' + newDraft + '"', question: 'Should I use this instead?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/formal|professional/)) {
      const newDraft = draft.replace(/[^\w\s.,!?'"()\-:;]/g, '').replace(/^Hey |^Hi |^Hello /i, 'Dear ');
      return { thinking: 'Making it more professional...', proposal: 'Here\'s a more formal version:\n\n"' + newDraft + '"', question: 'Want me to use this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/longer|more detail|expand|elaborate/)) {
      const newDraft = draft + ' Let me know if you have any other questions \u2014 I\'m happy to help!';
      return { thinking: 'Expanding it...', proposal: 'Here\'s a more detailed version:\n\n"' + newDraft + '"', question: 'Should I update it?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/emoji|more personality|fun/)) {
      const emojis = ['\uD83D\uDE4C', '\uD83D\uDCAA', '\u2728', '\uD83C\uDF89', '\uD83D\uDC9B'];
      const picked = emojis[Math.floor(Math.random() * emojis.length)];
      const newDraft = picked + ' ' + draft;
      return { thinking: 'Adding personality...', proposal: 'How about this?\n\n"' + newDraft + '"', question: 'Want to use this version?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/no emoji|remove emoji|plain|clean/)) {
      const newDraft = draft.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}]/gu, '').replace(/\s{2,}/g, ' ').trim();
      return { thinking: 'Cleaning it up...', proposal: 'Here\'s a cleaner version:\n\n"' + newDraft + '"', question: 'Should I use this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/spanish|espanol|espa\u00f1ol/)) {
      const newDraft = '[Translated to Spanish] ' + draft;
      return { thinking: 'Switching to Spanish...', proposal: 'Here it is in Spanish:\n\n"' + newDraft + '"', question: 'Want me to switch?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/ignore|skip|don.t show|remove|archive/)) {
      return { thinking: 'Got it...', proposal: 'I\'ll archive ' + contactName + ' and won\'t show them again.', question: 'Confirm?', newDraft: '', closeAfter: true, skipContact: true };
    }

    if (lower.match(/book|link|calendly|schedule|call/)) {
      const newDraft = draft + '\n\nHere\'s my calendar to book a call: calendly.com/sofia';
      return { thinking: 'Adding the link...', proposal: 'I\'ll add your booking link at the end:\n\n"' + newDraft + '"', question: 'Look good?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/price|pricing|cost|how much/)) {
      const priceInfo = '\n\nPricing: 4-Week Kickstart is $197. 12-Week Reboot is $597 (or 3x $197/month).';
      const newDraft = draft + priceInfo;
      return { thinking: 'Adding pricing...', proposal: 'Added the pricing details:\n\n"' + newDraft + '"', question: 'Want me to include this?', newDraft: newDraft, closeAfter: true };
    }

    if (lower.match(/follow.?up|remind|later|tomorrow/)) {
      return { thinking: 'Setting a reminder...', proposal: 'I\'ll remind you to follow up with ' + contactName + ' tomorrow. Should I send the current draft now?', question: 'Send and set reminder?', newDraft: draft, closeAfter: true };
    }

    if (lower.match(/vip|special|discount|exclusive/)) {
      const newDraft = draft.replace(/\.$/, '') + ' \u2014 and since you\'re one of my most valued community members, I have something special for you.';
      return { thinking: 'Adding VIP touch...', proposal: 'Here\'s a version with VIP treatment:\n\n"' + newDraft + '"', question: 'Want me to use this?', newDraft: newDraft, closeAfter: true };
    }

    // --- Draft generation (for items without drafts) ---
    if (lower.match(/draft|write|compose|reply for me|suggest a reply/)) {
      if (!draft || draft.trim() === '') {
        const templates = {
          Support: 'Hey ' + contactName + ', I\'m so sorry about this. Let me look into it right now and I\'ll get back to you within the hour. Hang tight!',
          Opportunities: 'Hey ' + contactName + '! Thanks for reaching out \u2014 I\'d love to tell you more about the program. What\'s your main goal right now?',
          Fans: contactName + ', thank you so much for this message! It truly means a lot to me. Keep going \u2014 you\'re doing amazing!',
        };
        const generated = templates[item.intent] || ('Hey ' + contactName + ', thanks for reaching out! Let me get back to you on this.');
        return { thinking: 'Writing a reply to ' + contactName + '...', proposal: 'How about this?\n\n"' + generated + '"', question: 'Want me to use this as the draft?', newDraft: generated, closeAfter: true };
      }
      return { thinking: 'Checking...', proposal: 'There\'s already a draft ready:\n\n"' + draft + '"\n\nWant me to modify it?', question: null };
    }

    // --- Context-aware fallback ---
    const suggestions = [];
    if (draft) {
      suggestions.push('Make it shorter', 'Make it warmer', 'Add a booking link');
    } else {
      suggestions.push('Draft a reply for me', 'Skip this one');
    }
    suggestions.push('Tell me about ' + contactName);

    return {
      thinking: 'Hmm...',
      proposal: 'I\'m not sure what you mean. Here are some things I can do:\n\n' + suggestions.map(function(s) { return '\u2022 ' + s; }).join('\n'),
      question: null,
    };
  };

  const send = () => {
    if (!input.trim()) return;
    const userMsg = input.trim();
    setInput('');

    // Add user message
    setMsgs(prev => [...prev, { from:'user', text:userMsg }]);

    // Add thinking
    setTimeout(() => {
      setMsgs(prev => [...prev, { from:'thinking' }]);
    }, 200);

    // Replace thinking with proposal
    const proposal = getProposal(userMsg);
    setTimeout(() => {
      setMsgs(prev => {
        const withoutThinking = prev.filter(m => m.from !== 'thinking');
        const newMsgs = [...withoutThinking, { from:'agent', text:proposal.proposal }];
        if (proposal.question) {
          newMsgs.push({ from:'confirm', text:proposal.question });
          setPendingAction({ newDraft:proposal.newDraft, closeAfter:proposal.closeAfter, skipContact:proposal.skipContact });
        }
        return newMsgs;
      });
    }, 1200);
  };

  const handleConfirm = (yes) => {
    if (yes && pendingAction) {
      if (pendingAction.newDraft !== undefined) onChangeDraft(pendingAction.newDraft);
      setMsgs(prev => [...prev, { from:'user', text:'Yes' }, { from:'agent', text:'Done ✓' }]);
      setPendingAction(null);
      // Close overlay after a brief moment
      if (pendingAction.closeAfter) setTimeout(onClose, 800);
    } else {
      setMsgs(prev => [...prev, { from:'user', text:'No' }, { from:'agent', text:'Okay, what would you prefer?' }]);
      setPendingAction(null);
    }
  };

  return (
    <div className="fade-in" style={{ position:'absolute', inset:0, zIndex:150, background:'rgba(0,0,0,0.55)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)', display:'flex', flexDirection:'column' }}
      onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>

      {/* Done button — top right */}
      <div style={{ display:'flex', justifyContent:'flex-end', padding:'56px 20px 0', flexShrink:0 }}>
        <div onClick={onClose} style={{ fontSize:14, fontWeight:500, color:'rgba(255,255,255,0.7)', cursor:'pointer', padding:'8px 4px' }}>Done</div>
      </div>

      {/* Spacer to push chat to bottom */}
      <div style={{ flex:1 }} />

      {/* Messages */}
      <div style={{ padding:'0 20px 12px', display:'flex', flexDirection:'column', gap:8, maxHeight:'60%', overflowY:'auto' }}>
        {msgs.map((m, i) => {
          // Thinking indicator
          if (m.from === 'thinking') {
            return (
              <div key={i} className="siri-bubble" style={{ display:'flex', justifyContent:'flex-start' }}>
                <div style={{ fontSize:14, color:'rgba(255,255,255,0.5)', animation:'pulse 1.2s ease infinite' }}>Thinking...</div>
              </div>
            );
          }
          // Confirm buttons
          if (m.from === 'confirm') {
            return (
              <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', flexDirection:'column', gap:8 }}>
                <div style={{ fontSize:14, lineHeight:1.5, color:'#FFFFFF', background:'rgba(255,255,255,0.16)', border:'1px solid rgba(255,255,255,0.22)', padding:'10px 14px', borderRadius:'18px 18px 18px 4px', backdropFilter:'blur(10px)', display:'inline-block' }}>
                  {m.text}
                </div>
                <div style={{ display:'flex', gap:8 }}>
                  <button onClick={() => handleConfirm(true)}
                    style={{ padding:'8px 20px', background:'#FFFFFF', border:'none', borderRadius:100, fontSize:13, fontWeight:500, color:'#292929', cursor:'pointer' }}>Yes</button>
                  <button onClick={() => handleConfirm(false)}
                    style={{ padding:'8px 20px', background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.3)', borderRadius:100, fontSize:13, fontWeight:500, color:'#FFFFFF', cursor:'pointer', backdropFilter:'blur(10px)' }}>No</button>
                </div>
              </div>
            );
          }
          // Regular messages
          return (
            <div key={i} className="siri-bubble" style={{ animationDelay: i * 60 + 'ms', display:'flex', justifyContent: m.from === 'user' ? 'flex-end' : 'flex-start' }}>
              <div style={{
                maxWidth:'82%', fontSize:14, lineHeight:1.5,
                background: m.from === 'user' ? '#FFFFFF' : 'rgba(255,255,255,0.16)',
                color: m.from === 'user' ? '#292929' : '#FFFFFF',
                border: m.from === 'user' ? 'none' : '1px solid rgba(255,255,255,0.22)',
                padding:'10px 14px',
                borderRadius: m.from === 'user' ? '18px 18px 4px 18px' : '18px 18px 18px 4px',
                backdropFilter: m.from === 'user' ? 'none' : 'blur(10px)',
                whiteSpace:'pre-line',
              }}>{m.text}</div>
            </div>
          );
        })}
        <div ref={msgsEndRef} />
      </div>

      {/* Input row */}
      <div style={{ padding:'0 20px 24px', display:'flex', gap:8, alignItems:'center' }} onClick={e => e.stopPropagation()}>
        <input ref={inputRef} value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') send(); }}
          placeholder="Talk to the agent..."
          style={{ flex:1, background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.25)', borderRadius:100, padding:'12px 16px', fontSize:13.5, color:'#FFF', outline:'none', backdropFilter:'blur(10px)', fontFamily:'Inter, system-ui, sans-serif' }} />
        <button onClick={send} style={{ width:38, height:38, borderRadius:'50%', background:'#FFF', border:'none', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
    </div>
  );
}

/* ═══ FOCUS MODE (Tinder-like card swiper) ═══ */

function FocusMode({ title, items, initialSentSet, initialLaterSet, onClose, onSent }) {
  const [currentIdx, setCurrentIdx] = useState(0);
  const [sentSet, setSentSet] = useState(initialSentSet || new Set());
  const [laterSet, setLaterSet] = useState(initialLaterSet || new Set());
  const [showToast, setShowToast] = useState(false);
  const [toastUser, setToastUser] = useState('');
  const [expandedSummary, setExpandedSummary] = useState(false);
  // replyMode removed — input is always visible via tabs
  const [replyVal, setReplyVal] = useState('');
  const [agentOverlayOpen, setAgentOverlayOpen] = useState(false);
  const [chatDetailOpen, setChatDetailOpen] = useState(false);
  const [currentDraft, setCurrentDraft] = useState('');
  const [customSentMsg, setCustomSentMsg] = useState('');
  const replyInputRef = useRef(null);
  const [reasoningSheet, setReasoningSheet] = useState(null);
  const [slideDir, setSlideDir] = useState('none'); // 'left' | 'right' | 'none'
  const [animKey, setAnimKey] = useState(0);
  const touchStartX = useRef(0);
  const touchDeltaX = useRef(0);

  const item = items[currentIdx];
  const allDone = !item || currentIdx >= items.length;

  // Split draft into 2 messages
  const splitDraft = (draft) => {
    if (!draft) return [];
    const sentences = draft.split(/(?<=[.!?])\s+/);
    if (sentences.length <= 1) return [draft];
    const splitIdx = Math.max(1, sentences.length - 1);
    return [sentences.slice(0, splitIdx).join(' '), sentences.slice(splitIdx).join(' ')];
  };
  const draftParts = allDone ? [] : splitDraft(currentDraft || (item && item.draft));
  const isSent = allDone ? false : sentSet.has(item && item.user);
  const isLater = allDone ? false : laterSet.has(item && item.user);

  const goNext = () => {
    if (currentIdx < items.length) {
      setSlideDir('left');
      setAnimKey(k => k + 1);
      setExpandedSummary(false);
      setReplyVal('');
      setCustomSentMsg('');
      setTimeout(() => setCurrentIdx(i => i + 1), 50);
    }
  };
  const goPrev = () => {
    if (currentIdx > 0) {
      setSlideDir('right');
      setAnimKey(k => k + 1);
      setTimeout(() => setCurrentIdx(i => i - 1), 50);
    }
  };

  const undoTimerRef = useRef(null);
  const prevIdxRef = useRef(0);

  const handleSend = () => {
    // Step 1: Drafts turn blue + toast appears immediately
    setSentSet(prev => new Set([...prev, item.user]));
    setToastUser(item.name || item.user);
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    setShowToast(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
    // Step 2: After 1s, slide to next card (or completion)
    setTimeout(() => {
      if (currentIdx < items.length) {
        goNext();
      }
    }, 1000);
  };

  const handleUndo = () => {
    // Undo: remove from sent, go back to previous card
    const userToUndo = items[prevIdxRef.current]?.user;
    if (userToUndo) setSentSet(prev => { const n = new Set(prev); n.delete(userToUndo); return n; });
    setShowToast(false);
    clearTimeout(undoTimerRef.current);
    // Swipe back to previous card
    setSlideDir('right');
    setAnimKey(k => k + 1);
    setExpandedSummary(false);
    setTimeout(() => setCurrentIdx(prevIdxRef.current), 50);
  };

  const handleSendCustomReply = () => {
    if (!replyVal.trim()) return;
    setCustomSentMsg(replyVal);
    setReplyVal('');
    setSentSet(prev => new Set([...prev, item.user]));
    setToastUser(item.name || item.user);
    prevIdxRef.current = currentIdx;
    if (onSent) onSent(item.user);
    // NO auto-advance — user stays on this card and sees a "Next" button
    setShowToast(true);
    clearTimeout(undoTimerRef.current);
    undoTimerRef.current = setTimeout(() => setShowToast(false), 5000);
  };

  // Auto-focus removed — input is always visible

  // Sync currentDraft when card changes
  useEffect(() => {
    if (item) {
      setCurrentDraft(item.draft || '');
      setAgentOverlayOpen(false);
    }
  }, [currentIdx]);

  // Touch swipe handlers
  const onTouchStart = (e) => { touchStartX.current = e.touches[0].clientX; };
  const onTouchMove = (e) => { touchDeltaX.current = e.touches[0].clientX - touchStartX.current; };
  const onTouchEnd = () => {
    if (touchDeltaX.current < -60) goNext();
    else if (touchDeltaX.current > 60) goPrev();
    touchDeltaX.current = 0;
  };

  return (
    <div className="screen-slide-in" style={{ position:'absolute', inset:0, zIndex:100, background:'#fff', display:'flex', flexDirection:'column' }}>

      {/* Header — always visible */}
      <div style={{ padding:'52px 16px 12px', display:'flex', alignItems:'center', gap:12, flexShrink:0 }}>
        <div onClick={() => onClose(sentSet, laterSet)} style={{ cursor:'pointer', padding:8, margin:-8 }}>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#292929" strokeWidth="2" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </div>
        <div style={{ flex:1, textAlign:'center' }}>
          <div style={{ fontSize:16, fontWeight:600, color:'#292929', lineHeight:'20px' }}>{title}</div>
          <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px' }}>{allDone ? 'Done' : (currentIdx + 1) + ' of ' + items.length}</div>
        </div>
        <div style={{ width:24 }} />
      </div>

      {/* Completion state — empty state below header */}
      {allDone ? (
        <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:32 }}>
          <div style={{ fontSize:20, fontWeight:600, color:'#292929', textAlign:'center', lineHeight:'28px', marginBottom:16 }}>All done!</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'center' }}>
            {sentSet.size > 0 && (
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0C8143" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                <span style={{ fontSize:14, fontWeight:500, color:'#0C8143' }}>{sentSet.size} replied</span>
              </div>
            )}
            {laterSet.size > 0 && (
              <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span style={{ fontSize:14, fontWeight:500, color:'#707070' }}>{laterSet.size} for later</span>
              </div>
            )}
          </div>
        </div>
      ) : (
      <>

      {/* Scrollable card area */}
      <div key={animKey} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{ flex:1, overflowY:'auto', padding:'0 16px 16px',
          animation: slideDir === 'left' ? 'slideFromRight .5s cubic-bezier(.25,.46,.45,.94) both' : slideDir === 'right' ? 'slideFromLeft .5s cubic-bezier(.25,.46,.45,.94) both' : 'fadeIn .3s ease both'
        }}>

        {/* Agent summary removed — too much info, user should focus on the reply */}

        {/* Contact card */}
        <div style={{ border:'1px solid #D6D6D6', borderRadius:16, overflow:'hidden', display:'flex', flexDirection:'column' }}>
          {/* Reply sent banner */}
          {isSent && (
            <div style={{
              background:'#DEFFE6', padding:'10px 16px',
              display:'flex', alignItems:'center', gap:8,
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0C8143" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              <span style={{ fontSize:13, fontWeight:500, color:'#0C8143' }}>Reply sent</span>
            </div>
          )}
          {isLater && !isSent && (
            <div style={{
              background:'#F5F5F5', padding:'10px 16px',
              display:'flex', alignItems:'center', gap:8,
            }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span style={{ fontSize:13, fontWeight:500, color:'#707070' }}>Snoozed for later</span>
            </div>
          )}
          <div style={{ padding:20, display:'flex', flexDirection:'column', gap:16 }}>
          {/* Contact info — tappable to open full chat */}
          <div onClick={() => setChatDetailOpen(true)} style={{ display:'flex', alignItems:'center', gap:12, cursor:'pointer' }}>
            <img src={item.avatar} alt="" style={{ width:44, height:44, borderRadius:400, objectFit:'cover', border:'0.5px solid rgba(44,50,58,0.12)' }} />
            <div>
              <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                <span style={{ fontSize:16, fontWeight:600, color:'#292929' }}>{item.name || item.user}</span>
                <span style={{ fontSize:14, color:'#292929' }}>★</span>
              </div>
              {item.tag && (
                <div style={{ display:'inline-block', background:'#F0F0F0', borderRadius:4, padding:'2px 8px', marginTop:4 }}>
                  <span style={{ fontSize:12, fontWeight:400, color:'#707070' }}>
                    {item.tag.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}
                  </span>
                </div>
              )}
            </div>
          </div>

          {/* Message count hint — above the last message */}
          {(() => {
            let count = 0;
            if (item.chatHistory && item.chatHistory.length > 0) count = item.chatHistory.length - 1;
            if (item.timeline) {
              item.timeline.forEach(t => {
                if (t.type === 'session' && t.messages) count += t.messages.length;
                if (t.type === 'comment') count += 1;
              });
            }
            if (count <= 0) return null;
            return (
              <div onClick={() => setChatDetailOpen(true)} style={{ fontSize:12, fontWeight:400, color:'#707070', marginBottom:8, display:'flex', alignItems:'center', gap:2, cursor:'pointer' }}>
                <span>{count} previous messages</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
            );
          })()}

          {/* Last message */}
          <div style={{ background:'#F5F5F5', borderRadius:12, padding:'12px 16px' }}>
            <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>
              {item.chatHistory && item.chatHistory.length > 0 ? item.chatHistory[item.chatHistory.length - 1]?.text : item.msg}
            </div>
          </div>

          {/* Draft section */}
          {!customSentMsg && (
            <>
              {/* Divider — reply ready */}
              {draftParts.length > 0 && (
                <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                  <div style={{ flex:1, height:1, background:'#E0E0E0' }} />
                  <span style={{ fontSize:12, fontWeight:400, color:'#707070', whiteSpace:'nowrap' }}>{draftParts.length}-message reply ready</span>
                  <div style={{ flex:1, height:1, background:'#E0E0E0' }} />
                </div>
              )}

              {/* Draft bubbles */}
              {draftParts.length > 0 && (
                <div style={{ display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end' }}>
                  {draftParts.map((part, pi) => (
                    <div key={pi} style={{
                      padding:12,
                      borderRadius: pi === draftParts.length - 1 ? '12px 12px 2px 12px' : '12px',
                      background: isSent ? '#C2DBFF' : '#fff',
                      border: isSent ? 'none' : '1.5px dashed #292929',
                      transition: 'all .4s ease',
                    }}>
                      <div style={{ fontSize:14, fontWeight:400, fontStyle: isSent ? 'normal' : 'italic', lineHeight:'20px', color:'#292929' }}>{part}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Why this reply */}
              {item.styleReason && !isSent && draftParts.length > 0 && (
                <div onClick={() => setReasoningSheet({ title:'Why this reply', body: item.styleReason })}
                  style={{ display:'flex', alignItems:'center', justifyContent:'flex-end', gap:4, cursor:'pointer' }}>
                  <span style={{ fontSize:13, fontWeight:400, color:'#707070' }}>Why this reply</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              )}

              {/* No draft explanation */}
              {draftParts.length === 0 && !isSent && item.noDraftReason && (
                <div style={{ display:'flex', alignItems:'flex-start', gap:8, padding:'12px 0 4px' }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" style={{ flexShrink:0, marginTop:1 }}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                  <span style={{ fontSize:13, fontWeight:400, color:'#707070', lineHeight:'18px' }}>{item.noDraftReason}</span>
                </div>
              )}
            </>
          )}

          {/* Custom sent message — shown after user sends their own reply */}
          {customSentMsg && (
            <div className="fade-up" style={{ display:'flex', justifyContent:'flex-end', marginTop:8 }}>
              <div style={{ maxWidth:288, padding:'12px 16px', borderRadius:'12px 12px 2px 12px', background:'#C2DBFF', transition:'all .4s ease' }}>
                <div style={{ fontSize:14, fontWeight:400, lineHeight:'20px', color:'#292929' }}>{customSentMsg}</div>
              </div>
            </div>
          )}
        </div>
        </div>{/* end padding wrapper */}
      </div>{/* end card */}

      {/* Bottom section — action buttons + tabbed input */}
      <div style={{ flexShrink:0 }}>
        {/* Action buttons */}
        {isSent ? (
          /* After sending (custom reply) — show Next button */
          <div style={{ padding:'8px 16px', display:'flex', gap:8 }}>
            <button onClick={() => goNext()}
              style={{ flex:1, padding:'14px 0', background:'#292929', border:'none', borderRadius:12, fontSize:17, fontWeight:500, color:'#fff', cursor:'pointer', lineHeight:'24px' }}>
              Next
            </button>
          </div>
        ) : (
          /* Before sending — Later + Send replies */
          <div style={{ padding:'8px 16px', display:'flex', gap:8 }}>
            <button onClick={() => { setLaterSet(prev => new Set([...prev, item.user])); goNext(); }}
              style={{ flex: draftParts.length > 0 ? 1 : 'none', padding:'14px 24px', background:'#F0F0F0', border:'none', borderRadius:12, fontSize:17, fontWeight:500, color:'#292929', cursor:'pointer', lineHeight:'24px' }}>
              Later
            </button>
            {draftParts.length > 0 && (
              <button onClick={handleSend}
                style={{ flex:1, padding:'14px 0', background:'#292929', border:'none', borderRadius:12, fontSize:17, fontWeight:500, color:'#fff', cursor:'pointer', lineHeight:'24px' }}>
                Send replies
              </button>
            )}
          </div>
        )}

        {/* Tabbed input card: Your reply / Ask Agent */}
        <div style={{ margin:'0 16px 16px' }}>
          <div style={{ background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:8, display:'flex', flexDirection:'column', gap:8 }}>
            {/* Tabs */}
            <div style={{ display:'flex', gap:4 }}>
              <div style={{ padding:'5px 12px', fontSize:12, fontWeight:500, color:'#292929', background:'#F0F0F0', borderRadius:8, cursor:'default' }}>Your reply</div>
              <div onClick={() => setAgentOverlayOpen(true)} style={{ padding:'5px 12px', fontSize:12, fontWeight:500, color:'#707070', background:'transparent', borderRadius:8, cursor:'pointer' }}>Ask Agent</div>
            </div>
            {/* Input row */}
            <div style={{ display:'flex', gap:8, alignItems:'center' }}>
              <textarea ref={replyInputRef} value={replyVal} onChange={e => setReplyVal(e.target.value)}
                placeholder="Type in..."
                rows={1}
                onInput={e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; }}
                style={{ flex:1, fontSize:16, color: replyVal ? '#292929' : '#878787', lineHeight:'24px', border:'none', outline:'none', resize:'none', minHeight:24, maxHeight:120, fontFamily:'Inter, system-ui, sans-serif', background:'transparent' }} />
              {replyVal.trim() && (
                <div onClick={handleSendCustomReply}
                  style={{ width:36, height:36, borderRadius:20, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>

      {/* Toast */}
      {showToast && (
        <div style={{ position:'absolute', bottom:180, left:0, right:0, display:'flex', justifyContent:'center', zIndex:110, animation:'toastUp .4s cubic-bezier(.25,.46,.45,.94) both' }}>
          <div style={{ background:'#292929', color:'#fff', padding:'10px 20px', borderRadius:12, fontSize:13, fontWeight:500, display:'flex', alignItems:'center', gap:12, boxShadow:'0 4px 16px rgba(0,0,0,0.12)' }}>
            <span>Reply sent to {toastUser}</span>
            <button onClick={handleUndo} style={{ background:'none', border:'none', color:'#fff', fontWeight:700, cursor:'pointer', fontSize:13, textDecoration:'underline' }}>Undo</button>
          </div>
        </div>
      )}

      {/* Full Chat Detail */}
      {chatDetailOpen && item && (
        <ChatDetail
          item={item}
          label={item.intent || ''}
          labelColor="#707070"
          onClose={() => {
            setChatDetailOpen(false);
            // If this contact was replied to, mark as sent and advance
            if (sentSet.has(item.user)) {
              setTimeout(() => {
                if (currentIdx < items.length) goNext();
              }, 300);
            }
          }}
          isSensitive={false}
          onSent={(user, text) => { setSentSet(prev => new Set([...prev, user])); if (onSent) onSent(user); }}
          draftMode="suggest"
          isFirstSend={true}
          onFirstSend={() => {}}
        />
      )}

      {/* Agent Overlay */}
      {agentOverlayOpen && (
        <AgentOverlay
          item={item}
          draft={currentDraft || item.draft}
          onChangeDraft={(newDraft) => setCurrentDraft(newDraft)}
          onClose={() => setAgentOverlayOpen(false)}
        />
      )}

      {/* Reasoning Sheet */}
      {reasoningSheet && (
        <ReasoningSheet title={reasoningSheet.title} body={reasoningSheet.body}
          onClose={() => setReasoningSheet(null)} showFeedback={true} />
      )}

      </>
      )}
    </div>
  );
}

/* ═══ AGENT CHAT HOME ═══ */

function AgentChatHome({ onOverlayChange }) {
  const [messages, setMessages] = useState([]);
  const [inputVal, setInputVal] = useState('');
  const [openChat, setOpenChat] = useState(null);
  const [focusMode, setFocusMode] = useState(null); // null or { title, items }
  const [reasoningSheet, setReasoningSheet] = useState(null);
  const [globalSentSet, setGlobalSentSet] = useState(new Set());
  const [globalLaterSet, setGlobalLaterSet] = useState(new Set());
  const chatRef = useRef(null);
  const inputRef = useRef(null);

  // Seed morning brief on mount
  useEffect(() => {
    const leadsWithDrafts = INTERESTED_ITEMS.filter(i => i.draft).length;
    const initial = [
      { type:'agent', content:'Morning, Sofia', delay:300 },
      { type:'agent', content: leadsWithDrafts + ' leads are ready to buy \u2014 ' + INTERESTED_ITEMS[0].name + ' has been following you for 2 years and just asked about the 12-week program. Replies are ready.', delay:800,
        cardLabel: 'ready to buy',
        cardSubtitle: 'They asked about pricing or signing up',
        cards: INTERESTED_ITEMS.slice(0,3).map(item => ({
          user: item.user, name: item.name, avatar: item.avatar, _item: item,
        })),
        suggestions: ['What else for today?'],
      },
    ];
    initial.forEach((msg, i) => {
      setTimeout(() => {
        setMessages(prev => [...prev, { ...msg, id: Date.now() + i }]);
        setTimeout(() => chatRef.current?.scrollTo({ top: chatRef.current.scrollHeight, behavior:'smooth' }), 100);
      }, msg.delay);
    });
  }, []);

  // Scroll to bottom when messages change
  useEffect(() => {
    if (chatRef.current) {
      setTimeout(() => chatRef.current?.scrollTo({ top: chatRef.current.scrollHeight, behavior:'smooth' }), 100);
    }
  }, [messages.length]);

  // Pre-built responses
  const getResponse = (query) => {
    const q = query.toLowerCase();
    const allItems = [...INTERESTED_ITEMS, ...ATTENTION_ITEMS, ...COMMUNITY_ITEMS];
    const leadsWithDrafts = INTERESTED_ITEMS.filter(i => i.draft).length;

    // --- Name/handle search (most specific, check first) ---
    const nameMatch = allItems.find(item =>
      q.includes(item.user.replace('@','').toLowerCase()) ||
      (item.name.toLowerCase().split(' ')[0].length > 2 && q.includes(item.name.toLowerCase().split(' ')[0]))
    );
    if (nameMatch) {
      return {
        reasoning: 'I found ' + nameMatch.name + ' in your messages. ' + (nameMatch.context || ''),
        content: 'Here\'s what I have on ' + nameMatch.name + ':',
        cardLabel: nameMatch.name,
        cardSubtitle: nameMatch.agentRead || nameMatch.summary,
        cards: [{ user: nameMatch.user, name: nameMatch.name, avatar: nameMatch.avatar, _item: nameMatch }],
      };
    }

    // --- Support / Urgent ---
    if (q.match(/support|help|issue|problem|urgent|attention|broken|error|refund|blocked|can.t access/)) {
      return {
        reasoning: 'I prioritized by urgency \u2014 clients who need immediate help, can\'t access their purchases, or have unresolved issues that could escalate.',
        content: 'These contacts need your help:',
        cardLabel: 'need your attention',
        cardSubtitle: 'They need personal support from you',
        cards: ATTENTION_ITEMS.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Leads / Sales ---
    if (q.match(/money|revenue|lead|interested|sales|buy|purchase|paying|convert|hot|ready to buy/)) {
      return {
        reasoning: 'I ranked by purchase intent \u2014 people who mentioned pricing, asked how to sign up, or showed strong buying signals in their messages.',
        content: 'These are your highest-intent leads:',
        cardLabel: 'ready to buy',
        cardSubtitle: 'They asked about pricing or signing up',
        cards: INTERESTED_ITEMS.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Community / Fans ---
    if (q.match(/engag|fan|communit|follow|loyal|love|thank|appreciat/)) {
      return {
        reasoning: 'I looked at engagement signals \u2014 comments, saves, shares, and DM frequency. These followers interact with your content the most consistently.',
        content: 'Here are your most engaged followers:',
        cardLabel: 'engaged followers',
        cardSubtitle: 'Good chance to build relationships',
        cards: COMMUNITY_ITEMS.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Collaborations ---
    if (q.match(/collaborat|partner|brand|collab|creator|sponsor/)) {
      const collabs = COMMUNITY_ITEMS.filter(i => (i.msg + ' ' + (i.summary||'')).toLowerCase().match(/collab|partner|creator|brand|podcast|feature/));
      const items = collabs.length > 0 ? collabs : COMMUNITY_ITEMS.slice(0,4);
      return {
        reasoning: 'I filtered for contacts mentioning collaborations, partnerships, or brand deals.',
        content: collabs.length > 0 ? 'Here are potential partnerships:' : 'No explicit collab requests today. Here are engaged creators who might be open to it:',
        cardLabel: 'potential partnerships',
        cardSubtitle: 'Could drive new audience to you',
        cards: items.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Unanswered / Waiting ---
    if (q.match(/unanswer|waiting|pending|no reply|haven.t replied|forgot|overdue/)) {
      const waiting = allItems.filter(i => !i.draft && i.chatHistory && i.chatHistory.length > 0);
      return {
        reasoning: 'I checked for conversations where you haven\'t replied yet and no draft is ready.',
        content: waiting.length > 0 ? (waiting.length + ' people are still waiting for a reply:') : 'Everyone has been replied to or has a draft ready!',
        cardLabel: 'waiting for reply',
        cardSubtitle: 'Don\'t leave them hanging',
        cards: waiting.slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Show me more / What else / Progressive disclosure (MUST be before "New / Today") ---
    if (q.match(/what else|show me more|else.*today|what.*today|more for today|anything else/)) {
      const shownCards = messages.filter(m => m.cardLabel).map(m => m.cardLabel);
      const attentionShown = shownCards.includes('need your attention');
      const communityShown = shownCards.includes('community');

      if (!attentionShown) {
        return {
          reasoning: 'Showing the next priority — support issues that need personal attention.',
          content: ATTENTION_ITEMS.length + ' people need your help \u2014 ' + ATTENTION_ITEMS[0].name + ' has been locked out since yesterday.',
          cardLabel: 'need your attention',
          cardSubtitle: 'They need personal support from you',
          cards: ATTENTION_ITEMS.slice(0,3).map(item => ({
            user: item.user, name: item.name, avatar: item.avatar, _item: item,
          })),
          suggestions: ['Anything else?'],
        };
      }
      if (!communityShown) {
        const withDrafts = COMMUNITY_ITEMS.filter(i => i.draft).length;
        return {
          reasoning: 'Community messages — fans and engagement worth acknowledging.',
          content: withDrafts + ' community messages have replies ready. The rest are good vibes I filtered for you.',
          cardLabel: 'community',
          cardSubtitle: 'A little love goes a long way',
          cards: COMMUNITY_ITEMS.filter(i => i.draft).slice(0,3).map(item => ({
            user: item.user, name: item.name, avatar: item.avatar, _item: item,
          })),
        };
      }
      return {
        content: 'That\'s everything for now. I\'ll let you know when something new comes in.',
      };
    }

    // --- New / Today ---
    if (q.match(/\bnew\b|today|recent|latest|just came|overnight|morning/)) {
      const recent = allItems.filter(i => i.time && i.time.match(/just now|min|[1-5]h/));
      return {
        reasoning: 'I filtered for messages that arrived in the last few hours.',
        content: recent.length > 0 ? (recent.length + ' new messages came in today:') : 'No brand new messages right now. Here are the most recent:',
        cardLabel: 'new today',
        cardSubtitle: 'Fresh conversations to review',
        cards: (recent.length > 0 ? recent : allItems).slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Returning clients ---
    if (q.match(/return|came back|repeat|again|upgrade|previous|past client|vip/)) {
      const returning = INTERESTED_ITEMS.filter(i => (i.context + ' ' + (i.summary||'')).toLowerCase().match(/return|upgrade|previous|came back|past|vip/));
      return {
        reasoning: 'I looked for contacts who have purchased before or are coming back for an upgrade.',
        content: returning.length > 0 ? 'These are returning clients:' : 'No returning clients in today\'s messages. Here are your top leads instead:',
        cardLabel: 'returning clients',
        cardSubtitle: 'They already trust you \u2014 easy upsell',
        cards: (returning.length > 0 ? returning : INTERESTED_ITEMS).slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Testimonials ---
    if (q.match(/testimonial|review|feedback|result|success|proof|screenshot/)) {
      const testimonials = COMMUNITY_ITEMS.filter(i => (i.msg + ' ' + (i.summary||'')).toLowerCase().match(/result|kg|lb|invest|change|transform|work|best|proud|finish|complet/));
      return {
        reasoning: 'I looked for messages with positive results or unprompted praise \u2014 these are your best testimonial candidates.',
        content: testimonials.length > 0 ? 'These could be great testimonials:' : 'I didn\'t find strong testimonial candidates today.',
        cardLabel: 'testimonial candidates',
        cardSubtitle: 'Turn their wins into social proof',
        cards: (testimonials.length > 0 ? testimonials : COMMUNITY_ITEMS).slice(0,4).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
      };
    }

    // --- Stats / Overview ---
    if (q.match(/how many|stats|overview|summary|number|report|total|count/)) {
      return {
        reasoning: 'Here\'s a snapshot of your current inbox state.',
        content: 'Here\'s your inbox overview:\n\n' +
          '\u2022 ' + STATS.totalHandled + ' messages processed\n' +
          '\u2022 ' + STATS.interested + ' active leads (' + INTERESTED_ITEMS.filter(i=>i.draft).length + ' with replies ready)\n' +
          '\u2022 ' + STATS.attention + ' support issues pending\n' +
          '\u2022 ' + STATS.community + ' community messages\n' +
          '\u2022 ' + STATS.spamFiltered + ' spam filtered\n' +
          '\u2022 Estimated ' + STATS.timeSaved + ' minutes saved today',
      };
    }

    // --- What should I do / Priority ---
    if (q.match(/what should|where do i|start|next|suggest|recommend|priorit|first/)) {
      const topAttention = ATTENTION_ITEMS[0];
      const topLead = INTERESTED_ITEMS[0];
      return {
        reasoning: 'I prioritized by urgency first, then revenue impact, then engagement value.',
        content: 'Here\'s what I\'d prioritize:\n\n' +
          '1. ' + (topAttention ? topAttention.name : '') + ' \u2014 ' + (topAttention ? topAttention.summary : '') + '. This is urgent.\n' +
          '2. Your top leads \u2014 ' + INTERESTED_ITEMS.filter(i=>i.draft).length + ' have replies ready to send.\n' +
          '3. Community engagement when you have time.',
        cardLabel: 'top priority',
        cardSubtitle: 'Highest impact right now',
        cards: [
          ...(topAttention ? [{ user: topAttention.user, name: topAttention.name, avatar: topAttention.avatar, _item: topAttention }] : []),
          { user: topLead.user, name: topLead.name, avatar: topLead.avatar, _item: topLead },
        ],
      };
    }

    // --- Spam ---
    if (q.match(/spam|filter|block|junk/)) {
      return {
        reasoning: 'I automatically filter spam, bot messages, and generic greetings with no follow-up.',
        content: 'I filtered ' + STATS.spamFiltered + ' spam messages today. Your inbox only shows real conversations that need your attention.\n\nI filter:\n\u2022 Bot messages and automated DMs\n\u2022 Generic greetings with no follow-up\n\u2022 Duplicate messages\n\u2022 Known spam patterns',
      };
    }

    // --- Business context ---
    if (q.match(/business|my brand|my audience|my niche|who am i|about me|my product|my program/)) {
      return {
        reasoning: 'I\'m sharing what I know about your business based on the messages and interactions I\'ve analyzed.',
        content: 'Based on what I see in your DMs:\n\n' +
          '\u2022 You run fitness coaching programs: a 4-Week Kickstart ($197) and a 12-Week Reboot ($597 or 3x$197).\n' +
          '\u2022 Your audience is mostly women aged 25-40, interested in transformation and wellness.\n' +
          '\u2022 About 30% of inquiries come from men.\n' +
          '\u2022 Your strongest conversion content: transformation reels and before/after posts.\n' +
          '\u2022 Common objections: pricing, beginner-friendliness, and program format.\n\n' +
          'Want me to dig deeper?',
        suggestions: ['Show me leads', 'Who are my most loyal fans?', 'Any unanswered messages?'],
      };
    }

    // --- Fallback with suggestion chips ---
    return {
      content: 'I\'m not sure what you\'re looking for. Try one of these:',
      suggestions: ['Show me leads', 'Who needs support?', 'What should I do first?'],
    };
  };

  const handleSend = () => {
    if (!inputVal.trim()) return;
    const query = inputVal.trim();
    setInputVal('');

    // Add user message
    setMessages(prev => [...prev, { type:'user', content:query, id:Date.now() }]);

    // Add thinking
    setTimeout(() => {
      setMessages(prev => [...prev, { type:'thinking', id:Date.now()+1 }]);
    }, 300);

    // Replace thinking with response
    setTimeout(() => {
      const response = getResponse(query);
      setMessages(prev => {
        const withoutThinking = prev.filter(m => m.type !== 'thinking');
        return [...withoutThinking, {
          type:'agent',
          content: response.content,
          cards: response.cards,
          cardLabel: response.cardLabel,
          cardSubtitle: response.cardSubtitle,
          reasoning: response.reasoning,
          suggestions: response.suggestions,
          id: Date.now()+2,
        }];
      });
    }, 1800);
  };

  const handleOpenChat = (item) => {
    setOpenChat({ item, label:'', labelColor:'#707070', isSensitive:false });
    if (onOverlayChange) onOverlayChange(true);
  };

  const handleCloseChat = () => {
    setOpenChat(null);
    if (onOverlayChange) onOverlayChange(false);
  };

      {/* Sticky header: iOS status bar + Inbox title */}
      <div style={{ position:'absolute', top:0, left:0, right:0, zIndex:20, background:'#fff', borderBottom: scrolled ? '1px solid #E0E2E5' : '1px solid transparent', transition:'border-color 0.2s ease' }}>
        {/* iOS Status Bar */}
        <div style={{ padding:'14px 24px 0', display:'flex', justifyContent:'space-between', alignItems:'center', height:44 }}>
          <span style={{ fontSize:15, fontWeight:600, color:'#292929', letterSpacing:'-0.3px' }}>9:41</span>
          <div style={{ display:'flex', alignItems:'center', gap:5 }}>
            {/* Signal */}
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#292929"/><rect x="4.5" y="4.5" width="3" height="7.5" rx="0.5" fill="#292929"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="#292929"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#292929"/></svg>
            {/* WiFi */}
            <svg width="16" height="12" viewBox="0 0 16 12" fill="#292929"><path d="M8 11.5a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z"/><path d="M4.94 7.94a4.5 4.5 0 016.12 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/><path d="M2.81 5.81a7.5 7.5 0 0110.38 0" stroke="#292929" strokeWidth="1.4" strokeLinecap="round" fill="none"/></svg>
            {/* Battery */}
            <svg width="27" height="12" viewBox="0 0 27 12" fill="none"><rect x="0.5" y="0.5" width="22" height="11" rx="2" stroke="#292929" strokeWidth="1" fill="none"/><rect x="2" y="2" width="19" height="8" rx="1" fill="#292929"/><rect x="24" y="3.5" width="2.5" height="5" rx="1" fill="#292929"/></svg>
          </div>
        </div>
        {/* Inbox header */}
        <div style={{ padding:'8px 16px 12px', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:17, fontWeight:600, color:'#292929' }}>Inbox</span>
          <div style={{ display:'flex', alignItems:'center', gap:4, background:'#EBF5FF', borderRadius:100, padding:'3px 10px' }}>
            <div style={{ width:6, height:6, borderRadius:3, background:'#2952CC', animation:'pulse 2s ease infinite' }} />
            <span style={{ fontSize:11, fontWeight:600, color:'#2952CC' }}>Active</span>
          </div>
        </div>
      </div>

      {/* Scrollable chat — bottom-gravity like Claude */}
      <div ref={chatRef} onScroll={(e) => setScrolled(e.target.scrollTop > 10)} style={{ flex:1, overflowY:'auto', padding:'100px 16px 160px', display:'flex', flexDirection:'column', gap:24, justifyContent:'flex-end' }}>
        {messages.map((msg) => {
          if (msg.type === 'thinking') {
            return (
              <div key={msg.id} style={{ animation:'fadeUp .3s ease both' }}>
                <div style={{ fontSize:14, color:'#707070', animation:'pulse 1.2s ease infinite' }}>Thinking...</div>
              </div>
            );
          }
          if (msg.type === 'user') {
            return (
              <div key={msg.id} style={{ display:'flex', justifyContent:'flex-end', animation:'fadeUp .3s ease both' }}>
                <div style={{ maxWidth:288, padding:'12px 16px', borderRadius:'12px 12px 2px 12px', background:'#F5F5F5' }}>
                  <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929' }}>{msg.content}</div>
                </div>
              </div>
            );
          }
          // Agent message
          return (
            <div key={msg.id} style={{ display:'flex', flexDirection:'column', gap:12, animation:'fadeUp .4s ease both' }}>
              {/* Text content — render newlines and bullets */}
              <div style={{ fontSize:16, fontWeight:400, lineHeight:'24px', color:'#292929', whiteSpace:'pre-line' }}>
                {msg.content?.split('\n').map((line, li) => {
                  if (line.startsWith('\u2022')) {
                    return <div key={li} style={{ paddingLeft:8, display:'flex', gap:8 }}><span>{'\u2022'}</span><span>{line.substring(1).trim()}</span></div>;
                  }
                  if (li === 0 && msg.content.startsWith('Morning')) {
                    return <div key={li} style={{ fontSize:28, fontWeight:700, lineHeight:'36px', letterSpacing:'-0.5px' }}>{line}</div>;
                  }
                  return <div key={li}>{line}</div>;
                })}
              </div>

              {/* Reasoning disclosure — only for user-initiated queries */}
              {msg.reasoning && (
                <div onClick={() => setReasoningSheet({ title:'Thought', body: msg.reasoning })}
                  style={{ display:'flex', alignItems:'center', gap:6, cursor:'pointer', padding:'8px 0' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                  </svg>
                  <span style={{ fontSize:13, fontWeight:400, color:'#707070' }}>Thought</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#707070" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
              )}

              {/* Compact grouped contact card */}
              {msg.cards && msg.cards.length > 0 && (() => {
                const allSent = msg.cards.every(c => globalSentSet.has(c.user) || globalLaterSet.has(c.user));
                const sentCount = msg.cards.filter(c => globalSentSet.has(c.user)).length;
                const laterCount = msg.cards.filter(c => globalLaterSet.has(c.user)).length;
                return (
                <div onClick={() => { setFocusMode({ title: msg.cardLabel || 'Contacts', items: msg.cards.map(c => c._item) }); if (onOverlayChange) onOverlayChange(true); }}
                  style={{ border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.08)', padding:16, display:'flex', alignItems:'center', gap:12, cursor:'pointer' }}>
                  {/* Stacked avatars — max 2 + count */}
                  <div style={{ display:'flex', alignItems:'center', flexShrink:0 }}>
                    {msg.cards.slice(0, 2).map((card, ci) => (
                      <img key={ci} src={card.avatar} alt="" style={{ width:40, height:40, borderRadius:400, objectFit:'cover', border:'2px solid #fff', marginLeft: ci > 0 ? -12 : 0, position:'relative', zIndex: 3 - ci }} />
                    ))}
                    {msg.cards.length > 2 && (
                      <div style={{ width:40, height:40, borderRadius:400, background:'#F0F0F0', border:'2px solid #fff', marginLeft:-12, position:'relative', zIndex:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
                        <span style={{ fontSize:13, fontWeight:600, color:'#707070' }}>+{msg.cards.length - 2}</span>
                      </div>
                    )}
                  </div>
                  {/* Text */}
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:14, fontWeight:500, color:'#292929', lineHeight:'20px' }}>{msg.cards.length} {msg.cardLabel || 'contacts'}</div>
                    <div style={{ fontSize:12, fontWeight:400, color:'#707070', lineHeight:'16px' }}>{msg.cardSubtitle || 'Tap to view'}</div>
                    {(sentCount > 0 || laterCount > 0) && (
                      <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:4, flexWrap:'wrap' }}>
                        {sentCount > 0 && (
                          <span style={{ fontSize:12, fontWeight:500, color:'#0C8143' }}>{sentCount} replied</span>
                        )}
                        {laterCount > 0 && (
                          <span style={{ fontSize:12, fontWeight:500, color:'#707070' }}>{laterCount} for later</span>
                        )}
                      </div>
                    )}
                  </div>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D6D6D6" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>
                </div>
                );
              })()}

              {/* Suggestion chips — inline, right-aligned */}
              {msg.suggestions && (
                <div style={{ display:'flex', flexWrap:'wrap', gap:8, justifyContent:'flex-end' }}>
                  {msg.suggestions.map((s, i) => (
                    <div key={i} onClick={() => { setTimeout(() => {
                      setMessages(prev => prev.map(m => m.suggestions ? { ...m, suggestions: null } : m));
                      setMessages(prev => [...prev, { type:'user', content: s, id: Date.now() }]);
                      setTimeout(() => {
                        setMessages(prev => [...prev, { type:'thinking', id: Date.now() }]);
                        setTimeout(() => {
                          const resp = getResponse(s);
                          setMessages(prev => {
                            const filtered = prev.filter(m => m.type !== 'thinking');
                            return [...filtered, {
                              type: 'agent', content: resp.content, id: Date.now(),
                              ...(resp.reasoning ? { reasoning: resp.reasoning } : {}),
                              ...(resp.suggestions ? { suggestions: resp.suggestions } : {}),
                              ...(resp.cards ? { cardLabel: resp.cardLabel, cardSubtitle: resp.cardSubtitle, cards: resp.cards } : {}),
                            }];
                          });
                        }, 1500);
                      }, 300);
                    }, 10); }}
                      style={{ padding:'8px 14px', background:'#F5F5F5', border:'1px solid #E0E2E5',
                        borderRadius:100, fontSize:13, fontWeight:500, color:T.ink, cursor:'pointer',
                        WebkitTapHighlightColor:'transparent' }}>
                      {s}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Input bar */}
      <div style={{ position:'absolute', bottom:90, left:16, right:16, background:'#fff', border:'1px solid #D6D6D6', borderRadius:12, boxShadow:'0 8px 16px rgba(132,146,166,0.12)', padding:'8px 16px', display:'flex', alignItems:'center', gap:8, zIndex:10 }}>
        <input ref={inputRef} value={inputVal} onChange={e => setInputVal(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && inputVal.trim()) handleSend(); }}
          placeholder="Ask me anything"
          style={{ flex:1, fontSize:16, color: inputVal ? '#292929' : '#878787', lineHeight:'24px', border:'none', outline:'none', background:'transparent', fontFamily:'Inter, system-ui, sans-serif' }} />
        {inputVal.trim() && (
          <div onClick={handleSend}
            style={{ width:36, height:36, borderRadius:20, background:'#292929', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
        )}
      </div>

      {/* Reasoning Sheet */}
      {reasoningSheet && (
        <ReasoningSheet title={reasoningSheet.title} body={reasoningSheet.body}
          onClose={() => setReasoningSheet(null)} showFeedback={true} />
      )}

      {/* Focus Mode */}
      {focusMode && (
        <FocusMode
          title={focusMode.title}
          items={focusMode.items}
          initialSentSet={globalSentSet}
          initialLaterSet={globalLaterSet}
          onClose={(finalSentSet, finalLaterSet) => {
            const newlySent = finalSentSet ? [...finalSentSet].filter(u => !globalSentSet.has(u)) : [];
            const newlyLater = finalLaterSet ? [...finalLaterSet].filter(u => !globalLaterSet.has(u)) : [];
            if (finalSentSet) setGlobalSentSet(new Set([...globalSentSet, ...finalSentSet]));
            if (finalLaterSet) setGlobalLaterSet(new Set([...globalLaterSet, ...finalLaterSet]));

            // Smart summary message
            if (newlySent.length > 0 || newlyLater.length > 0) {
              const parts = [];
              if (newlySent.length > 0) parts.push(newlySent.length + ' replied');
              if (newlyLater.length > 0) parts.push(newlyLater.length + ' snoozed for later');
              setMessages(prev => [...prev, {
                type: 'agent',
                content: parts.join(', ') + '.',
                id: Date.now(),
              }]);
            }

            // Proactive next step — find what hasn't been shown yet
            const shownCards = messages.filter(m => m.cardLabel).map(m => m.cardLabel);
            const allHandled = [...(finalSentSet || []), ...(finalLaterSet || [])];
            setTimeout(() => {
              if (!shownCards.includes('need your attention') && ATTENTION_ITEMS.length > 0) {
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'Next up: ' + ATTENTION_ITEMS.length + ' people need your help \u2014 ' + ATTENTION_ITEMS[0].name + ' has been waiting since yesterday.',
                  cardLabel: 'need your attention',
                  cardSubtitle: 'They need personal support from you',
                  cards: ATTENTION_ITEMS.slice(0,3).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
                  id: Date.now() + 1,
                }]);
              } else if (!shownCards.includes('community')) {
                const withDrafts = COMMUNITY_ITEMS.filter(i => i.draft).length;
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'When you have a moment: ' + withDrafts + ' community messages have replies ready.',
                  cardLabel: 'community',
                  cardSubtitle: 'A little love goes a long way',
                  cards: COMMUNITY_ITEMS.filter(i => i.draft).slice(0,3).map(item => ({ user: item.user, name: item.name, avatar: item.avatar, _item: item })),
                  id: Date.now() + 1,
                }]);
              } else {
                setMessages(prev => [...prev, {
                  type: 'agent',
                  content: 'You\'re all caught up for now. I\'ll let you know when something new comes in.',
                  id: Date.now() + 1,
                }]);
              }
            }, 800);

            setFocusMode(null);
            if (onOverlayChange) onOverlayChange(false);
          }}
          onSent={(user) => { setGlobalSentSet(prev => new Set([...prev, user])); }}
        />
      )}

      {/* Chat Detail */}
      {openChat && (
        <ChatDetail item={openChat.item} label={openChat.label} labelColor={openChat.labelColor}
          onClose={handleCloseChat} isSensitive={openChat.isSensitive}
          onSent={(user, text) => {}} draftMode={'suggest'}
          isFirstSend={true} onFirstSend={() => {}} />
      )}
    </div>
  );
}

        <div style={{ display:'flex', flexDirection:'column', gap:12, marginTop:8, ...show(3) }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:4, borderRadius:2, background:'rgba(255,255,255,0.4)', flexShrink:0 }} />
            <span style={{ fontSize:15, fontWeight:400, color:'rgba(255,255,255,0.55)', lineHeight:'22px' }}>Leads who are ready to buy</span>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:4, borderRadius:2, background:'rgba(255,255,255,0.4)', flexShrink:0 }} />
            <span style={{ fontSize:15, fontWeight:400, color:'rgba(255,255,255,0.55)', lineHeight:'22px' }}>Clients who need your help</span>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <div style={{ width:4, height:4, borderRadius:2, background:'rgba(255,255,255,0.4)', flexShrink:0 }} />
            <span style={{ fontSize:15, fontWeight:400, color:'rgba(255,255,255,0.55)', lineHeight:'22px' }}>Community worth engaging with</span>
          </div>
        </div>
        <div style={{ marginTop:4, ...show(4) }}>
          <div style={{ fontSize:16, fontWeight:400, color:'rgba(255,255,255,0.7)', lineHeight:'24px' }}>
            You focus on what matters. I handle the rest.
          </div>
        </div>
      </div>
      <div style={show(5)}>
        <button onClick={onNext}
          style={{ width:'100%', height:52, background:'#fff', color:'#000', border:'none', borderRadius:14, fontSize:17, fontWeight:600, cursor:'pointer', letterSpacing:'-0.01em' }}>
          Connect Instagram
        </button>
      </div>
    </div>
  );
}

function useCountUp(target, duration, active) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!active) return;
    const start = Date.now();
    const timer = setInterval(() => {
      const elapsed = Date.now() - start;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      setVal(Math.round(eased * target));
      if (progress >= 1) clearInterval(timer);
    }, 16);
    return () => clearInterval(timer);
  }, [active]);
  return val;
}

function ObResultsV2b({ onOpenInbox }) {
  const [vis, setVis] = useState(0);
  const [closing, setClosing] = useState(false);

  useEffect(() => {
    const timers = [];
    for (let i = 1; i <= 4; i++) {
      timers.push(setTimeout(() => setVis(i), i * 400 + 300));
    }
    return () => timers.forEach(t => clearTimeout(t));
  }, []);

  function handleOpen() {
    setClosing(true);
    setTimeout(onOpenInbox, 520);
  }

  const show = (i) => ({
    opacity: vis >= i ? 1 : 0,
    transform: vis >= i ? 'translateY(0)' : 'translateY(8px)',
    transition: 'opacity .5s ease, transform .5s ease',
  });

  const n1 = useCountUp(STATS.totalHandled, 800, vis >= 1);
  const n2 = useCountUp(INTERESTED_ITEMS.filter(i=>i.draft).length, 600, vis >= 2);
  const n3 = useCountUp(STATS.spamFiltered, 600, vis >= 2);

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', justifyContent:'flex-end', position:'relative', overflow:'hidden', padding:'0 24px 48px' }}>
      {/* Chat-like results from the agent */}
      <div style={{ display:'flex', flexDirection:'column', gap:16, marginBottom:40 }}>
        <div style={show(1)}>
          <div style={{ fontSize:28, fontWeight:700, color:'#fff', letterSpacing:'-0.5px', lineHeight:'36px' }}>
            Done. Went through {n1} messages.
          </div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:12, marginTop:4, ...show(2) }}>
          <div style={{ fontSize:16, fontWeight:400, color:'rgba(255,255,255,0.7)', lineHeight:'24px' }}>
            {n2} replies are ready to send.
          </div>
          <div style={{ fontSize:16, fontWeight:400, color:'rgba(255,255,255,0.7)', lineHeight:'24px' }}>
            {n3} spam messages filtered out.
          </div>
        </div>
        <div style={{ marginTop:4, ...show(3) }}>
          <div style={{ fontSize:16, fontWeight:400, color:'rgba(255,255,255,0.7)', lineHeight:'24px' }}>
            Your inbox is ready.
          </div>
        </div>
      </div>
      <div style={show(4)}>
        <button onClick={handleOpen}
          style={{ width:'100%', height:52, background:'#fff', color:'#000', border:'none', borderRadius:14, fontSize:17, fontWeight:600, cursor:'pointer', letterSpacing:'-0.01em' }}>
          Open Inbox
        </button>
      </div>
      {closing && (
        <div style={{ position:'absolute', inset:0, zIndex:20, background:'#fff', animation:'fadeIn 0.5s ease both' }} />
      )}
    </div>
  );
}

/* ═══ APP ═══ */

function App() {
  const [screen, setScreen] = useState(window.location.hash === '#inbox' ? 'main' : 'ob-welcome');
  const [hideNav, setHideNav] = useState(false);
  const onOnboarding = screen === 'ob-welcome' || screen === 'ob-loading' || screen === 'ob-results';
  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden' }}>

      {/* ─── Onboarding: clean black background, chat-like ─── */}
      {onOnboarding && (
        <div style={{ position:'absolute', inset:0, background:'#000', zIndex:0 }}>
          <div
            key={screen}
            className="ob-step-layer"
            style={{ position:'absolute', inset:0, zIndex:1 }}
          >
            {screen === 'ob-welcome' && <ObWelcomeV2b onNext={() => setScreen('ob-loading')} />}
            {screen === 'ob-loading' && <ObSorting onNext={() => setScreen('ob-results')} />}
            {screen === 'ob-results' && <ObResultsV2b onOpenInbox={() => setScreen('main')} />}
          </div>
        </div>
      )}

      {/* ─── Inbox ─── */}
      {screen === 'main' && (
        <div style={{ position:'absolute', inset:0, animation:'fadeIn 0.45s ease both' }}>
          <AgentChatHome onOverlayChange={(open) => setHideNav(open)} />
        </div>
      )}

      {/* Bottom Nav — visible on welcome + main inbox, hidden on loading/results/overlays */}
      {screen === 'main' && !hideNav && <BottomNav />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
